name: Recover staged project

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare staged archive slices
        shell: bash
        run: |
          set -e
          clean() { tr -d '\r\n\t ' < "$1"; }
          clean .materialize/part_00 > /tmp/mat0
          clean .materialize/part_01 > /tmp/mat1
          cat /tmp/mat0 /tmp/mat1 > /tmp/materialize.all
          clean .materialize_v2/p00 > /tmp/v200
          clean .materialize_v2/p01 > /tmp/v201
          clean .materialize_v2/p02 > /tmp/v202
          clean .materialize_v2/p03 > /tmp/v203
          clean .materialize_v2/p04 > /tmp/v204
          cat /tmp/v200 /tmp/v201 /tmp/v202 /tmp/v203 /tmp/v204 > /tmp/v2.all
          : > /tmp/bootstrap.all
          for f in .bootstrap/chunk_00 .bootstrap/chunk_01 .bootstrap/chunk_02_03 .bootstrap/chunk_04_05 .bootstrap/chunk_06_07 .bootstrap/chunk_08_09 .bootstrap/chunk_10_11 .bootstrap/chunk_12_13; do
            clean "$f" >> /tmp/bootstrap.all
          done

          report_segments() {
            label="$1"; file="$2"; width="$3"
            echo "=== $label total ==="
            wc -c "$file"
            python3 - "$file" "$width" <<'PY'
          import hashlib, sys
          p=sys.argv[1]; w=int(sys.argv[2]); b=open(p,'rb').read()
          for i in range(0,len(b),w):
              x=b[i:i+w]
              print(f'{i:06d}-{i+len(x)-1:06d} len={len(x):5d} sha256={hashlib.sha256(x).hexdigest()}')
          PY
          }

          {
            report_segments materialize /tmp/materialize.all 8000
            report_segments v2 /tmp/v2.all 8000
            report_segments bootstrap /tmp/bootstrap.all 8000
            echo '=== bootstrap individual cleaned sizes+hashes ==='
            for f in .bootstrap/chunk_00 .bootstrap/chunk_01 .bootstrap/chunk_02_03 .bootstrap/chunk_04_05 .bootstrap/chunk_06_07 .bootstrap/chunk_08_09 .bootstrap/chunk_10_11 .bootstrap/chunk_12_13; do
              t=/tmp/one
              clean "$f" > "$t"
              printf '%s len=' "$f"; wc -c < "$t" | tr -d '\n'; printf ' sha256='; sha256sum "$t" | cut -d' ' -f1
            done
          } > /tmp/recovery-info.txt

      - name: Publish diagnostics branch
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B recovery-preview
          cp /tmp/recovery-info.txt RECOVERY_INFO.txt
          git add RECOVERY_INFO.txt
          git commit -m 'chore: compare staged archive slices' || true
          git push --force origin recovery-preview
