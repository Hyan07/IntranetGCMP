name: Recover staged project

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-project.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild partial archive and recover complete files
        shell: bash
        run: |
          set -u
          rm -rf /tmp/gcmp-recovered /tmp/gcmp-package.*
          mkdir -p /tmp/gcmp-recovered

          cat \
            .bootstrap/chunk_00 \
            .bootstrap/chunk_01 \
            .bootstrap/chunk_02_03 \
            .bootstrap/chunk_04_05 \
            .bootstrap/chunk_06_07 \
            .bootstrap/chunk_08_09 \
            .bootstrap/chunk_10_11 \
            .bootstrap/chunk_12_13 \
            | tr -d '\r\n\t ' > /tmp/gcmp-package.b64

          base64 -d /tmp/gcmp-package.b64 > /tmp/gcmp-package.gz || true
          {
            echo '=== compressed ==='
            file /tmp/gcmp-package.gz || true
            echo '=== compressed bytes ==='
            wc -c /tmp/gcmp-package.gz || true
          } > /tmp/recovery-info.txt

          gzip -dc /tmp/gcmp-package.gz > /tmp/gcmp-package.raw 2>>/tmp/recovery-info.txt || true
          {
            echo '=== decompressed ==='
            file /tmp/gcmp-package.raw || true
            echo '=== decompressed bytes ==='
            wc -c /tmp/gcmp-package.raw || true
            echo '=== first bytes ==='
            xxd -l 64 /tmp/gcmp-package.raw || true
          } >> /tmp/recovery-info.txt

          if tar -tf /tmp/gcmp-package.raw >/tmp/tar-list.txt 2>>/tmp/recovery-info.txt; then
            tar -xf /tmp/gcmp-package.raw -C /tmp/gcmp-recovered
          else
            tar -xf /tmp/gcmp-package.raw -C /tmp/gcmp-recovered --ignore-zeros 2>>/tmp/recovery-info.txt || true
          fi

          echo '=== recovered files ===' >> /tmp/recovery-info.txt
          find /tmp/gcmp-recovered -type f -printf '%P\n' | sort | tee -a /tmp/recovery-info.txt

      - name: Publish recovery preview branch
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B recovery-preview
          rm -rf recovered_project
          mkdir -p recovered_project
          cp -a /tmp/gcmp-recovered/. recovered_project/ || true
          cp /tmp/recovery-info.txt RECOVERY_INFO.txt
          git add RECOVERY_INFO.txt recovered_project
          if git diff --cached --quiet; then
            echo 'Nothing recovered.'
            exit 0
          fi
          git commit -m 'chore: recover staged Intranet project preview'
          git push --force origin recovery-preview
