name: Recover staged project

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover exact files from contiguous staged archive
        shell: bash
        run: |
          set -u
          rm -rf /tmp/gcmp-recovered /tmp/gcmp-package.*
          mkdir -p /tmp/gcmp-recovered
          cat .materialize/part_00 .materialize/part_01 | tr -d '\r\n\t ' > /tmp/gcmp-package.b64
          python3 - <<'PY'
          import base64
          from pathlib import Path
          s = Path('/tmp/gcmp-package.b64').read_text().strip()
          s += '=' * (-len(s) % 4)
          Path('/tmp/gcmp-package.gz').write_bytes(base64.b64decode(s, validate=False))
          PY
          gzip -dc /tmp/gcmp-package.gz > /tmp/gcmp-package.raw 2>/tmp/recovery-errors.txt || true
          tar -xf /tmp/gcmp-package.raw -C /tmp/gcmp-recovered --ignore-zeros 2>>/tmp/recovery-errors.txt || true
          find /tmp/gcmp-recovered -type f -printf '%P\n' | sort > /tmp/recovered-files.txt
          test "$(wc -l < /tmp/recovered-files.txt)" -eq 35

      - name: Publish exact partial recovery
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B recovered-4.1-partial origin/main
          rm -rf .bootstrap .materialize .materialize_v2 .github
          cp -a /tmp/gcmp-recovered/. .
          cat > RECOVERY_STATUS.md <<'EOF'
          # Recuperação parcial exata — Intranet GCMP 4.1

          Esta branch preserva somente os arquivos que puderam ser recuperados integralmente do pacote 4.1/MySQL previamente enviado em blocos ao repositório.

          Foram recuperados 35 arquivos completos, sem reconstrução manual do conteúdo.

          Esta branch **não representa a entrega completa**. O arquivo staged disponível termina antes do restante do pacote. Permanecem ausentes, entre outros, o frontend `public/`, migrations, scripts, testes, `src/app.js` e arquivos raiz necessários para instalar/executar o projeto completo.

          Não promova esta branch para produção. Para restaurar o projeto completo, use o ZIP original `INTRANET_GCMP_NODE_MYSQL_4_1_0.zip` e valide o SHA-256 documentado no projeto.
          EOF
          git add -A
          git commit -m 'chore: preserve exact recovered Intranet 4.1 source files'
          git push --force origin recovered-4.1-partial
