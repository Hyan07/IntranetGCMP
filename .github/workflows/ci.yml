name: CI

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: intranet_gcmp_ci
      DB_USER: root
      DB_PASSWORD: rootpass
      SESSION_SECRET: 0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
      PASSWORD_PEPPER: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: JavaScript and architecture tests
        run: npm test
      - name: Apply MySQL migrations
        run: npm run db:migrate
      - name: Bootstrap permissions and defaults
        run: npm run db:seed
