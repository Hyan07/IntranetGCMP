<template id="frota-view-arquivos">
  <section class="frota-view" data-frota-view="arquivos">
    <div class="frota-view-heading"><div><span class="frota-kicker">Google Drive</span><h3>Arquivos das Viaturas</h3><p>Documentos e imagens são salvos diretamente na pasta identificada da viatura.</p></div><button class="btn btn-primary" type="button" data-new-file>↑ Enviar arquivo</button></div>
    <div class="frota-toolbar">
      <label class="frota-search"><span>⌕</span><input type="search" data-file-search placeholder="Nome, descrição, categoria, prefixo ou placa"></label>
      <select data-file-vehicle><option value="">Todas as viaturas</option></select>
      <select data-file-category><option value="">Todas as categorias</option></select>
      <button class="frota-icon-button" type="button" data-file-refresh>↻</button>
    </div>
    <div id="frota-file-list" class="frota-file-grid"></div>
    <div id="frota-file-pagination" class="frota-pagination"></div>
  </section>
</template>
