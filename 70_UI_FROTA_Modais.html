<template id="frota-modal-shell">
  <div class="frota-modal-backdrop" role="presentation">
    <section class="frota-modal" role="dialog" aria-modal="true" aria-labelledby="frota-modal-title">
      <header class="frota-modal-header">
        <div><span class="frota-kicker" data-frota-modal-eyebrow>Viaturas e Frota</span><h3 id="frota-modal-title" data-frota-modal-title>Detalhes</h3></div>
        <button type="button" class="frota-modal-close" data-frota-modal-close aria-label="Fechar">×</button>
      </header>
      <form data-frota-modal-form novalidate>
        <div class="frota-modal-body" data-frota-modal-body></div>
        <div class="form-message error" data-frota-modal-error hidden></div>
        <footer class="frota-modal-footer" data-frota-modal-footer>
          <button type="button" class="btn btn-ghost" data-frota-modal-close>Cancelar</button>
          <button type="submit" class="btn btn-primary" data-frota-modal-submit>Salvar</button>
        </footer>
      </form>
    </section>
  </div>
</template>
