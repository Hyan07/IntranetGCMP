<template id="frota-view-manutencoes">
  <section class="frota-view" data-frota-view="manutencoes">
    <div class="frota-view-heading"><div><span class="frota-kicker">Oficina e serviços integrados</span><h3>Manutenções</h3><p>Defeitos e observações vinculados aos serviços, prazos, custos e liberação da viatura.</p></div><button class="btn btn-primary" type="button" data-new-maintenance>+ Nova manutenção</button></div>
    <div class="frota-toolbar">
      <label class="frota-search"><span>⌕</span><input type="search" data-maintenance-search placeholder="Ocorrência, serviço, oficina, placa ou prefixo"></label>
      <select data-maintenance-vehicle><option value="">Todas as viaturas</option></select>
      <select data-maintenance-status><option value="">Todos os status</option><option>PROGRAMADA</option><option>AGUARDANDO_ORCAMENTO</option><option>AUTORIZADA</option><option>EM_MANUTENCAO</option><option>AGUARDANDO_PECA</option><option>CONCLUIDA</option><option>CANCELADA</option></select>
      <button class="frota-icon-button" type="button" data-maintenance-refresh>↻</button>
    </div>
    <div id="frota-maintenance-list" class="frota-table-wrap"></div>
    <div id="frota-maintenance-pagination" class="frota-pagination"></div>
  </section>
</template>
