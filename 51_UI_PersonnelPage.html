<template id="page-pessoal">
  <section class="page">
    <div class="page-actions"><div><p class="page-description">Cadastro unificado de agentes, servidores, colaboradores e terceiros vinculados.</p></div><div class="button-group"><button id="personnel-export" class="btn btn-secondary" type="button"><i data-icon="upload"></i> Exportar</button><button id="new-person-button" class="btn btn-primary" type="button"><i data-icon="plus"></i> Nova pessoa</button></div></div>

      <div id="personnel-table" class="table-region"></div>
      <div id="personnel-pagination" class="pagination"></div>
    </article>
  </section>
</template>
