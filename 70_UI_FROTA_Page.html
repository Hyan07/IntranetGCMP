<template id="page-viaturas">
  <section id="frota-app" class="frota-page" aria-labelledby="frota-title">
    <header class="frota-hero">
      <div>
        <span class="frota-kicker">Controle operacional</span>
        <h2 id="frota-title">Frota</h2>
        <p>Quilometragem, disponibilidade, manutenção, documentos e ocorrências em um só lugar.</p>
      </div>
      <div id="frota-summary" class="frota-summary" aria-label="Resumo da frota"></div>
    </header>

    <nav class="frota-tabs" aria-label="Áreas da Frota" role="tablist">
      <button type="button" data-frota-tab="km" role="tab" data-frota-permissions="FROTA_VISUALIZAR_KM|FROTA_KM_ABRIR|FROTA_KM_ENCERRAR"><span>01</span>Lançamento de KM</button>
      <button type="button" data-frota-tab="viaturas" role="tab" data-frota-permissions="FROTA_VISUALIZAR_VEICULOS|FROTA_CADASTRAR_VIATURA|FROTA_EDITAR_VIATURA|FROTA_ALTERAR_STATUS"><span>02</span>Veículos</button>
      <button type="button" data-frota-tab="historico" role="tab" data-frota-permission="FROTA_VISUALIZAR_HISTORICO"><span>03</span>Histórico</button>
      <button type="button" data-frota-tab="gerenciamento" role="tab" data-frota-permission="FROTA_VISUALIZAR_GERENCIAMENTO"><span>04</span>Gerenciamento</button>
      <button type="button" data-frota-tab="manutencoes" role="tab" data-frota-permissions="FROTA_VISUALIZAR_MANUTENCOES|FROTA_GERENCIAR_MANUTENCOES"><span>05</span>Manutenções integradas</button>
      <button type="button" data-frota-tab="arquivos" role="tab" data-frota-permission="FROTA_VISUALIZAR_ARQUIVOS"><span>06</span>Arquivos</button>
      <button type="button" data-frota-tab="defeitos" role="tab" data-frota-permissions="FROTA_VISUALIZAR_DEFEITOS|FROTA_TRATAR_DEFEITOS"><span>07</span>Ocorrências e oficina</button>
    </nav>

    <div id="frota-content" class="frota-content" aria-live="polite">
      <div class="frota-loading"><span class="spinner"></span><p>Preparando o módulo de Frota…</p></div>
    </div>
  </section>
</template>
