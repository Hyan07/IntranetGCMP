<style>
  .patrimonio-page { --patrimonio-accent: #123b66; }
  .patrimonio-tabs { scroll-snap-type: x proximity; }
  .patrimonio-tabs .tab { scroll-snap-align: start; }
  .patrimonio-tabs [hidden] { display:none !important; }
  .patrimonio-administrative-note { margin-bottom:16px; border-left-color:#c99b3b; }
  .patrimonio-layout { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(270px,.6fr); gap:16px; }
  .patrimonio-card-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
  .patrimonio-stat { min-height:112px; padding:17px; border:1px solid var(--slate-150); border-radius:16px; background:var(--white); box-shadow:var(--shadow-sm); }
  .patrimonio-stat span { display:block; color:var(--slate-500); font-size:10px; font-weight:750; text-transform:uppercase; letter-spacing:.04em; }
  .patrimonio-stat strong { display:block; margin-top:9px; font-size:27px; letter-spacing:-.04em; }
  .patrimonio-stat small { display:block; margin-top:5px; color:var(--slate-500); font-size:9px; }
  .patrimonio-stat.warning { border-color:#f5d08a; background:#fffbeb; }
  .patrimonio-stat.danger { border-color:#fecaca; background:#fef2f2; }
  .patrimonio-bars { display:flex; flex-direction:column; gap:12px; }
  .patrimonio-bar-head { display:flex; justify-content:space-between; gap:12px; margin-bottom:5px; font-size:10px; }
  .patrimonio-bar-track { height:8px; overflow:hidden; border-radius:999px; background:var(--slate-100); }
  .patrimonio-bar-fill { height:100%; border-radius:999px; background:linear-gradient(90deg,var(--navy-700),var(--teal-600)); }
  .patrimonio-identity { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:16px; padding:14px; border:1px solid #c9deef; border-radius:14px; background:#f3f8fd; }
  .patrimonio-identity span { display:block; color:var(--slate-500); font-size:9px; text-transform:uppercase; letter-spacing:.04em; }
  .patrimonio-identity strong { display:block; margin-top:4px; font-size:11px; }
  .patrimonio-step { margin-bottom:16px; padding:18px; border:1px solid var(--slate-150); border-radius:16px; background:var(--white); box-shadow:var(--shadow-sm); }
  .patrimonio-step h3 { margin:0 0 4px; font-size:15px; }
  .patrimonio-step > p { margin:0 0 15px; color:var(--slate-500); font-size:10px; }
  .patrimonio-receiver-card { display:grid; grid-template-columns:1fr repeat(2,auto); gap:12px; align-items:center; margin-top:12px; padding:13px; border:1px solid var(--slate-150); border-radius:12px; background:var(--slate-50); }
  .patrimonio-receiver-card strong,.patrimonio-receiver-card small { display:block; }
  .patrimonio-receiver-card small { margin-top:2px; color:var(--slate-500); font-size:9px; }
  .patrimonio-items { display:flex; flex-direction:column; gap:9px; }
  .patrimonio-item-row { display:grid; grid-template-columns:minmax(230px,1fr) 100px 155px 40px; gap:9px; align-items:end; padding:11px; border:1px solid var(--slate-150); border-radius:12px; background:var(--slate-50); }
  .patrimonio-item-row .field span { font-size:9px; }
  .patrimonio-item-row input,.patrimonio-item-row select { min-height:39px; }
  .patrimonio-auth-note { margin-top:10px; padding:11px 13px; border-left:3px solid var(--patrimonio-accent); border-radius:8px; color:var(--slate-600); background:#f0fdfa; font-size:10px; }
  .patrimonio-form-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:16px; }
  .patrimonio-config-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .patrimonio-search-picker { position:relative; }
  .patrimonio-search-picker .search-box { width:100%; }
  .patrimonio-picker-results { position:absolute; z-index:30; top:calc(100% + 6px); right:0; left:0; max-height:310px; overflow:auto; border:1px solid var(--slate-200); border-radius:12px; background:#fff; box-shadow:0 18px 45px rgba(15,35,31,.18); }
  .patrimonio-picker-results:empty { display:none; }
  .patrimonio-picker-option { display:flex; justify-content:space-between; align-items:center; gap:12px; width:100%; padding:12px 14px; color:var(--slate-700); text-align:left; border:0; border-bottom:1px solid var(--slate-100); background:#fff; cursor:pointer; }
  .patrimonio-picker-option:last-child { border-bottom:0; }
  .patrimonio-picker-option:hover { background:#f3f8fd; }
  .patrimonio-picker-option strong,.patrimonio-picker-option span,.patrimonio-picker-option small { display:block; }
  .patrimonio-picker-option span,.patrimonio-picker-option small { margin-top:3px; color:var(--slate-500); font-size:9px; }
  .patrimonio-asset-option-info { min-width:0; }
  .patrimonio-asset-option-info strong { color:var(--slate-800); font-size:11px; }
  .patrimonio-asset-option-info em { display:inline-block; margin-top:5px; padding:3px 7px; color:#fff; font-size:8px; font-style:normal; font-weight:800; border-radius:999px; background:#0c2948; }
  .patrimonio-asset-option-info .patrimonio-asset-option-notes { max-width:650px; padding-left:7px; color:#674f18; border-left:2px solid #c99b3b; }
  .patrimonio-asset-option-info .patrimonio-asset-option-notes b { color:inherit; font-size:inherit; text-align:left; }
  .patrimonio-asset-option-action { flex:0 0 auto; color:var(--patrimonio-accent); font-size:10px; text-align:right; }
  .patrimonio-picker-empty { padding:18px; color:var(--slate-500); font-size:10px; text-align:center; }
  .patrimonio-drawer { margin-top:16px; overflow:hidden; border:2px solid #c9deef; border-radius:14px; background:#f7f9fb; }
  .patrimonio-drawer-head { display:flex; justify-content:space-between; padding:12px 14px; color:#fff; background:#0c2948; }
  .patrimonio-drawer-head span,.patrimonio-drawer-head strong { display:block; }
  .patrimonio-drawer-head span { color:rgba(255,255,255,.72); font-size:9px; text-transform:uppercase; }
  .patrimonio-drawer-head strong { margin-top:3px; font-size:13px; }
  .patrimonio-drawer-item { display:grid; grid-template-columns:minmax(220px,1fr) 100px 145px 40px; gap:9px; align-items:end; padding:12px 14px; border-bottom:1px solid #dce7e3; }
  .patrimonio-drawer-item:last-child { border-bottom:0; }
  .patrimonio-drawer-item>div strong,.patrimonio-drawer-item>div span,.patrimonio-drawer-item>div small { display:block; }
  .patrimonio-drawer-item>div span { margin-top:3px; font-size:11px; }
  .patrimonio-drawer-item>div small { margin-top:3px; color:var(--slate-500); font-size:9px; }
  .patrimonio-drawer-info { min-width:0; }
  .patrimonio-drawer-title { display:flex; flex-wrap:wrap; gap:6px 9px; align-items:center; margin-bottom:5px; }
  .patrimonio-drawer-item .patrimonio-drawer-title strong { color:#0c2948; font-size:13px; }
  .patrimonio-drawer-item .patrimonio-drawer-title span { margin:0; padding:4px 7px; color:#fff; font-size:8px; font-weight:800; border-radius:999px; background:#0c2948; }
  .patrimonio-drawer-info p { margin:7px 0 0; padding:7px 9px; color:var(--slate-600); font-size:9px; line-height:1.45; border-radius:7px; background:#fff; }
  .patrimonio-drawer-info .patrimonio-drawer-registered-notes { color:#674f18; border-left:3px solid #c99b3b; background:#fffaf0; }
  .patrimonio-drawer-observation { grid-column:1/-1; }
  .patrimonio-drawer-observation textarea { min-height:66px; resize:vertical; }
  .patrimonio-drawer-empty { padding:24px; color:var(--slate-500); font-size:10px; text-align:center; }
  .patrimonio-section-line { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }
  .patrimonio-section-line h3 { margin:0 0 4px; }
  .patrimonio-section-line p { margin:0 0 15px; color:var(--slate-500); font-size:10px; }
  .patrimonio-return-list { display:flex; flex-direction:column; gap:9px; }
  .patrimonio-return-item { display:grid; grid-template-columns:minmax(260px,1.5fr) 90px 130px 150px minmax(160px,1fr); gap:9px; align-items:end; padding:12px; border:1px solid var(--slate-150); border-radius:12px; background:var(--slate-50); }
  .patrimonio-return-check { display:flex; align-items:flex-start; gap:10px; padding:8px; cursor:pointer; }
  .patrimonio-return-check input { width:18px; height:18px; accent-color:var(--patrimonio-accent); }
  .patrimonio-return-check strong,.patrimonio-return-check small { display:block; }
  .patrimonio-return-check small { margin-top:4px; color:var(--slate-500); font-size:9px; }
  .patrimonio-audit-layout { display:grid; gap:16px; }
  .patrimonio-audit-tabs { width:fit-content; max-width:100%; }
  .patrimonio-audit-layout > [hidden] { display:none !important; }
  .patrimonio-print { display:none; }
  @media (max-width:1050px) {
    .patrimonio-card-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .patrimonio-identity { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .patrimonio-item-row { grid-template-columns:1fr 85px 135px 40px; }
    .patrimonio-drawer-item { grid-template-columns:1fr 90px 130px 40px; }
    .patrimonio-return-item { grid-template-columns:1fr 90px 130px; }
    .patrimonio-return-item .patrimonio-return-check { grid-column:1/-1; }
  }
  @media (max-width:760px) {
    .patrimonio-layout,.patrimonio-config-grid { grid-template-columns:1fr; }
    .patrimonio-card-grid { grid-template-columns:1fr 1fr; gap:8px; }
    .patrimonio-stat { min-height:96px; padding:14px; }
    .patrimonio-item-row { grid-template-columns:1fr 1fr; }
    .patrimonio-item-row > :first-child { grid-column:1/-1; }
    .patrimonio-receiver-card { grid-template-columns:1fr; }
    .patrimonio-drawer-item { grid-template-columns:1fr 1fr 40px; }
    .patrimonio-drawer-item>div { grid-column:1/-1; }
    .patrimonio-return-item { grid-template-columns:1fr 1fr; }
    .patrimonio-return-item .patrimonio-return-check { grid-column:1/-1; }
  }
  @media (max-width:480px) {
    .patrimonio-card-grid,.patrimonio-identity { grid-template-columns:1fr; }
    .patrimonio-item-row { grid-template-columns:1fr; }
    .patrimonio-item-row > :first-child { grid-column:auto; }
    .patrimonio-form-actions { flex-direction:column-reverse; }
    .patrimonio-form-actions .btn { width:100%; }
    .patrimonio-section-line { align-items:stretch; flex-direction:column; }
    .patrimonio-drawer-item,.patrimonio-return-item { grid-template-columns:1fr; }
    .patrimonio-drawer-item>div,.patrimonio-return-item .patrimonio-return-check { grid-column:auto; }
  }
</style>
