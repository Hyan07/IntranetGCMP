<script>
window.createPatrimonioModule = function createPatrimonioModule(deps) {
  'use strict';
  const { api, esc, icon, badge, formatDate, formatMoney, formatMasp, openModal, closeModal, toast, showLoading, hideLoading, confirmAction, renderPagination, emptyState, tableLoading, has, app = {} } = deps;
  const local = { tab: 'painel', navigationId: 0, bootstrap: null, assetsPage: 1, activePage: 1, historyPage: 1, auditPage: 1, termsPage: 1, availableAssets: [], activeCustodies: [], custodyDraftItems: [], selectedReceiver: null, returnReceiver: null, loadSequence: 0, receiverSearchSequence: 0, assetSearchSequence: 0, returnSearchSequence: 0, receiverSearchCache: new Map(), assetSearchCache: new Map(), returnSearchCache: new Map() };
  const root = () => document.querySelector('#patrimonio-tab-content');
  const meta = () => ({ userAgent: navigator.userAgent || '' });
  const q = (selector, scope = document) => scope.querySelector(selector);
  const qa = (selector, scope = document) => Array.from(scope.querySelectorAll(selector));
  const value = (selector, scope = document) => q(selector, scope)?.value || '';
  const cfg = key => (local.bootstrap.configuration || []).find(item => item.Chave === key)?.Valor || '';
  const dateValue = input => { if (!input) return ''; const d = new Date(input); return Number.isNaN(d.getTime()) ? String(input).slice(0, 10) : d.toISOString().slice(0, 10); };
  const options = (items, selected, placeholder) => `<option value="">${esc(placeholder || 'Selecione')}</option>${(items || []).map(item => `<option value="${esc(item.value)}" ${String(item.value) === String(selected || '') ? 'selected' : ''}>${esc(item.label)}</option>`).join('')}`;
  const searchText = input => String(input || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('pt-BR').trim();
  const localMatches = (item, fields, query) => { const term=searchText(query); return !term || fields.some(field=>searchText(item?.[field]).includes(term)); };

  async function init() {
    showLoading('Carregando Patrimônio e Cautelas…');
    try {
      local.bootstrap = await api('patrimonio.bootstrap');
      qa('[data-patrimonio-permission]').forEach(button => { button.hidden = !has(button.dataset.patrimonioPermission); });
      qa('[data-patrimonio-tab]').forEach(button => button.addEventListener('click', () => switchTab(button.dataset.patrimonioTab)));
      await switchTab('painel');
    } catch (error) {
      const content = root();
      if (content) content.innerHTML = `<div class="form-message error">${esc(error.message)}</div>`;
    } finally { hideLoading(); }
  }

  async function switchTab(tab, tabPayload) {
    if (!root()) return;
    const navigationId = ++local.navigationId;
    local.tab = tab;
    qa('[data-patrimonio-tab]').forEach(button => button.classList.toggle('active', button.dataset.patrimonioTab === tab));
    const actionRegion = q('#patrimonio-page-actions');
    if (actionRegion) actionRegion.innerHTML = headerActions(tab);
    bindHeaderActions();
    const content = root();
    if (!content) return;
    content.innerHTML = tableLoading();
    const renderers = { painel: renderDashboard, patrimonios: renderAssets, cautela: () => renderCustodyFormV2(false), 'cautela-administrativa': () => renderCustodyFormV2(true), descautelamento: () => renderReturnFormV2(tabPayload), ativas: renderActive, historico: renderHistory, auditoria: renderAuditV2, configuracoes: renderConfig };
    if (!renderers[tab]) return;
    try { await renderers[tab](); } catch (error) {
      if (navigationId !== local.navigationId) return;
      const currentContent = root();
      if (currentContent) currentContent.innerHTML = `<div class="form-message error">${esc(error.message)}</div>`;
    }
  }

  function headerActions(tab) {
    const buttons = [];
    if (tab === 'patrimonios' && has('PATRIMONIO_CADASTRAR')) buttons.push(`<button class="btn btn-primary" id="patrimonio-new-asset" type="button">${icon('plus')} Novo patrimônio</button>`);
    if (tab !== 'cautela' && has('CAUTELA_REALIZAR')) buttons.push(`<button class="btn btn-secondary" id="patrimonio-new-custody" type="button">${icon('hand')} Nova cautela</button>`);
    if (tab !== 'cautela-administrativa' && has('CAUTELA_ADMINISTRATIVA_GERENCIAR')) buttons.push(`<button class="btn btn-secondary" id="patrimonio-new-administrative-custody" type="button">${icon('inventory')} Cautela administrativa</button>`);
    if (tab !== 'descautelamento' && (has('DESCAUTELA_REALIZAR') || has('CAUTELA_ADMINISTRATIVA_GERENCIAR'))) buttons.push(`<button class="btn btn-secondary" id="patrimonio-new-return" type="button">${icon('check')} Descautelamento</button>`);
    return buttons.join('');
  }

  function bindHeaderActions() {
    q('#patrimonio-new-asset')?.addEventListener('click', () => openAssetModal());
    q('#patrimonio-new-custody')?.addEventListener('click', () => switchTab('cautela'));
    q('#patrimonio-new-administrative-custody')?.addEventListener('click', () => switchTab('cautela-administrativa'));
    q('#patrimonio-new-return')?.addEventListener('click', () => switchTab('descautelamento'));
  }

  async function renderDashboard() {
    // O bootstrap já traz o painel. Reutilizá-lo evita uma segunda execução
    // completa logo na abertura do módulo; nas próximas visitas o painel é
    // consultado novamente para refletir alterações recentes.
    const data = local.bootstrap.dashboard || await api('patrimonio.painel');
    local.bootstrap.dashboard = null;
    if (local.tab !== 'painel' || !root()) return;
    local.bootstrap.dashboard = data;
    const activeCount = q('#patrimonio-active-count'); if (activeCount) activeCount.textContent = data.cards.activeCustodies;
    const cards = [
      ['assets', 'Patrimônios cadastrados', 'Registros ativos'], ['totalUnits', 'Unidades controladas', 'Estoque total'],
      ['available', 'Disponíveis', 'Prontas para cautela'], ['cautioned', 'Cauteladas', 'Sob responsabilidade'],
      ['activeCustodies', 'Cautelas ativas', 'Inclui devoluções parciais'], ['overdue', 'Cautelas vencidas', 'Exigem atenção'],
      ['maintenance', 'Em manutenção', 'Temporariamente indisponíveis'], ['damaged', 'Danificados/extraviados', 'Pendências críticas']
    ];
    const max = Math.max(1, ...(data.byCategory || []).map(item => Number(item.value || 0)));
    root().innerHTML = `<div class="patrimonio-card-grid">${cards.map(([key, label, note]) => `<article class="patrimonio-stat ${key === 'overdue' && data.cards[key] ? 'danger' : key === 'maintenance' && data.cards[key] ? 'warning' : ''}"><span>${esc(label)}</span><strong>${Number(data.cards[key] || 0).toLocaleString('pt-BR')}</strong><small>${esc(note)}</small></article>`).join('')}</div><div class="patrimonio-layout"><article class="panel"><div class="panel-header"><h3>Distribuição por categoria</h3></div><div class="patrimonio-bars">${(data.byCategory || []).length ? data.byCategory.map(item => `<div><div class="patrimonio-bar-head"><span>${esc(item.label)}</span><strong>${Number(item.value).toLocaleString('pt-BR')}</strong></div><div class="patrimonio-bar-track"><div class="patrimonio-bar-fill" style="width:${Math.max(3, Number(item.value) / max * 100)}%"></div></div></div>`).join('') : emptyState('Cadastre o primeiro patrimônio.')}</div></article><article class="panel"><div class="panel-header"><h3>Alertas de devolução</h3></div><div class="alert-list">${(data.alerts || []).length ? data.alerts.map(item => `<button class="alert-item ${new Date(item.dueDate).getTime() < Date.now() ? 'danger' : ''}" type="button" data-dashboard-custody="${esc(item.id)}"><span class="alert-dot"></span><span><strong>${esc(item.receiver)}</strong><br>${esc(item.equipment)} · ${formatDate(item.dueDate, true)}</span></button>`).join('') : emptyState('Nenhuma cautela vencida ou próxima do vencimento.')}</div></article></div>`;
    qa('[data-dashboard-custody]', root()).forEach(button => button.addEventListener('click', () => switchTab('ativas')));
  }

  async function renderAssets() {
    root().innerHTML = `<article class="panel data-panel"><div class="toolbar"><label class="search-box">${icon('search')}<input id="patrimonio-search" type="search" placeholder="Buscar código, patrimônio, equipamento, série ou local"></label><select id="patrimonio-status" class="select-control"><option value="">Todas as situações</option>${['DISPONIVEL','CAUTELADO','PARCIALMENTE_CAUTELADO','EM_MANUTENCAO','DANIFICADO','EXTRAVIADO','BAIXADO','INDISPONIVEL'].map(item => `<option>${item}</option>`).join('')}</select><select id="patrimonio-category" class="select-control"><option value="">Todas as categorias</option>${categoryNames().map(item => `<option>${esc(item)}</option>`).join('')}</select><button id="patrimonio-refresh" class="icon-btn bordered" type="button">${icon('refresh')}</button></div><div id="patrimonio-table" class="table-region"></div><div id="patrimonio-pagination" class="pagination"></div></article>`;
    const load = async () => {
      const sequence = ++local.loadSequence;
      const region = q('#patrimonio-table'); if (!region) return;
      region.innerHTML = tableLoading();
      const data = await api('patrimonio.listar', { page: local.assetsPage, pageSize: 20, query: value('#patrimonio-search'), status: value('#patrimonio-status'), category: value('#patrimonio-category') });
      if (sequence !== local.loadSequence || !region.isConnected || local.tab !== 'patrimonios') return;
      region.innerHTML = data.items.length ? `<table class="data-table"><thead><tr><th>Patrimônio / equipamento</th><th>Categoria</th><th>Controle</th><th>Disponível</th><th>Localização</th><th>Situação</th><th></th></tr></thead><tbody>${data.items.map(asset => `<tr><td><strong>${esc(asset.patrimony || asset.code)}</strong><small>${esc(asset.name)}${asset.serial ? ' · Série ' + esc(asset.serial) : ''}</small></td><td>${esc(asset.category)}<small>${esc(asset.subcategory || '')}</small></td><td>${esc(asset.controlType)}</td><td><strong>${asset.available} / ${asset.total}</strong><small>${esc(asset.unit)}</small></td><td>${esc(asset.location || asset.sector || '—')}</td><td>${badge(asset.status)}</td><td><div class="table-actions"><button class="icon-btn" data-view-asset="${esc(asset.id)}" title="Histórico">${icon('eye')}</button>${has('PATRIMONIO_EDITAR') ? `<button class="icon-btn" data-edit-asset="${esc(asset.id)}" title="Editar">${icon('edit')}</button>` : ''}</div></td></tr>`).join('')}</tbody></table>` : emptyState();
      renderPagination(q('#patrimonio-pagination'), data, page => { local.assetsPage = page; load(); });
      qa('[data-edit-asset]', root()).forEach(button => button.addEventListener('click', () => openAssetModal(button.dataset.editAsset)));
      qa('[data-view-asset]', root()).forEach(button => button.addEventListener('click', () => viewAsset(button.dataset.viewAsset)));
    };
    let timer; q('#patrimonio-search').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { local.assetsPage = 1; load(); }, 420); });
    q('#patrimonio-status').addEventListener('change', () => { local.assetsPage = 1; load(); });
    q('#patrimonio-category').addEventListener('change', () => { local.assetsPage = 1; load(); });
    q('#patrimonio-refresh').addEventListener('click', load);
    await load();
  }

  function categoryNames() { return [...new Set((local.bootstrap.categories || []).filter(item => item.Ativo === true || String(item.Ativo).toLowerCase() === 'true').map(item => item.Categoria).filter(Boolean))].sort(); }
  function subcategoriesFor(category) { return (local.bootstrap.categories || []).filter(item => item.Categoria === category && item.Subcategoria).map(item => item.Subcategoria); }

  async function openAssetModal(id) {
    showLoading('Preparando cadastro patrimonial…');
    try {
      const detail = id ? await api('patrimonio.obter', { id }) : { asset: { controlType: 'INDIVIDUAL', total: 1, unit: 'UN', custodial: true, active: true, status: 'DISPONIVEL', condition: 'BOM' } };
      const a = detail.asset;
      const body = openModal({ title: id ? 'Editar patrimônio' : 'Novo patrimônio', eyebrow: 'Patrimônio e equipamentos', wide: true,
        body: `<div class="form-grid"><input name="id" type="hidden" value="${esc(a.id || '')}"><label class="field"><span>Código interno</span><input name="code" value="${esc(a.code || '')}"></label><label class="field"><span>Número patrimonial</span><input name="patrimony" value="${esc(a.patrimony || '')}"></label><label class="field span-2"><span>Nome do equipamento *</span><input name="name" value="${esc(a.name || '')}" required></label><label class="field span-2"><span>Descrição</span><textarea name="description">${esc(a.description || '')}</textarea></label><label class="field"><span>Categoria *</span><select id="patrimonio-modal-category" name="category" required>${options(categoryNames().map(v => ({value:v,label:v})), a.category, 'Selecione')}</select></label><label class="field"><span>Subcategoria</span><select id="patrimonio-modal-subcategory" name="subcategory"></select></label><label class="field"><span>Marca</span><input name="brand" value="${esc(a.brand || '')}"></label><label class="field"><span>Modelo</span><input name="model" value="${esc(a.model || '')}"></label><label class="field"><span>Número de série</span><input name="serial" value="${esc(a.serial || '')}"></label><label class="field"><span>Tipo de controle *</span><select id="patrimonio-control-type" name="controlType">${options(['INDIVIDUAL','QUANTIDADE'].map(v => ({value:v,label:v})), a.controlType)}</select></label><label class="field"><span>Quantidade total *</span><input id="patrimonio-total" name="total" type="number" min="1" step="1" value="${esc(a.total || 1)}" required></label><label class="field"><span>Unidade</span><input name="unit" value="${esc(a.unit || 'UN')}"></label><label class="field"><span>Situação *</span><select name="status">${options(['DISPONIVEL','CAUTELADO','PARCIALMENTE_CAUTELADO','EM_MANUTENCAO','DANIFICADO','EXTRAVIADO','RESERVADO','INDISPONIVEL','BAIXADO'].map(v => ({value:v,label:v})), a.status)}</select></label><label class="field"><span>Estado de conservação *</span><select name="condition">${options(['NOVO','OTIMO','BOM','REGULAR','RUIM','DANIFICADO'].map(v => ({value:v,label:v})), a.condition)}</select></label><label class="field"><span>Setor</span><input name="sector" value="${esc(a.sector || '')}"></label><label class="field"><span>Localização</span><input name="location" value="${esc(a.location || '')}"></label><label class="field"><span>Data de aquisição</span><input name="acquisitionDate" type="date" value="${dateValue(a.acquisitionDate)}"></label><label class="field"><span>Valor</span><input name="value" type="number" min="0" step="0.01" value="${esc(a.value || '')}"></label><label class="field"><span>Fornecedor</span><input name="supplier" value="${esc(a.supplier || '')}"></label><label class="field"><span>Nota fiscal</span><input name="invoice" value="${esc(a.invoice || '')}"></label><label class="field"><span>Garantia</span><input name="warranty" value="${esc(a.warranty || '')}"></label><label class="field"><span>Vencimento da garantia</span><input name="warrantyExpires" type="date" value="${dateValue(a.warrantyExpires)}"></label><label class="field"><span>URL da foto</span><input name="photo" type="url" value="${esc(a.photo || '')}"></label><label class="field"><span>Anexo/Drive</span><input name="attachment" value="${esc(a.attachment || '')}"></label><label class="field span-2"><span>Observações</span><textarea name="notes">${esc(a.notes || '')}</textarea></label><label class="field-checkbox"><input name="custodial" type="checkbox" ${a.custodial ? 'checked' : ''}><span>Este item pode ser cautelado</span></label><label class="field-checkbox"><input name="active" type="checkbox" ${a.active ? 'checked' : ''}><span>Cadastro ativo</span></label></div>`, submitText: id ? 'Salvar alterações' : 'Cadastrar patrimônio',
        onSubmit: async payload => { payload.metadata = meta(); await api('patrimonio.salvar', payload); toast(id ? 'Patrimônio atualizado' : 'Patrimônio cadastrado', payload.name); closeModal(); local.bootstrap = await api('patrimonio.bootstrap'); await switchTab('patrimonios'); }
      });
      const codeInput = q('[name="code"]', body);
      if (codeInput) { codeInput.readOnly = true; codeInput.value = a.code || 'Gerado automaticamente ao salvar'; }
      const patrimonyInput = q('[name="patrimony"]', body);
      if (patrimonyInput) patrimonyInput.placeholder = 'Opcional — alguns itens não possuem';
      const updateSubs = () => { q('#patrimonio-modal-subcategory', body).innerHTML = options(subcategoriesFor(value('#patrimonio-modal-category', body)).map(v => ({value:v,label:v})), a.subcategory, 'Sem subcategoria'); };
      q('#patrimonio-modal-category', body).addEventListener('change', updateSubs); updateSubs();
      const updateTotal = () => { const individual = value('#patrimonio-control-type', body) === 'INDIVIDUAL'; q('#patrimonio-total', body).value = individual ? 1 : q('#patrimonio-total', body).value; q('#patrimonio-total', body).readOnly = individual; };
      q('#patrimonio-control-type', body).addEventListener('change', updateTotal); updateTotal();
    } catch (error) { toast('Não foi possível abrir o cadastro', error.message, 'error'); } finally { hideLoading(); }
  }

  async function viewAsset(id) {
    showLoading('Carregando histórico do patrimônio…');
    try { const detail = await api('patrimonio.obter', { id }); const a = detail.asset; openModal({ title: a.name, eyebrow: a.patrimony || a.code, wide: true, hideSubmit: true, body: `<div class="detail-grid"><div class="detail-item"><span>Situação</span>${badge(a.status)}</div><div class="detail-item"><span>Disponibilidade</span><strong>${a.available} de ${a.total} ${esc(a.unit)}</strong></div><div class="detail-item"><span>Categoria</span><strong>${esc(a.category)}</strong></div><div class="detail-item"><span>Localização</span><strong>${esc(a.location || a.sector || '—')}</strong></div></div><h3 style="margin:22px 0 10px">Histórico individual</h3>${detail.history.length ? `<div class="table-region"><table class="data-table"><thead><tr><th>Data</th><th>Tipo</th><th>Responsável</th><th>Alteração</th></tr></thead><tbody>${detail.history.map(item => `<tr><td>${esc(item.Data)}<small>${esc(item.Hora)}</small></td><td>${esc(item.Tipo)}</td><td>${esc(item.Responsável || item.Operador)}</td><td>${esc(item['Situação Anterior'] || '—')} → ${esc(item['Situação Nova'] || '—')}<small>${esc(item.Observação || '')}</small></td></tr>`).join('')}</tbody></table></div>` : emptyState('Ainda não há movimentações para este patrimônio.')}` }); } catch (error) { toast('Erro ao abrir histórico', error.message, 'error'); } finally { hideLoading(); }
  }

  function identityBlock() { const u = local.bootstrap.user; return `<div class="patrimonio-identity"><div><span>Intendente responsável</span><strong>${esc(u.name)}</strong></div><div><span>MASP</span><strong>${esc(u.masp)}</strong></div><div><span>Setor</span><strong>${esc(u.sector || '—')}</strong></div><div><span>Data e hora</span><strong>${new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(new Date())}</strong></div></div>`; }

  async function loadAvailableAssets() { const data = await api('patrimonio.listar', { page: 1, pageSize: 100, availableOnly: true }); local.availableAssets = data.items; return data.items; }
  function assetOptions() { return options(local.availableAssets.map(a => ({ value: a.id, label: `${a.patrimony || a.code} — ${a.name} — disponível ${a.available} ${a.unit}` })), '', 'Selecione um patrimônio disponível'); }
  function custodyItemRow(index) { return `<div class="patrimonio-item-row" data-custody-item><label class="field"><span>Patrimônio/equipamento *</span><select data-item-asset required>${assetOptions()}</select></label><label class="field"><span>Quantidade *</span><input data-item-quantity type="number" min="1" step="1" value="1" required></label><label class="field"><span>Estado na entrega *</span><select data-item-condition>${options(['NOVO','OTIMO','BOM','REGULAR'].map(v => ({value:v,label:v})), 'BOM')}</select></label><button class="icon-btn bordered" data-remove-item type="button" title="Remover">${icon('trash')}</button></div>`; }

  async function renderCustodyForm() {
    return renderCustodyFormV2();
    await loadAvailableAssets();
    const receivers = local.bootstrap.receivers || [];
    const days = Number(cfg('PRAZO_PADRAO_CAUTELA_DIAS') || 30); const due = new Date(); due.setDate(due.getDate() + days);
    root().innerHTML = `${identityBlock()}<form id="patrimonio-custody-form"><section class="patrimonio-step"><h3>1. GCM recebedor</h3><p>Selecione o usuário ativo que receberá os itens. O nome do recebedor ficará evidente no termo.</p><div class="form-grid"><label class="field span-2"><span>GCM recebedor *</span><select id="patrimonio-receiver" required>${options(receivers.map(r => ({value:r.id,label:`${r.name} — ${r.maspFormatted} — ${r.sector || 'Sem setor'}`})), '', 'Selecione pelo nome ou MASP')}</select></label></div><div id="patrimonio-receiver-detail"></div></section><section class="patrimonio-step"><h3>2. Itens da cautela</h3><p>Somente equipamentos ativos, cauteláveis e com saldo disponível aparecem na lista.</p><div id="patrimonio-custody-items" class="patrimonio-items">${custodyItemRow(0)}</div>${has('CAUTELA_MULTIPLA') ? `<button id="patrimonio-add-item" class="btn btn-ghost btn-sm" style="margin-top:10px" type="button">${icon('plus')} Adicionar item</button>` : ''}</section><section class="patrimonio-step"><h3>3. Finalidade e autenticação</h3><p>A senha deve ser digitada pelo próprio GCM recebedor e será validada no servidor. Ela não é armazenada nem registrada.</p><div class="form-grid"><label class="field"><span>Previsão de devolução *</span><input id="patrimonio-due" type="date" value="${due.toISOString().slice(0,10)}" required></label><label class="field"><span>Finalidade *</span><input id="patrimonio-purpose" required></label><label class="field span-2"><span>Observações gerais</span><textarea id="patrimonio-custody-notes"></textarea></label><label class="field"><span>MASP do recebedor *</span><input id="patrimonio-receiver-masp" inputmode="numeric" required readonly></label><label class="field"><span>Senha do recebedor *</span><input id="patrimonio-receiver-password" type="password" autocomplete="current-password" required></label><label class="field-checkbox span-2"><input id="patrimonio-confirmation" type="checkbox" required><span>Confirmo que o recebedor conferiu os dados, quantidades, estado dos itens e autenticou esta operação.</span></label></div><div class="patrimonio-auth-note">A autenticação vale para todos os itens desta cautela múltipla. Tentativas inválidas são auditadas sem registrar a senha.</div><div class="patrimonio-form-actions"><button class="btn btn-primary" type="submit">${icon('check')} Registrar cautela</button></div></section></form>`;
    const receiverSelect = q('#patrimonio-receiver');
    const syncReceiver = () => { const receiver = receivers.find(r => r.id === receiverSelect.value); q('#patrimonio-receiver-masp').value = receiver?.maspFormatted || ''; q('#patrimonio-receiver-detail').innerHTML = receiver ? `<div class="patrimonio-receiver-card"><div><strong>${esc(receiver.name)}</strong><small>${esc(receiver.functionName || '')} · ${esc(receiver.sector || 'Sem setor')} · MASP ${esc(receiver.maspFormatted)}</small></div><div><strong>${receiver.activeCustodies}</strong><small>Cautelas ativas</small></div><div><strong>${receiver.overdue}</strong><small>Vencidas</small></div></div>` : ''; };
    receiverSelect.addEventListener('change', syncReceiver); syncReceiver();
    q('#patrimonio-add-item')?.addEventListener('click', () => { q('#patrimonio-custody-items').insertAdjacentHTML('beforeend', custodyItemRow(Date.now())); bindItemRows(); });
    const bindItemRows = () => qa('[data-remove-item]', root()).forEach(button => { button.onclick = () => { if (qa('[data-custody-item]', root()).length > 1) button.closest('[data-custody-item]').remove(); }; }); bindItemRows();

  function localDateTimeValue(input) {
    const date = input instanceof Date ? input : new Date(input);
    if (Number.isNaN(date.getTime())) return '';
    return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  }

        if (local.custodyDraftItems.some(item => item.id === asset.id)) return toast('Item já adicionado', asset.name, 'warning');
        if (!administrative && !has('CAUTELA_MULTIPLA') && local.custodyDraftItems.length) return toast('Cautela múltipla não permitida', 'Remova o item atual antes de adicionar outro.', 'warning');
        local.custodyDraftItems.push(Object.assign({}, asset, { quantity: 1, deliveryCondition: asset.condition || 'BOM', deliveryNotes: '' }));

      }));
    };
    const searchAssets = async () => {
      const input=q('#patrimonio-asset-search'); if(!input)return [];
      const query=input.value.trim(),key=(administrative?'admin:':'comum:')+searchText(query);
      if(local.assetSearchCache.has(key)){const cached=local.assetSearchCache.get(key);renderAssetResults(cached);return cached;}
      if(query && searchText(query).length<2)return [];
      const sequence=++local.assetSearchSequence;
      const data = await api('patrimonio.listar', { page: 1, pageSize: 50, availableOnly: true, administrative, excludeInternalCode: true, query });
      if(sequence!==local.assetSearchSequence||((administrative?'admin:':'comum:')+searchText(value('#patrimonio-asset-search')))!==key)return data.items;
      local.assetSearchCache.set(key,data.items);
      const byId=new Map(local.availableAssets.map(item=>[String(item.id),item]));data.items.forEach(item=>byId.set(String(item.id),item));local.availableAssets=[...byId.values()];
      if (q('#patrimonio-asset-results')) renderAssetResults(data.items); return data.items;
    };
    const assetInput=q('#patrimonio-asset-search');
    assetInput.addEventListener('focus',()=>{if(!assetInput.value&&!q('#patrimonio-asset-results').children.length)searchAssets().catch(e=>toast('Falha na pesquisa',e.message,'error'));});
    assetInput.addEventListener('input', () => {
      const query=assetInput.value.trim(),key=(administrative?'admin:':'comum:')+searchText(query),localItems=local.availableAssets.filter(item=>localMatches(item,['patrimony','name','description','serial','category','subcategory','brand','model','sector','location','notes'],query)).slice(0,50);

    const indefinite = q('#patrimonio-indefinite');

    q('#patrimonio-custody-form-v2').addEventListener('submit', async event => {
      event.preventDefault();
      if (!local.selectedReceiver) return toast('Selecione o GCM recebedor', 'Use a pesquisa pelo nome ou MASP.', 'warning');
      if (!local.custodyDraftItems.length) return toast('Adicione um equipamento', 'A gaveta da cautela está vazia.', 'warning');
      showLoading(administrative?'Validando senha e registrando cautela administrativa…':'Validando senha e registrando cautela…');
      try {
        const result = await api('patrimonio.cautela.realizar', { type: administrative?'ADMINISTRATIVA':'COMUM', receiverId: local.selectedReceiver.id, receiverMasp: local.selectedReceiver.masp, receiverPassword: value('#patrimonio-receiver-password'), dueDate: indefinite.checked ? '' : value('#patrimonio-due'), indefinite: indefinite.checked, notes: value('#patrimonio-custody-notes'), confirmation: q('#patrimonio-confirmation').checked, items: local.custodyDraftItems.map(item => ({ assetId: item.id, quantity: item.quantity, condition: item.deliveryCondition, notes: item.deliveryNotes })), metadata: meta() });
        hideLoading();
        toast(administrative?'Cautela administrativa registrada':'Cautela registrada', `${result.number} — ${result.receiver}`);
        api('patrimonio.cautela.enviarEmail', { number: result.number, metadata: meta() }).then(email => {
          if (email.sent) toast('Termo enviado por e-mail', email.address);
          else toast('Termo não enviado', email.message || 'Confira o e-mail cadastrado do recebedor.', 'warning', 7000);
        }).catch(error => toast('Falha no envio do termo', error.message, 'warning', 7000));
        printTermsV2([result]); await switchTab('ativas');
      } catch (error) { toast('Cautela não registrada', error.message, 'error', 7000); } finally { hideLoading(); }
    });
    root().addEventListener('click', event => { if (!event.target.closest('.patrimonio-search-picker')) qa('.patrimonio-picker-results', root()).forEach(region => { region.innerHTML = ''; }); });
    renderCustodyDrawerV2();
  }

  function renderCustodyDrawerV2() {
    const region = q('#patrimonio-custody-drawer'); if (!region) return;

    qa('[data-draft-asset]', region).forEach(row => {
      const item = local.custodyDraftItems.find(entry => entry.id === row.dataset.draftAsset);

    });
  }

    auditPanels[1].setAttribute('role', 'tabpanel');
    const loadTerms = async () => { q('#patrimonio-terms-table').innerHTML=tableLoading(); const data=await api('patrimonio.cautela.termos',{page:local.termsPage,pageSize:20,query:value('#patrimonio-term-search')}); q('#patrimonio-terms-table').innerHTML=data.items.length?`<table class="data-table"><thead><tr><th>Termo</th><th>Tipo</th><th>GCM recebedor</th><th>Emissão / prazo</th><th>Itens</th><th>Situação</th><th></th></tr></thead><tbody>${data.items.map(term=>`<tr><td><strong>${esc(term.number)}</strong><small>Intendente: ${esc(term.quartermaster||'—')}</small></td><td>${badge(term.type==='ADMINISTRATIVA'?'ADMINISTRATIVA':'COMUM')}</td><td><strong>${esc(term.receiver)}</strong><small>MASP ${esc(term.receiverMasp)}</small></td><td>${formatDate(term.issuedDate,true)}<small>Devolução: ${esc(term.indefinite?'Indeterminada':formatDate(term.dueDate))}</small></td><td><strong>${term.itemCount}</strong><small>${esc(term.itemsSummary)}</small></td><td>${badge(term.status)}</td><td><button class="btn btn-ghost btn-sm" data-print-term="${esc(term.number)}">Imprimir</button></td></tr>`).join('')}</tbody></table>`:emptyState('Nenhum termo encontrado.'); renderPagination(q('#patrimonio-terms-pagination'),data,page=>{local.termsPage=page;loadTerms();}); qa('[data-print-term]',root()).forEach(button=>button.addEventListener('click',async()=>{try{printTermsV2([await api('patrimonio.cautela.termo',{number:button.dataset.printTerm})]);}catch(e){toast('Não foi possível imprimir',e.message,'error');}})); };
    const loadAudit = async () => { q('#patrimonio-audit-table').innerHTML=tableLoading(); const data=await api('patrimonio.auditoria',{page:local.auditPage,pageSize:25,query:value('#patrimonio-audit-search'),result:value('#patrimonio-audit-result')}); q('#patrimonio-audit-table').innerHTML=data.items.length?`<table class="data-table"><thead><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Resultado</th><th>Registro</th><th>Motivo/observação</th></tr></thead><tbody>${data.items.map(r=>`<tr><td>${esc(r.Data)}<small>${esc(r.Hora)}</small></td><td>${esc(r.Usuário||'—')}<small>${esc(formatMasp(r.Matrícula))}</small></td><td>${esc(r.Ação)}</td><td>${badge(r.Resultado)}</td><td>${esc(r.Registro||'—')}</td><td>${esc(r.Motivo||r.Observação||'—')}</td></tr>`).join('')}</tbody></table>`:emptyState(); renderPagination(q('#patrimonio-audit-pagination'),data,page=>{local.auditPage=page;loadAudit();}); };
    let termTimer,auditTimer,eventsLoaded=false;
    qa('[data-audit-section]', auditLayout).forEach(button => button.addEventListener('click', async () => {
      const section = button.dataset.auditSection;
      qa('[data-audit-section]', auditLayout).forEach(item => { const selected=item===button; item.classList.toggle('active',selected); item.setAttribute('aria-selected',String(selected)); });
      q('#patrimonio-audit-terms-panel').hidden = section !== 'terms';
      q('#patrimonio-audit-events-panel').hidden = section !== 'events';
      if (section === 'events' && !eventsLoaded) { eventsLoaded=true; try { await loadAudit(); } catch(error) { eventsLoaded=false; toast('Falha ao carregar eventos',error.message,'error'); } }
    }));
    q('#patrimonio-term-search').addEventListener('input',()=>{clearTimeout(termTimer);termTimer=setTimeout(()=>{local.termsPage=1;loadTerms();},300);}); q('#patrimonio-audit-search').addEventListener('input',()=>{clearTimeout(auditTimer);auditTimer=setTimeout(()=>{local.auditPage=1;loadAudit();},300);}); q('#patrimonio-audit-result').addEventListener('change',loadAudit); q('#patrimonio-print-all-terms').addEventListener('click',()=>printAllTermsV2(value('#patrimonio-term-search'))); await loadTerms();
  }

  async function printAllTermsV2(query) {
    const popup = window.open('','_blank'); if (!popup) return toast('Permita pop-ups para imprimir','','warning');
    popup.document.write('<p style="font-family:Arial;padding:30px">Preparando termos de cautela…</p>'); popup.document.close();
    try { const report=await api('patrimonio.cautela.termosImpressao',{query}); printTermsV2(report.terms,popup,report.limited?`Foram encontrados ${report.total} termos. Esta impressão contém os ${report.limit} mais recentes.`:''); } catch(error) { popup.close(); toast('Não foi possível imprimir',error.message,'error'); }
  }

  function custodyTermItemDetails(item) {
    return [item.category,item.subcategory,[item.brand,item.model].filter(Boolean).join(' '),item.serial?`Série ${item.serial}`:'',item.description].filter(Boolean).join(' · ');
  }

  function custodyTermItemNotes(item) {
    const notes=[];
    if(item.assetNotes)notes.push(`<b>Cadastro:</b> ${esc(item.assetNotes)}`);
    if(item.notes)notes.push(esc(item.notes));
    return notes.length?notes.join('<br>'):'—';
  }

  function printTermsV2(terms, existingWindow, notice) {
    const w=existingWindow||window.open('','_blank'); if(!w)return toast('Permita pop-ups para imprimir','','warning');
    const institution=app.institution||'Guarda Civil Municipal de Passos';
    const logoSource=app.logoDataUrl||app.logoUrl||'';
    const sections=(terms||[]).map(term=>`<section class="term"><header><div class="seal">GCMP</div><div><small>DOCUMENTO INSTITUCIONAL · ${esc(term.type==='ADMINISTRATIVA'?'CAUTELA ADMINISTRATIVA':'CAUTELA COMUM')}</small><h1>Termo de ${term.type==='ADMINISTRATIVA'?'Cautela Administrativa':'Cautela'} ${esc(term.number)}</h1><p>${esc(institution)} · Patrimônio e Equipamentos</p></div></header><div class="receiver"><small>GCM RECEBEDOR</small><strong>${esc(term.receiver)}</strong><span>MASP ${esc(term.receiverMasp||'')} · ${esc(term.sector||'')}</span></div><div class="meta"><div><small>Intendente</small><strong>${esc(term.quartermaster||'—')}</strong><span>MASP ${esc(term.quartermasterMasp||'—')}</span></div><div><small>Emissão</small><strong>${esc(formatDate(term.issuedAt||term.issuedDate))}</strong></div><div><small>Previsão de devolução</small><strong>${esc(term.indefinite||String(term.dueDate||'').toUpperCase()==='INDETERMINADO'?'Indeterminada':formatDate(term.dueDate))}</strong></div><div><small>Verificação</small><strong class="code">${esc(term.verificationCode||'')}</strong></div></div><table><thead><tr><th>Nº patrimonial</th><th>Equipamento e identificação</th><th>Quantidade</th><th>Estado na entrega</th><th>Observações</th></tr></thead><tbody>${(term.items||[]).map(item=>`<tr><td><strong>${esc(item.patrimony||'Sem nº patrimonial')}</strong></td><td><strong>${esc(item.equipment)}</strong>${custodyTermItemDetails(item)?`<small>${esc(custodyTermItemDetails(item))}</small>`:''}</td><td>${esc(item.quantity)} ${esc(item.unit||'UN')}</td><td>${esc(item.deliveryCondition||'—')}</td><td class="observations">${custodyTermItemNotes(item)}</td></tr>`).join('')}</tbody></table><p class="declaration">Declaro ter recebido os equipamentos acima, conferidos quanto à identificação, quantidade, estado e observações registradas, assumindo responsabilidade por sua guarda e devolução.</p><div class="signatures"><div>${esc(term.receiver)}<br><small>GCM recebedor</small></div><div>${esc(term.quartermaster||'Intendente')}<br><small>Intendente</small></div></div><footer>Verificação: ${esc(term.verificationCode||'')} · Documento gerado eletronicamente.</footer></section>`).join('');
    w.document.open();w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Termos de Cautela</title><style>@page{size:A4 portrait;margin:13mm}*{box-sizing:border-box}body{margin:0;color:#172b26;font-family:Arial,sans-serif;font-size:11px}.toolbar{padding:10px;text-align:right}.toolbar button{padding:9px 14px;color:#fff;border:0;border-radius:6px;background:#173c36}.notice{margin:8px 0 14px;padding:9px;border-left:4px solid #c99b3b;background:#fff8e6}.term{min-height:260mm;break-after:page;page-break-after:always}.term:last-child{break-after:auto;page-break-after:auto}header{display:grid;grid-template-columns:58px 1fr;align-items:center;gap:14px;padding-bottom:12px;border-bottom:3px solid #173c36}.seal{display:grid;place-items:center;width:54px;height:54px;color:#fff;font-weight:900;border:3px double #c99b3b;border-radius:50%;background:#173c36}header small{color:#6b7974;letter-spacing:.1em}h1{margin:4px 0;color:#173c36;font-size:21px}header p{margin:0;color:#64736e}.receiver{margin:16px 0;padding:14px;border:2px solid #173c36;background:#f1f8f6}.receiver small,.receiver strong,.receiver span{display:block}.receiver strong{margin:4px 0;font-size:18px}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:15px}.meta>div{padding:10px;border:1px solid #cbd6d2}.meta small,.meta strong,.meta span{display:block}.meta small{color:#6b7974}.meta strong{margin:3px 0}.code{font-family:monospace}table{width:100%;border-collapse:collapse;font-size:9.5px}th,td{padding:7px;text-align:left;vertical-align:top;border:1px solid #becbc6}th{color:#fff;background:#173c36}td small{display:block;margin-top:3px;color:#5f706a;line-height:1.35}.observations{min-width:120px;line-height:1.4}.declaration{margin-top:18px;line-height:1.6}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:65px;margin-top:70px}.signatures>div{padding-top:7px;text-align:center;border-top:1px solid #172b26}.signatures small{color:#65746f}footer{margin-top:25px;padding-top:8px;text-align:center;color:#6b7974;border-top:1px solid #cbd6d2}@media print{.toolbar{display:none}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><div class="toolbar"><button onclick="window.print()">Imprimir / Salvar PDF</button></div>${notice?`<div class="notice">${esc(notice)}</div>`:''}${sections||'<p>Nenhum termo encontrado.</p>'}</body></html>`);w.document.close();setTimeout(()=>{if(!w.closed){w.focus();w.print();}},400);
    applyPrintBrandingV2(w, logoSource);
  }

  function applyPrintBrandingV2(printWindow, logoSource) {
    if (!printWindow || printWindow.closed || !printWindow.document?.head) return;
    const safeLogo = String(logoSource || '').replace(/'/g, '%27').replace(/\(/g, '%28').replace(/\)/g, '%29');
    const style = printWindow.document.createElement('style');
    style.textContent = `.toolbar button{background:#0c2948!important}header{border-bottom-color:#0c2948!important}h1{color:#0c2948!important}.receiver{border-color:#0c2948!important;background:#f3f8fd!important}th{background:#0c2948!important}.seal{color:${safeLogo ? 'transparent' : '#fff'}!important;background:${safeLogo ? `#fff url('${safeLogo}') center/contain no-repeat` : '#0c2948'}!important}`;
    printWindow.document.head.appendChild(style);
  }

  printTerm = term => printTermsV2([term]);

  function exportRows(rows,filename,type){if(!rows.length)return toast('Nada para exportar','','warning');const headers=Object.keys(rows[0]);let content,mime;if(type==='xls'){content=`<table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${headers.map(h=>`<td>${esc(r[h]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table>`;mime='application/vnd.ms-excel';}else{const csv=[headers,...rows.map(r=>headers.map(h=>String(r[h]??'').replace(/"/g,'""')))].map(line=>line.map(v=>`"${v}"`).join(';')).join('\n');content='\ufeff'+csv;mime='text/csv;charset=utf-8';}const url=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function printTable(title,html){const w=window.open('','_blank');if(!w)return toast('Permita pop-ups para imprimir','','warning');const institution=app.institution||'Guarda Civil Municipal de Passos';const logoSource=app.logoDataUrl||app.logoUrl||'';w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>@page{size:A4 landscape;margin:12mm}*{box-sizing:border-box}body{margin:0;color:#172033;font-family:Arial,sans-serif;font-size:10px}.toolbar{padding:10px 0;text-align:right}.toolbar button{padding:9px 14px;color:#fff;border:0;border-radius:6px;background:#0c2948}header{display:grid;grid-template-columns:58px 1fr;align-items:center;gap:14px;margin-bottom:18px;padding-bottom:12px;border-bottom:3px solid #0c2948}.seal{display:grid;place-items:center;width:54px;height:54px;color:#fff;font-weight:900;border:3px double #c99b3b;border-radius:50%;background:#0c2948}header small{color:#637083;letter-spacing:.1em}h1{margin:4px 0;color:#0c2948;font-size:21px}header p{margin:0;color:#637083}table{width:100%;border-collapse:collapse;font-size:9px}th,td{padding:7px;border:1px solid #ccd5df;text-align:left;vertical-align:top}th{color:#fff;background:#0c2948}.status:before{display:none}footer{margin-top:16px;padding-top:8px;color:#637083;text-align:center;border-top:1px solid #ccd5df}@media print{.toolbar{display:none}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><div class="toolbar"><button onclick="window.print()">Imprimir / Salvar PDF</button></div><header><div class="seal">GCMP</div><div><small>DOCUMENTO INSTITUCIONAL</small><h1>${esc(title)}</h1><p>${esc(institution)} · Patrimônio e Equipamentos</p></div></header>${html}<footer>Documento gerado eletronicamente pelo sistema institucional.</footer></body></html>`);w.document.close();applyPrintBrandingV2(w,logoSource);setTimeout(()=>{if(!w.closed){w.focus();w.print();}},400);}
  function printTerm(term){const items=term.items||[];const w=window.open('','_blank');if(!w)return toast('Cautela registrada. Permita pop-ups para imprimir o termo.','','warning');w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Termo ${esc(term.number)}</title><style>body{font-family:Arial,sans-serif;max-width:800px;margin:30px auto;color:#142337;padding:0 20px}h1{font-size:22px;margin-bottom:4px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.box{border:1px solid #bcc8d4;padding:10px;border-radius:6px}.box small{display:block;color:#5c6b7a}.receiver{padding:15px;border:2px solid #0f766e;background:#f0fdfa;margin:18px 0}.receiver strong{font-size:18px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #bac6d2;padding:8px;text-align:left}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:70px}.line{border-top:1px solid #222;text-align:center;padding-top:6px;font-size:11px}.verification{margin-top:24px;text-align:center;font-family:monospace}@media print{button{display:none}}</style></head><body><h1>Termo de Cautela ${esc(term.number)}</h1><p>Guarda Civil Municipal de Passos · Patrimônio e Equipamentos</p><div class="receiver"><small>GCM RECEBEDOR</small><strong>${esc(term.receiver)}</strong><br>MASP ${esc(term.receiverMasp||'')} · ${esc(term.sector||'')}</div><div class="meta"><div class="box"><small>Intendente</small><strong>${esc(term.quartermaster)}</strong><br>MASP ${esc(term.quartermasterMasp||'')}</div><div class="box"><small>Data / previsão</small><strong>${formatDate(term.issuedAt||term.issuedDate,true)}</strong><br>Devolução: ${formatDate(term.dueDate,true)}</div><div class="box"><small>Finalidade</small>${esc(term.purpose||'—')}</div><div class="box"><small>Código de verificação</small><strong>${esc(term.verificationCode||'')}</strong></div></div><table><thead><tr><th>Patrimônio</th><th>Equipamento</th><th>Quantidade</th><th>Estado</th></tr></thead><tbody>${items.map(i=>`<tr><td>${esc(i.patrimony||'')}</td><td>${esc(i.equipment||'')}</td><td>${esc(i.quantity)} ${esc(i.unit||'')}</td><td>${esc(i.deliveryCondition||'')}</td></tr>`).join('')}</tbody></table><p>Declaro ter recebido os itens acima, conferidos quanto à quantidade e ao estado, assumindo responsabilidade por sua guarda e devolução.</p><div class="signatures"><div class="line">${esc(term.receiver)}<br>GCM recebedor</div><div class="line">${esc(term.quartermaster)}<br>Intendente</div></div><div class="verification">Verificação: ${esc(term.verificationCode||'')}</div><p><button onclick="window.print()">Imprimir / Salvar PDF</button></p></body></html>`);w.document.close();}

  return { init };
};
</script>
