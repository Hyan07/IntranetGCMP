  async function viewDocument(id) {
    showLoading('Abrindo documento…');
    try {
      const details = await api('documents.get', { id }); const d = details.document;
      const body = openModal({ title: d.ASSUNTO, eyebrow: `${d.TIPO} • ${d.NUMERO || 'Sem número'}`, wide: true, hideSubmit: true,
        body: `<div class="detail-grid"><div class="detail-item"><span>Data</span><strong>${formatDate(d.DATA_DOCUMENTO,true)}</strong></div><div class="detail-item"><span>Situação</span>${badge(d.SITUACAO)}</div><div class="detail-item"><span>Setor</span><strong>${esc(d.SETOR || '—')}</strong></div><div class="detail-item"><span>Acesso</span>${badge(d.NIVEL_ACESSO)}</div></div><p style="margin:20px 0;color:var(--slate-600)">${esc(d.DESCRICAO || 'Sem descrição.')}</p><h3 style="margin:20px 0 10px">Arquivos</h3>${details.files.length ? details.files.map(file => `<button class="action-row" type="button" data-open-file="${esc(file.ID_ARQUIVO_DRIVE)}"><span class="action-icon">${icon('file')}</span><span><strong>${esc(file.NOME_ARQUIVO)}</strong><small>${esc(file.MIME_TYPE)} • versão ${esc(file.VERSAO)}</small></span>${icon('external')}</button>`).join('') : emptyState('Nenhum arquivo enviado.')}${has('documentos.criar') ? `<div style="margin-top:16px"><label class="field"><span>Adicionar arquivo (até 5 MB)</span><input id="additional-document-file" type="file"></label><button id="upload-additional-file" class="btn btn-secondary" style="margin-top:10px" type="button">${icon('upload')} Enviar arquivo</button></div>` : ''}` });
      $$('[data-open-file]', body).forEach(button => button.addEventListener('click', async () => { try { const info = await api('documents.openFile', { fileId: button.dataset.openFile }); window.open(info.url, '_blank', 'noopener'); } catch (error) { toast('Arquivo indisponível', error.message, 'error'); } }));
      $('#upload-additional-file', body)?.addEventListener('click', async () => { const file = $('#additional-document-file', body).files[0]; if (!file) return toast('Selecione um arquivo', '', 'warning'); if (file.size > 5*1024*1024) return toast('Arquivo muito grande','Limite de 5 MB.','error'); showLoading('Enviando arquivo…'); try { await api('documents.upload',{ID_DOCUMENTO:id,file:{name:file.name,dataUrl:await readFile(file)}}); toast('Arquivo enviado'); closeModal(); await viewDocument(id); } catch(error){toast('Falha no envio',error.message,'error');} finally {hideLoading();} });
    } catch (error) { toast('Não foi possível abrir', error.message, 'error'); } finally { hideLoading(); }
  }

  function readFile(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error('Falha ao ler o arquivo.')); reader.readAsDataURL(file); }); }

  /* Rewards */

  async function loadRewards() {

  async function viewReward(id) {

  async function loadSettings(initialRows){const rows=initialRows||await api('settings.list');const labels={NOME_SISTEMA:'Nome do sistema',NOME_INSTITUICAO:'Nome da instituição',LOGO_URL:'Link ou ID do brasão da GCMP',FAVICON_URL:'URL do favicon',SESSAO_HORAS:'Duração da sessão (horas)',SESSAO_INATIVIDADE_MINUTOS:'Inatividade máxima (minutos)',MAX_TENTATIVAS_LOGIN:'Tentativas de login',BLOQUEIO_MINUTOS:'Bloqueio temporário (minutos)',RECUPERACAO_MINUTOS:'Validade da recuperação (minutos)',EMAIL_SUPORTE:'E-mail de suporte'};$('#settings-fields').innerHTML=rows.map(row=>`<label class="field ${['NOME_SISTEMA','NOME_INSTITUICAO'].includes(row.CHAVE)?'span-2':''}"><span>${esc(labels[row.CHAVE]||row.CHAVE)}</span><input name="${esc(row.CHAVE)}" value="${esc(row.VALOR||'')}"><small>${esc(row.DESCRICAO||'')}</small></label>`).join('');$('#settings-form').addEventListener('submit',async event=>{event.preventDefault();showLoading('Salvando configurações…');try{await api('settings.save',{values:formObject(event.currentTarget)});toast('Configurações salvas');}catch(error){toast('Falha ao salvar',error.message,'error');}finally{hideLoading();}});}

  function normalizeBulkSearch(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}

  async function loadBulkPermissions(initialData){
    const usersRegion=$('#bulk-users-list'),permissionsRegion=$('#bulk-permissions-list');

      state.bulkPermissionsData=initialData||state.bulkPermissionsData||await api('users.bulkPermissionData');
      renderBulkPermissionUsers(state.bulkPermissionsData.users||[]);
      renderBulkPermissionCatalog(state.bulkPermissionsData.permissions||[]);

      const message=`<div class="form-message error bulk-load-error">${esc(error.message)}</div>`;
      usersRegion.innerHTML=message;permissionsRegion.innerHTML=message;
    }
  }

  function renderBulkPermissionUsers(users){
    const region=$('#bulk-users-list');
    region.innerHTML=users.length?users.map(user=>{
      const search=normalizeBulkSearch([user.name,user.masp,user.email,user.sector,user.functionName,user.status].join(' '));
      return `<label class="bulk-user-option" data-bulk-user-option data-search="${esc(search)}"><input type="checkbox" data-bulk-user value="${esc(user.id)}"><span class="bulk-option-copy"><strong>${esc(user.name||'Usuário sem nome')}</strong><small>${esc(formatMasp(user.masp)||'Sem MASP')} • ${esc(user.sector||user.functionName||user.email||'Sem lotação informada')}</small></span>${badge(user.status||'ATIVO')}</label>`;
    }).join(''):emptyState('Nenhum usuário cadastrado.');
    region.addEventListener('change',event=>{if(event.target.matches('[data-bulk-user]'))updateBulkPermissionSummary();});
  }

  function renderBulkPermissionCatalog(permissions){
    const region=$('#bulk-permissions-list'),groups={};
    permissions.forEach(permission=>{const module=permission.module||String(permission.code||'').split('.')[0]||'geral';(groups[module]||(groups[module]=[])).push(permission);});
    const modules=Object.keys(groups);
    region.innerHTML=modules.length?modules.map(module=>`<section class="permission-module bulk-permission-module" data-bulk-permission-group><div class="permission-module-header"><strong>${esc(statusLabel(module))}</strong><button class="btn btn-link" type="button" data-bulk-module-toggle>Selecionar módulo</button></div><div class="permission-module-body">${groups[module].map(permission=>{const search=normalizeBulkSearch([permission.code,permission.module,permission.action,permission.description].join(' '));return `<label data-bulk-permission-option data-search="${esc(search)}"><input type="checkbox" data-bulk-permission value="${esc(permission.code)}"><span><strong>${esc(permission.description||statusLabel(permission.action)||permission.code)}</strong><small>${esc(permission.code)}</small></span></label>`;}).join('')}</div></section>`).join(''):emptyState('Nenhuma permissão ativa foi encontrada.');
    region.addEventListener('change',event=>{if(event.target.matches('[data-bulk-permission]'))updateBulkPermissionSummary();});
    $$('[data-bulk-module-toggle]',region).forEach(button=>button.addEventListener('click',()=>{const inputs=$$('[data-bulk-permission]',button.closest('[data-bulk-permission-group]')).filter(input=>!input.closest('[data-bulk-permission-option]').hidden);const select=inputs.some(input=>!input.checked);inputs.forEach(input=>{input.checked=select;});updateBulkPermissionSummary();}));
  }

  function filterBulkPermissionOptions(type){
    const users=type==='users',query=normalizeBulkSearch($(users?'#bulk-users-search':'#bulk-permissions-search')?.value);
    const selector=users?'[data-bulk-user-option]':'[data-bulk-permission-option]';
    $$(selector).forEach(option=>{option.hidden=Boolean(query)&&!String(option.dataset.search||'').includes(query);});
    if(!users)$$('[data-bulk-permission-group]').forEach(group=>{group.hidden=!$$('[data-bulk-permission-option]',group).some(option=>!option.hidden);});
  }

  function setBulkVisibleSelection(type,checked){
    const users=type==='users',selector=users?'[data-bulk-user-option]':'[data-bulk-permission-option]';
    $$(selector).filter(option=>!option.hidden&&!option.closest('[data-bulk-permission-group][hidden]')).forEach(option=>{const input=$(users?'[data-bulk-user]':'[data-bulk-permission]',option);if(input)input.checked=checked;});
    updateBulkPermissionSummary();
  }

  function setBulkSelection(type,checked){
    $$(`[data-bulk-${type==='users'?'user':'permission'}]`).forEach(input=>{input.checked=checked;});
    updateBulkPermissionSummary();
  }

  function updateBulkPermissionSummary(){
    const users=$$('[data-bulk-user]:checked').length,permissions=$$('[data-bulk-permission]:checked').length,total=users*permissions;
    const usersCount=$('#bulk-users-count'),permissionsCount=$('#bulk-permissions-count'),summary=$('#bulk-permissions-summary'),submit=$('#bulk-permissions-submit');
    if(usersCount)usersCount.textContent=`${users} selecionado${users===1?'':'s'}`;
    if(permissionsCount)permissionsCount.textContent=`${permissions} selecionada${permissions===1?'':'s'}`;
    if(summary)summary.innerHTML=users&&permissions?`<strong>${users} usuário${users===1?'':'s'}</strong> receberá${users===1?'':'ão'} <strong>${permissions} permissão${permissions===1?'':'ões'}</strong> — até ${total} concessão${total===1?'':'ões'} serão verificadas.`:'Selecione ao menos um usuário e uma permissão para continuar.';
    if(submit)submit.disabled=!(users&&permissions);
  }

  async function submitBulkPermissions(event){
    event.preventDefault();
    const userIds=$$('[data-bulk-user]:checked').map(input=>input.value),permissions=$$('[data-bulk-permission]:checked').map(input=>input.value);
    if(!userIds.length||!permissions.length)return toast('Seleção incompleta','Marque ao menos um usuário e uma permissão.','warning');
    const combinations=userIds.length*permissions.length;
    const confirmed=await confirmAction('Conceder permissões em massa',`${userIds.length} usuário(s) receberão ${permissions.length} permissão(ões). O sistema verificará ${combinations} combinação(ões) sem retirar acessos existentes.`,'Conceder permissões');
    if(!confirmed)return;
    showLoading('Atualizando permissões…');
    try{
      const result=await api('users.grantBulkPermissions',{userIds,permissions,justification:$('#bulk-permissions-justification')?.value||''});
      toast('Permissões confirmadas',`${result.concessoesVerificadas} concessão(ões) verificadas no sistema.`);
      openBulkPermissionResult(result);
      setBulkSelection('users',false);setBulkSelection('permissions',false);
      if($('#bulk-permissions-justification'))$('#bulk-permissions-justification').value='';
    }catch(error){toast('Não foi possível atualizar',error.message,'error');}
    finally{hideLoading();}
  }

    $('#already-have-code').addEventListener('click',()=>showRecoveryConfirmation());
    $('#recovery-request-form').addEventListener('submit',async event=>{event.preventDefault();const messages=$$('.recovery-message',$('#recovery-panel'));messages.forEach(m=>m.hidden=true);const payload=formObject(event.currentTarget);const button=$('button[type="submit"]',event.currentTarget);button.disabled=true;try{const result=await publicApi('requestRecovery',payload);showRecoveryConfirmation(payload,result.message);}catch(err){const msg=$('.recovery-message',event.currentTarget);showFormError(msg,err);}finally{button.disabled=false;}});
    $('#recovery-confirm-form').addEventListener('submit',async event=>{event.preventDefault();const msg=$('.recovery-message',event.currentTarget);msg.hidden=true;const button=$('button[type="submit"]',event.currentTarget);button.disabled=true;try{const result=await publicApi('confirmRecovery',formObject(event.currentTarget));msg.className='form-message success recovery-message';msg.textContent=result.message;msg.hidden=false;setTimeout(()=>{$('#recovery-panel').hidden=true;$('#login-panel').hidden=false;},1400);}catch(err){msg.className='form-message error recovery-message';showFormError(msg,err);}finally{button.disabled=false;}});
  }

  async function initialize(){
    hydrateIcons();bindGlobalEvents();bindAuthEvents();$('#login-app-name').textContent=window.APP_META?.name||'Intranet Recursos';$('#auth-version').textContent=window.APP_META?.version||'1.0.0';setConnection(navigator.onLine);
    try{const health=await publicApi('health');if(!health.installed){$('#login-error').textContent='Sistema ainda não instalado. Execute instalarSistema() no editor do Apps Script.';$('#login-error').hidden=false;}}
    catch(error){setConnection(false);}
    await restoreSession();
  }

  document.addEventListener('DOMContentLoaded',initialize);
})();
</script>
