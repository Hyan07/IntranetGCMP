<script>
(function () {
  'use strict';

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
  const state = {
    token: sessionStorage.getItem('intranet.session') || '',
    bootstrap: null,
    user: null,
    permissions: [],
    modules: [],
    lookups: null,
    currentPage: 'dashboard',
    alerts: [],
    notifications: [],
    bulkPermissionsData: null,
    pagePayloads: {},
    pages: { users: 1, personnel: 1, assets: 1, vehicles: 1, documents: 1, rewards: 1, audit: 1 },
    tabs: { assets: 'inventory', vehicles: 'fleet', settings: 'general' },
    userFilters: { query: '', status: '' },
    userLoadSequence: 0,
    modalSubmit: null,
    confirmResolve: null,
    requestCount: 0,
    renderEpoch: 0,
    lastAccessSyncAt: 0,
    accessSyncing: false
  };

  const PAGE_META = {
    dashboard: ['Início', 'Visão geral dos recursos'],
    usuarios: ['Usuários', 'Administração de acessos'],
    pessoal: ['Pessoal', 'Cadastro institucional'],
    patrimonio: ['Patrimônio e cautelas', 'Controle de bens'],
    viaturas: ['Frota', 'Controle operacional'],
    documentos: ['Documentos gerais', 'Gestão documental'],
    recompensas: ['Pedidos de recompensa', 'Tramitação administrativa'],
    perfil: ['Minha Conta', 'Dados, responsabilidades e segurança'],
    configuracoes: ['Administração', 'Configurações e auditoria']
  };

  const ICONS = {
    home: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-6h5v6"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
    badge: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h6M8 12h8M8 16h5"/>',
    inventory: '<path d="M4 7h16v14H4z"/><path d="m3 3 2 4h14l2-4zM9 11h6"/>',
    car: '<path d="m5 17-1 3M19 17l1 3"/><path d="M3 13h18l-2-7H5z"/><path d="M5 13v5h14v-5"/><circle cx="7" cy="16" r="1"/><circle cx="17" cy="16" r="1"/>',
    folder: '<path d="M3 6h7l2 2h9v11H3z"/><path d="M3 6v13"/>',
    award: '<circle cx="12" cy="8" r="5"/><path d="m8.5 12-1 9 4.5-2 4.5 2-1-9"/><path d="m10.5 8 1 1 2-2"/>',
    profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.08 14H3v-4h.08A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63a1.7 1.7 0 0 0 1-1.55V3h4v.08A1.7 1.7 0 0 0 15 4.63a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9a1.7 1.7 0 0 0 1.55 1H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/>',
    shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>',
    history: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
    mobile: '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
    lock: '<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>',
    eye: '<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/>',
    eyeOff: '<path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.5 5.3A11.4 11.4 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.1 3M6.6 6.6C3.5 8.5 2 12 2 12s3.5 7 10 7a10 10 0 0 0 4-.8"/>',
    arrowRight: '<path d="M5 12h14M13 6l6 6-6 6"/>', arrowLeft: '<path d="M19 12H5M11 18l-6-6 6-6"/>',
    chevronRight: '<path d="m9 18 6-6-6-6"/>', chevronDown: '<path d="m6 9 6 6 6-6"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
    pin: '<path d="m14 4 6 6-3 1-4 4-1 5-2-6-6-2 5-1 4-4zM3 21l6-6"/>',
    panelLeftClose: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 9l-3 3 3 3"/>',
    panelLeftOpen: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M12 9l3 3-3 3"/>',
    logout: '<path d="M10 17l5-5-5-5M15 12H3M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/>',
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>', bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',
    grid: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
    plus: '<path d="M12 5v14M5 12h14"/>', search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>', refresh: '<path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 8a7 7 0 0 1 11.7-2.1L20 8M4 16l2.2 2.1A7 7 0 0 0 18 16"/>',
    edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/>', trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7M14 10v7"/>',
    key: '<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M15 8l3 3M17 6l2 2"/>', check: '<path d="m5 12 4 4L19 6"/>', close: '<path d="M6 6l12 12M18 6 6 18"/>',
    alert: '<path d="M10.3 3.8 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',
    inbox: '<path d="M4 4h16v16H4z"/><path d="M4 14h5l2 2h2l2-2h5"/>', hand: '<path d="M7 11V6a2 2 0 0 1 4 0v5M11 10V5a2 2 0 0 1 4 0v6M15 10V7a2 2 0 0 1 4 0v8c0 4-3 7-7 7h-1c-3 0-5-1-7-4l-2-3a2 2 0 0 1 3-2l2 2"/>',
    play: '<circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/>', stop: '<circle cx="12" cy="12" r="9"/><rect x="9" y="9" width="6" height="6"/>',
    upload: '<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>', file: '<path d="M6 2h9l4 4v16H6z"/><path d="M14 2v5h5M9 12h6M9 16h6"/>', external: '<path d="M14 3h7v7M10 14 21 3"/><path d="M18 13v8H3V6h8"/>',
    save: '<path d="M5 3h12l3 3v15H4V3z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/>', devices: '<rect x="3" y="4" width="14" height="10" rx="1"/><path d="M8 18h4M10 14v4M19 8h3v12h-7v-4"/>',
    more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    phone: '<path d="M5 3h4l2 5-3 2a15 15 0 0 0 6 6l2-3 5 2v4c0 1-1 2-2 2C10 21 3 14 3 5c0-1 1-2 2-2Z"/>', map: '<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2"/>',
    copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/>', filter: '<path d="M3 5h18l-7 8v6l-4 2v-8z"/>'
  };

  function icon(name) {
    return `<svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ICONS.file}</svg>`;
  }

  function hydrateIcons(root = document) {
    $$('[data-icon]', root).forEach(node => { node.innerHTML = icon(node.dataset.icon); });
  }

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
  }

  function initials(name) {
    const parts = String(name || 'Usuário').trim().split(/\s+/).filter(Boolean);
    return (parts[0]?.[0] || 'U') + (parts.length > 1 ? parts[parts.length - 1][0] : '');
  }

  function formatMasp(value) {
    const digits = String(value || '').replace(/\D/g, '');
    return digits.length > 2 ? `${digits.slice(0, -2).padStart(6, '0')}-${digits.slice(-2)}` : digits;
  }

  function formatDate(value, dateOnly = false) {
    if (!value) return '—';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return esc(value);
    return new Intl.DateTimeFormat('pt-BR', dateOnly ? { dateStyle: 'short' } : { dateStyle: 'short', timeStyle: 'short' }).format(date);
  }

  function formatMoney(value) {
    if (value === '' || value == null) return '—';
    return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(value || 0));
  }

  function debounce(fn, wait = 350) {
    let timer;
    return function (...args) { clearTimeout(timer); timer = setTimeout(() => fn.apply(this, args), wait); };
  }

  function has(permission) { return state.permissions.includes(permission); }
  function pageAllowed(page) { return state.modules.some(module => module.id === page); }

  function statusTone(status) {
    const value = String(status || '').toUpperCase();
    if (['ATIVO', 'DISPONIVEL', 'APROVADO', 'CONCLUIDA', 'ENCERRADO', 'ENCERRADA', 'DEVOLVIDA', 'SUCESSO', 'NOVO', 'BOM', 'RESOLVIDO'].includes(value)) return 'green';
    if (['EM_SERVICO', 'EM_USO', 'EM_ANALISE', 'EM_TRAMITACAO', 'EM_REPARO', 'ABERTO', 'ABERTA', 'AUTORIZADA'].includes(value)) return 'blue';
    if (['CAUTELADO', 'MANUTENCAO', 'EM_MANUTENCAO', 'ENVIADO', 'PARECER', 'RESERVADA', 'AFASTADO', 'ATENCAO', 'RUIM', 'MEDIA', 'AGUARDANDO_ORCAMENTO', 'AGUARDANDO_PECA', 'PROGRAMADA'].includes(value)) return 'amber';
    if (['BLOQUEADO', 'INATIVO', 'INATIVA', 'INDEFERIDO', 'DANIFICADO', 'INDISPONIVEL', 'VENCIDO', 'CANCELADO', 'CANCELADA', 'BAIXADO', 'BAIXADA', 'SINISTRADA', 'CRITICO', 'ALTA', 'VIATURA_SEM_CONDICOES_DE_USO'].includes(value)) return 'red';
    return 'purple';
  }

  function statusLabel(status) {
    return String(status || '—').replace(/_/g, ' ');
  }

  function badge(status) { return `<span class="status ${statusTone(status)}">${esc(statusLabel(status))}</span>`; }

  function callServer(functionName, args) {
    return new Promise((resolve, reject) => {
      if (!window.google?.script?.run) return reject(new Error('A API do Google Apps Script não está disponível.'));
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(new Error(error?.message || String(error))))
        [functionName](...args);
    });
  }

  async function publicApi(action, payload = {}) {
    setConnection(true);
    const response = await callServer('apiPublic', [action, payload]);
    if (!response?.ok) throw normalizeApiError(response?.error);
    return response.data;
  }

  async function api(action, payload = {}) {
    if (!state.token) throw Object.assign(new Error('Sessão não encontrada.'), { code: 'UNAUTHENTICATED' });
    state.requestCount += 1;
    setConnection(true);
    try {
      const response = await callServer('apiCall', [state.token, action, payload]);
      if (!response?.ok) throw normalizeApiError(response?.error);
      return response.data;
    } catch (error) {
      if (['UNAUTHENTICATED', 'SESSION_INVALID', 'SESSION_EXPIRED', 'SESSION_IDLE', 'USER_INACTIVE'].includes(error.code)) {
        clearSession();
        showAuth();
        toast('Sessão encerrada', error.message, 'warning');
      }
      throw error;
    } finally {
      state.requestCount = Math.max(0, state.requestCount - 1);
    }
  }

  function normalizeApiError(error) {
    const normalized = new Error(error?.message || 'Não foi possível concluir a operação.');
    normalized.code = error?.code || 'INTERNAL_ERROR';
    normalized.details = error?.details || null;
    return normalized;
  }

  function setConnection(online) {
    const indicator = $('#connection-indicator');
    if (!indicator) return;
    indicator.classList.toggle('offline', !online);
    indicator.lastChild.textContent = online ? ' Online' : ' Offline';
  }

  function showLoading(message = 'Processando…') { $('#loading-text').textContent = message; $('#global-loading').hidden = false; }
  function hideLoading() { $('#global-loading').hidden = true; }

  function toast(title, message = '', type = 'success', duration = 5000) {
    const region = $('#toast-region');
    const node = document.createElement('div');
    node.className = `toast ${type}`;
    const iconName = type === 'error' ? 'alert' : type === 'warning' ? 'bell' : 'check';
    node.innerHTML = `<span class="toast-icon">${icon(iconName)}</span><span class="toast-copy"><strong>${esc(title)}</strong><span>${esc(message)}</span></span><button type="button" aria-label="Fechar">${icon('close')}</button>`;
    node.querySelector('button').addEventListener('click', () => node.remove());
    region.appendChild(node);
    setTimeout(() => node.remove(), duration);
  }

  function showFormError(container, error) {
    container.textContent = error?.message || String(error);
    container.hidden = false;
  }

  function formObject(form) {
    const output = {};
    const data = new FormData(form);
    for (const [key, value] of data.entries()) {
      if (Object.prototype.hasOwnProperty.call(output, key)) output[key] = Array.isArray(output[key]) ? [...output[key], value] : [output[key], value];
      else output[key] = value;
    }
    $$('input[type="checkbox"][name]', form).forEach(input => {
      const same = $$(`input[type="checkbox"][name="${CSS.escape(input.name)}"]`, form);
      if (same.length === 1) output[input.name] = input.checked;
      else output[input.name] = same.filter(item => item.checked).map(item => item.value);
    });
    return output;
  }

  function downloadCsvRows(rows,filename){
    if(!rows?.length)throw new Error('Nenhum registro corresponde aos filtros informados.');
    const headers=Object.keys(rows[0]);
    const csv=[headers,...rows.map(row=>headers.map(header=>row[header]??''))].map(line=>line.map(value=>`"${String(value).replace(/"/g,'""')}"`).join(';')).join('\r\n');
    const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
    const anchor=document.createElement('a');anchor.href=url;anchor.download=filename||'exportacao.csv';document.body.appendChild(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
  }

  function selectOptions(items, selected, valueKey = 'value', labelKey = 'label', placeholder = 'Selecione') {
    return `<option value="">${esc(placeholder)}</option>${(items || []).map(item => {
      const value = typeof item === 'object' ? item[valueKey] : item;
      const label = typeof item === 'object' ? item[labelKey] : item;
      return `<option value="${esc(value)}" ${String(value) === String(selected || '') ? 'selected' : ''}>${esc(label)}</option>`;
    }).join('')}`;
  }

  function emptyState(message = 'Revise os filtros ou cadastre o primeiro item.') {
    return `<div class="empty-state"><span class="empty-icon">${icon('inbox')}</span><h3>Nenhum registro encontrado</h3><p>${esc(message)}</p></div>`;
  }

  function tableLoading() { return `<div class="table-loading"><span class="spinner"></span></div>`; }

  function renderPagination(container, result, onPage) {
    if (!container) return;
    if (!result || result.total === 0) { container.innerHTML = ''; return; }
    const start = (result.page - 1) * result.pageSize + 1;
    const end = Math.min(result.total, result.page * result.pageSize);
    const pages = [];
    for (let page = Math.max(1, result.page - 2); page <= Math.min(result.pages, result.page + 2); page += 1) pages.push(page);
    container.innerHTML = `<span>Exibindo ${start}–${end} de ${result.total}</span><div class="pagination-buttons"><button type="button" data-page-number="${result.page - 1}" ${result.page <= 1 ? 'disabled' : ''}>‹</button>${pages.map(page => `<button type="button" class="${page === result.page ? 'active' : ''}" data-page-number="${page}">${page}</button>`).join('')}<button type="button" data-page-number="${result.page + 1}" ${result.page >= result.pages ? 'disabled' : ''}>›</button></div>`;
    $$('[data-page-number]', container).forEach(button => button.addEventListener('click', () => onPage(Number(button.dataset.pageNumber))));
  }

  function openModal(options) {
    const root = $('#modal-root');
    const modal = $('.modal', root);
    modal.classList.toggle('modal-wide', Boolean(options.wide));
    $('#modal-title').textContent = options.title || 'Detalhes';
    $('#modal-eyebrow').textContent = options.eyebrow || 'Intranet';
    $('#modal-body').innerHTML = options.body || '';
    $('#modal-submit').textContent = options.submitText || 'Salvar';
    $('#modal-footer').hidden = Boolean(options.hideFooter);
    $('#modal-submit').hidden = Boolean(options.hideSubmit);
    $('#modal-error').hidden = true;
    state.modalSubmit = options.onSubmit || null;
    root.hidden = false;
    hydrateIcons(root);
    setTimeout(() => $('input:not([type="hidden"]), select, textarea, button', $('#modal-body'))?.focus(), 30);
    return $('#modal-body');
  }

  function closeModal() {
    $('#modal-root').hidden = true;
    $('#modal-body').innerHTML = '';
    state.modalSubmit = null;
  }

  function confirmAction(title, message, confirmLabel = 'Confirmar') {
    return new Promise(resolve => {
      state.confirmResolve = resolve;
      $('#confirm-title').textContent = title;
      $('#confirm-message').textContent = message;
      $('#confirm-accept').textContent = confirmLabel;
      $('#confirm-root').hidden = false;
    });
  }

  function closeConfirm(value) {
    $('#confirm-root').hidden = true;
    if (state.confirmResolve) state.confirmResolve(value);
    state.confirmResolve = null;
  }

  async function ensureLookups(force = false) {
    if (!state.lookups || force) state.lookups = await api('lookups.get');
    return state.lookups || {};
  }

  async function loadPagePayload(page, payload = {}) {
    const data = await api('page.payload', Object.assign({ page }, payload));
    state.pagePayloads[page] = data;
    if (data.lookups) state.lookups = data.lookups;
    if (data.notifications) {
      state.notifications = data.notifications.items || [];
      updateNotificationBadge();
    }
    return data;
  }

  function showTemporaryPassword(password, masp) {
    const body = openModal({
      title: 'Senha provisória criada', eyebrow: 'Credenciais', hideSubmit: true,
      body: `<div class="form-message info">Esta senha é exibida apenas agora. Entregue-a ao usuário por um canal seguro.</div><div style="margin-top:18px;padding:18px;border:1px solid var(--slate-150);border-radius:12px;background:var(--slate-50);text-align:center"><small style="color:var(--slate-500)">MASP</small><strong style="display:block;margin:4px 0 14px;font-size:19px">${esc(formatMasp(masp))}</strong><small style="color:var(--slate-500)">SENHA TEMPORÁRIA</small><strong id="temporary-password" style="display:block;margin-top:4px;font-size:21px;letter-spacing:.05em">${esc(password)}</strong><button id="copy-password" class="btn btn-secondary btn-sm" style="margin-top:15px" type="button">${icon('copy')} Copiar senha</button></div>`
    });
    $('#copy-password', body).addEventListener('click', async () => {
      await navigator.clipboard.writeText(password);
      toast('Senha copiada', 'Cole-a somente em um canal seguro.');
    });
  }

  /* Authentication */
  function showAuth() {
    $('#auth-view').hidden = false;
    $('#application').hidden = true;
    $('#login-form').reset();
    $('#login-error').hidden = true;
    setTimeout(() => $('#login-masp')?.focus(), 30);
  }

  function showRecoveryConfirmation(payload = {}, message = '') {
    const requestForm = $('#recovery-request-form');
    const confirmForm = $('#recovery-confirm-form');
    const maspField = confirmForm.elements.namedItem('masp');
    const emailField = confirmForm.elements.namedItem('email');
    if (maspField && payload.masp) maspField.value = payload.masp;
    if (emailField && payload.email) emailField.value = payload.email;
    requestForm.hidden = true;
    confirmForm.hidden = false;
    const status = $('.recovery-message', confirmForm);
    if (message) {
      status.className = 'form-message info recovery-message';
      status.textContent = message;
      status.hidden = false;
    } else {
      status.hidden = true;
    }
    setTimeout(() => confirmForm.elements.namedItem('code')?.focus(), 30);
  }

  function clearSession() {
    state.renderEpoch += 1;
    state.token = '';
    state.bootstrap = null;
    state.user = null;
    state.permissions = [];
    state.modules = [];
    state.lookups = null;
    state.notifications = [];
    state.pagePayloads = {};
    state.lastAccessSyncAt = 0;
    state.accessSyncing = false;
    sessionStorage.removeItem('intranet.session');
  }

  async function restoreSession() {
    if (!state.token) return showAuth();
    try {
      const bootstrap = await api('bootstrap');
      enterApplication(bootstrap);
    } catch (error) {
      clearSession();
      showAuth();
    }
  }

  function enterApplication(bootstrap) {
    state.bootstrap = bootstrap;
    state.user = bootstrap.user;
    state.permissions = bootstrap.permissions || [];
    state.modules = bootstrap.modules || [];
    $('#auth-view').hidden = true;
    $('#application').hidden = false;
    mountIdentity();
    mountMenu();
    if (bootstrap.mustChangePassword) {
      navigate('perfil', true);
      setTimeout(() => openChangePasswordModal(true), 200);
    } else {
      const requested = location.hash.replace('#/', '') || 'dashboard';
      navigate(pageAllowed(requested) ? requested : 'dashboard', true);
    }
  }

  function mountIdentity() {
    const name = state.user.NOME || 'Usuário';
    const avatar = initials(name);
    const logo = state.bootstrap?.app?.logoDataUrl || state.bootstrap?.app?.logoUrl || '';
    if (logo) $$('.brand-mark').forEach(mark => { mark.innerHTML = `<img src="${esc(logo)}" alt="Brasão da GCMP" onerror="this.nextElementSibling.hidden=false;this.remove()"><span hidden>GCMP</span>`; });
    ['#sidebar-avatar', '#header-avatar'].forEach(selector => $(selector).textContent = avatar);
    $('#sidebar-user-name').textContent = name;
    $('#sidebar-user-masp').textContent = state.user.MASP_FORMATADO || formatMasp(state.user.MASP);
    $('#header-user-name').textContent = name;
    $('#header-user-role').textContent = state.user.FUNCAO || state.user.CARGO || 'Acesso institucional';
    $('#app-short-name').textContent = state.bootstrap.app.name;
  }

  function mountMenu() {
    const menu = $('#main-menu');
    menu.innerHTML = state.modules.map(module => `<button class="menu-item" type="button" data-page="${esc(module.id)}" title="${esc(module.label)}"><span class="menu-icon">${icon(module.icon)}</span><span class="menu-label">${esc(module.label)}</span><span class="menu-active-dot" aria-hidden="true"></span></button>`).join('');
  }

  function setSidebarCollapsed(collapsed) {
    const sidebar = $('#sidebar');
    const button = $('#sidebar-pin');
    sidebar.classList.toggle('is-collapsed', Boolean(collapsed));
    button.classList.toggle('active', Boolean(collapsed));
    button.setAttribute('aria-label', collapsed ? 'Expandir menu' : 'Recolher menu');
    button.title = collapsed ? 'Expandir menu' : 'Recolher menu';
    button.innerHTML = icon(collapsed ? 'panelLeftOpen' : 'panelLeftClose');
    try { localStorage.setItem('intranet.sidebar.collapsed', collapsed ? '1' : '0'); } catch (_) {}
  }

  async function refreshAccessState(force=false){
    if(!state.token||state.accessSyncing||document.hidden)return;
    const now=Date.now();if(!force&&now-state.lastAccessSyncAt<30000)return;
    state.accessSyncing=true;state.lastAccessSyncAt=now;
    try{
      const bootstrap=await api('bootstrap');
      const before=JSON.stringify(state.permissions.slice().sort()),after=JSON.stringify((bootstrap.permissions||[]).slice().sort());
      const changed=before!==after;
      state.bootstrap=bootstrap;state.user=bootstrap.user;state.permissions=bootstrap.permissions||[];state.modules=bootstrap.modules||[];
      mountIdentity();if(changed){mountMenu();if(!pageAllowed(state.currentPage))navigate('dashboard',true);toast('Acessos atualizados','Suas permissões foram sincronizadas.');}
    }catch(error){/* api() já encerra sessões inválidas; falhas temporárias não interrompem a tela atual. */}
    finally{state.accessSyncing=false;}
  }

  function closeMobileMenu() {
    $('#sidebar').classList.remove('mobile-open');
    $('#mobile-backdrop').hidden = true;
  }

  async function logout() {
    const token = state.token;
    clearSession();
    try { if (token) await callServer('apiCall', [token, 'logout', {}]); } catch (_) {}
    showAuth();
    toast('Sessão encerrada', 'Até logo.');
  }

  /* Navigation */
  function navigate(page, replaceHash = false) {
    if (!pageAllowed(page)) return toast('Acesso não permitido', 'Você não possui permissão para abrir esta página.', 'warning');
    const renderEpoch = ++state.renderEpoch;
    state.currentPage = page;
    const meta = PAGE_META[page] || [page, 'Intranet'];
    $('#page-title').textContent = meta[0];
    $('#page-breadcrumb').textContent = meta[1];
    $$('.menu-item[data-page]').forEach(item => item.classList.toggle('active', item.dataset.page === page));
    const template = $(`#page-${page}`);
    const main = $('#main-content');
    main.innerHTML = '';
    if (!template) { main.innerHTML = emptyState('Página ainda não configurada.'); return; }
    main.appendChild(template.content.cloneNode(true));
    hydrateIcons(main);
    main.focus({ preventScroll: true });
    if (replaceHash) history.replaceState(null, '', `#/${page}`); else if (location.hash !== `#/${page}`) history.pushState(null, '', `#/${page}`);
    closeMobileMenu();
    renderCurrentPage(page).catch(error => {
      if (renderEpoch !== state.renderEpoch || state.currentPage !== page || !main.isConnected) return;
      main.innerHTML = `<div class="form-message error">${esc(error.message)}</div>`;
    });
  }

  async function renderCurrentPage(page = state.currentPage) {
    const renderers = {
      dashboard: renderDashboard, usuarios: renderUsers, pessoal: renderPersonnel, patrimonio: renderAssets,
      viaturas: renderVehicles, documentos: renderDocuments, recompensas: renderRewards, perfil: renderProfile, configuracoes: renderSettings
    };
    if (renderers[page]) await renderers[page]();
  }

  /* Dashboard */
  async function renderDashboard() {
    $('[data-welcome-name]').textContent = (state.user.NOME || 'usuário').split(' ')[0];
    $('[data-today]').textContent = new Intl.DateTimeFormat('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' }).format(new Date());
    const payload = await loadPagePayload('dashboard');
    const data = payload.dashboard || { cards: [], alerts: [], recent: [] };
    state.alerts = data.alerts || [];
    const iconById = { pessoal: 'users', patrimonio: 'inventory', cautelas: 'hand', viaturas: 'car', turnos: 'play', documentos: 'file', recompensas: 'award' };
    $('#dashboard-cards').innerHTML = data.cards.length ? data.cards.map(card => `<button class="metric-card ${esc(card.tone)}" type="button" data-card-page="${card.id === 'cautelas' ? 'patrimonio' : card.id === 'turnos' ? 'viaturas' : esc(card.id)}"><span class="metric-icon">${icon(iconById[card.id] || 'grid')}</span><span class="metric-copy"><strong>${esc(card.value)}</strong><span>${esc(card.label)}</span></span></button>`).join('') : emptyState();
    $('#dashboard-alerts').innerHTML = data.alerts.length ? data.alerts.map((alert, index) => `<button class="alert-item ${alert.type === 'danger' ? 'danger' : ''}" type="button" data-dashboard-alert="${index}"><span class="alert-dot"></span><span>${esc(alert.title)}</span>${icon('chevronRight')}</button>`).join('') : `<div class="empty-state" style="min-height:180px"><span class="empty-icon">${icon('check')}</span><h3>Nenhuma pendência crítica</h3><p>Os principais controles estão em dia.</p></div>`;
    const shortcuts = state.modules.filter(module => !['dashboard', 'perfil', 'configuracoes'].includes(module.id)).slice(0, 6);
    $('#dashboard-shortcuts').innerHTML = shortcuts.map(module => `<button class="shortcut" type="button" data-page="${esc(module.id)}">${icon(module.icon)}<span>${esc(module.label)}</span></button>`).join('');
    $('#dashboard-recent').innerHTML = data.recent.length ? data.recent.map(item => `<div class="activity-row"><time>${formatDate(item.at)}</time><span>${esc(item.module)}</span><span><strong>${esc(statusLabel(item.action))}</strong><small>${esc(item.masp)}</small></span>${badge(item.result)}</div>`).join('') : emptyState('As atividades autorizadas aparecerão aqui.');
    updateNotificationBadge();

    $$('[data-dashboard-alert]', $('#main-content')).forEach(button => button.addEventListener('click', () => openNotificationTarget(Object.assign({ page: state.alerts[Number(button.dataset.dashboardAlert)]?.module || 'dashboard' }, state.alerts[Number(button.dataset.dashboardAlert)] || {}))));
  }

  function updateNotificationBadge() {
    const count = state.notifications.length;
    $('#notification-badge').textContent = count;
    $('#notification-badge').hidden = count === 0;
  }

  async function refreshNotifications() {
    if (!state.token) return [];
    const result = await api('notifications.list', { limit: 30 });
    state.notifications = result.items || [];
    updateNotificationBadge();
    return state.notifications;
  }

  function openNotificationTarget(target) {
    const page = target?.page || target?.module || 'dashboard';
    if (page === 'viaturas') {
      const frotaTarget = {
        tab: target.frotaTab || 'defeitos',
        occurrenceId: target.occurrenceId || '',
        maintenanceId: target.maintenanceId || '',
        movementId: target.movementId || '',
        recordId: target.recordId || ''
      };
      sessionStorage.setItem('intranet.frota.target', JSON.stringify(frotaTarget));
    }
    navigate(page);
  }

  async function openNotificationsModal() {
    try {
      await refreshNotifications();
      if (!state.notifications.length) return toast('Sem novas notificações', 'Nenhuma notificação pendente no momento.');
      const body = openModal({
        title: 'Notificações', eyebrow: 'Pendências e avisos', hideSubmit: true, wide: true,
        body: `<div class="timeline-list">${state.notifications.map(item => `<button class="alert-item ${String(item.severity || '').toUpperCase() === 'ALTA' ? 'danger' : ''}" type="button" data-open-notification="${esc(item.id)}"><span class="alert-dot"></span><span><strong>${esc(item.title)}</strong><small>${esc(item.message || '')} · ${formatDate(item.createdAt)}</small></span>${icon('chevronRight')}</button>`).join('')}</div>`
      });
      $$('[data-open-notification]', body).forEach(button => button.addEventListener('click', async () => {
        const id = button.dataset.openNotification;
        const selected = state.notifications.find(item => String(item.id) === String(id));
        button.disabled = true;
        try {
          const result = await api('notifications.read', { id });
          state.notifications = state.notifications.filter(item => String(item.id) !== String(id));
          updateNotificationBadge();
          closeModal();
          openNotificationTarget(result.target || selected?.target || { page: 'dashboard' });
        } catch (error) {
          button.disabled = false;
          toast('Não foi possível abrir a notificação', error.message, 'error');
        }
      }));
    } catch (error) {
      toast('Não foi possível carregar as notificações', error.message, 'error');
    }
  }

  /* Users */
  async function renderUsers() {
    $('#new-user-button').hidden = !has('usuarios.criar');
    $('#new-user-button').addEventListener('click', () => openUserModal());
    $('#users-export').addEventListener('click', exportUsers);
    const requestsButton=$('#profile-requests-button');
    requestsButton.hidden=!has('pessoal.editar');
    if(!requestsButton.hidden){requestsButton.addEventListener('click',openProfileRequestsModal);}
    $('#users-search').value=state.userFilters.query||'';$('#users-status').value=state.userFilters.status||'';
    const applySearch=()=>{state.userFilters={query:$('#users-search').value.trim(),status:$('#users-status').value};state.pages.users=1;loadUsers();};
    $('#users-search-button').addEventListener('click',applySearch);
    $('#users-search').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();applySearch();}});
    $('#users-search').addEventListener('search',()=>{if(!$('#users-search').value)applySearch();});
    $('#users-status').addEventListener('change',applySearch);

    const payload = await loadPagePayload('usuarios', {

  async function loadUsers(initialResult) {
    const region = $('#users-table'); if (!region) return;

    try {
      const result = initialResult || await api('users.list', { page: state.pages.users, pageSize: 20, query: state.userFilters.query, status: state.userFilters.status });

      const filters=$('#users-active-filters');if(filters){const applied=result.filters||[];filters.hidden=!applied.length;filters.innerHTML=applied.length?`<span>Filtros aplicados:</span>${applied.map(item=>`<span class="filter-chip">${esc(item)}</span>`).join('')}`:'';}
      region.innerHTML = result.items.length ? `<table class="data-table"><thead><tr><th>Usuário</th><th>MASP</th><th>Setor / função</th><th>Situação</th><th>Último acesso</th><th></th></tr></thead><tbody>${result.items.map(user => `<tr><td><strong>${esc(user.NOME)}</strong><small>${esc(user.EMAIL)}</small></td><td>${esc(user.MASP_FORMATADO)}</td><td>${esc(user.SETOR || '—')}<small>${esc(user.FUNCAO || user.CARGO || '')}</small></td><td>${badge(user.STATUS)}</td><td>${formatDate(user.ULTIMO_ACESSO)}</td><td><div class="table-actions"><button class="icon-btn" type="button" data-view-user="${esc(user.ID_USUARIO)}" title="Ver perfil completo">${icon('eye')}</button>${has('usuarios.editar') ? `<button class="icon-btn" type="button" data-edit-user="${esc(user.ID_USUARIO)}" title="Editar">${icon('edit')}</button>` : ''}${has('usuarios.gerenciar_permissoes') ? `<button class="icon-btn" type="button" data-permissions-user="${esc(user.ID_USUARIO)}" title="Permissões">${icon('shield')}</button>` : ''}${has('usuarios.redefinir_senha') ? `<button class="icon-btn" type="button" data-reset-user="${esc(user.ID_USUARIO)}" data-user-name="${esc(user.NOME)}" data-user-masp="${esc(user.MASP)}" title="Redefinir senha">${icon('key')}</button>` : ''}</div></td></tr>`).join('')}</tbody></table>` : emptyState();
      renderPagination($('#users-pagination'), result, page => { state.pages.users = page; loadUsers(); });
      $$('[data-view-user]', region).forEach(button => button.addEventListener('click', () => openUserProfile(button.dataset.viewUser)));
      $$('[data-edit-user]', region).forEach(button => button.addEventListener('click', () => openUserModal(button.dataset.editUser)));
      $$('[data-permissions-user]', region).forEach(button => button.addEventListener('click', () => openPermissionsModal(button.dataset.permissionsUser)));
      $$('[data-reset-user]', region).forEach(button => button.addEventListener('click', () => resetUserPassword(button.dataset.resetUser, button.dataset.userName, button.dataset.userMasp)));
    } catch (error) { if(sequence===state.userLoadSequence&&region.isConnected)region.innerHTML = `<div class="form-message error" style="margin:16px">${esc(error.message)}</div>`; }
  }

  function profileFieldLabel(key){
    const labels={NOME:'Nome da conta',NOME_COMPLETO:'Nome completo',NOME_SOCIAL:'Nome social',MASP:'MASP',MASP_FORMATADO:'MASP',MASP_ANTIGO:'MASP anterior',CPF:'CPF',RG:'RG',DATA_NASCIMENTO:'Data de nascimento',SEXO:'Sexo',TELEFONE:'Telefone',EMAIL:'E-mail',ENDERECO:'Endereço',BAIRRO:'Bairro',MUNICIPIO_ENDERECO:'Município',UF_ENDERECO:'UF',CEP:'CEP',NOME_PAI:'Nome do pai',NOME_MAE:'Nome da mãe',PAIS_NASCIMENTO:'País de nascimento',MUNICIPIO_NASCIMENTO:'Município de nascimento',UF_NASCIMENTO:'UF de nascimento',ESTADO_CIVIL:'Estado civil',RG_DATA_EMISSAO:'Emissão do RG',RG_ORGAO_EXPEDIDOR:'Órgão expedidor',RG_UF:'UF do RG',TITULO_ELEITOR:'Título de eleitor',CARGO:'Cargo',FUNCAO:'Função',SETOR:'Setor',EQUIPE:'Equipe',DATA_ADMISSAO:'Data de admissão',DATA_BAIXA:'Data de baixa',TIPO_VINCULO:'Tipo de vínculo',TIPO_SANGUINEO:'Tipo sanguíneo',PORTE_ARMA_NUMERO:'Número do porte de arma',ARMA_INSTITUCIONAL_NUMERO:'Arma institucional',PORTE_ARMA_VALIDADE:'Validade do porte',CPF_PENDENTE_CONFERENCIA:'CPF pendente de conferência',OBSERVACOES:'Observações',FOTO_URL:'Foto',STATUS:'Situação',ULTIMO_ACESSO:'Último acesso',CRIADO_EM:'Criado em',ATUALIZADO_EM:'Atualizado em',SENHA_ALTERADA_EM:'Senha alterada em',TROCAR_SENHA:'Troca de senha obrigatória',ID_PESSOA:'Vínculo com Pessoal',ID_USUARIO:'Conta vinculada'};
    return labels[key]||statusLabel(key);
  }

  function profileDisplayValue(key,value){
    if(value===true||value===false)return value?'Sim':'Não';
    if(!value)return '—';
    if(key==='MASP'||key==='MASP_FORMATADO'||key==='MASP_ANTIGO')return formatMasp(value);
    if((key.startsWith('DATA_')||/(?:_EM|ACESSO|VALIDADE)$/.test(key))&&!['ESTADO_CIVIL'].includes(key))return formatDate(value,key.startsWith('DATA_')||key.includes('VALIDADE'));
    return String(value);
  }

  function profileDetailsGrid(object,fields){
    return `<div class="detail-grid">${fields.filter(key=>key!=='MASP_FORMATADO'&&Object.prototype.hasOwnProperty.call(object||{},key)).map(key=>`<div class="detail-item"><span>${esc(profileFieldLabel(key))}</span><strong>${esc(profileDisplayValue(key,object[key]))}</strong></div>`).join('')}</div>`;
  }

  async function openProfileRequestsModal(){
    const body=openModal({title:'Alterações cadastrais',eyebrow:'Aprovação administrativa',wide:true,hideSubmit:true,body:`<div class="toolbar modal-toolbar"><label class="search-box"><i>${icon('search')}</i><input id="profile-requests-search" type="search" placeholder='Buscar "nome" "MASP" ou campo'></label><select id="profile-requests-status" class="select-control"><option value="PENDENTE">Pendentes</option><option value="">Todas</option><option value="APROVADA">Aprovadas</option><option value="RECUSADA">Recusadas</option></select><button id="profile-requests-refresh" class="icon-btn bordered" type="button">${icon('refresh')}</button></div><div id="profile-requests-table" class="table-region"></div><div id="profile-requests-pagination" class="pagination"></div>`});
    let page=1;
    const load=async()=>{const region=$('#profile-requests-table',body);if(!region)return;region.innerHTML=tableLoading();try{const result=await api('users.profileRequests',{page,pageSize:20,query:$('#profile-requests-search',body).value,status:$('#profile-requests-status',body).value});region.innerHTML=result.items.length?`<table class="data-table"><thead><tr><th>Solicitante</th><th>Data</th><th>Campos alterados</th><th>Situação</th><th></th></tr></thead><tbody>${result.items.map(item=>`<tr><td><strong>${esc(item.NOME)}</strong><small>${esc(formatMasp(item.MASP))}</small></td><td>${formatDate(item.SOLICITADO_EM)}</td><td>${esc((item.changedFields||[]).map(profileFieldLabel).join(', '))}</td><td>${badge(item.STATUS)}</td><td><div class="table-actions"><button class="icon-btn" type="button" data-review-profile-request="${esc(item.ID_SOLICITACAO)}">${icon('eye')}</button></div></td></tr>`).join('')}</tbody></table>`:emptyState('Nenhuma solicitação encontrada.');renderPagination($('#profile-requests-pagination',body),result,next=>{page=next;load();});$$('[data-review-profile-request]',region).forEach(button=>button.addEventListener('click',()=>openProfileRequestReview(result.items.find(item=>String(item.ID_SOLICITACAO)===button.dataset.reviewProfileRequest))));}catch(error){region.innerHTML=`<div class="form-message error" style="margin:16px">${esc(error.message)}</div>`;}};

  function openProfileRequestReview(request){

  function exportPersonProfileCsv(profile,selected){
    const p=profile.person||{},account=profile.account||{};
    const rows=[['SEÇÃO','CAMPO','VALOR']];
    selected.filter(field=>!field.startsWith('REL_')).forEach(key=>rows.push(['CADASTRO',profileFieldLabel(key),profileDisplayValue(key,p[key])]));
    if(selected.includes('REL_ACCOUNT')&&profile.account)Object.keys(account).filter(key=>!key.startsWith('_')).forEach(key=>rows.push(['CONTA DE ACESSO',profileFieldLabel(key),profileDisplayValue(key,account[key])]));
    if(selected.includes('REL_CUSTODIES'))(profile.custodies||[]).forEach(item=>rows.push(['CAUTELA',item.number||item.id||'',`${[item.patrimony,item.equipment].filter(Boolean).join(' — ')} | ${item.status||''} | ${formatDate(item.issuedDate)}`]));
    if(selected.includes('REL_FLEET'))(profile.shifts||[]).forEach(item=>rows.push(['FROTA',item.id||'',`${[item.prefix,item.plate].filter(Boolean).join(' — ')} | ${item.status||''} | ${formatDate(item.startedAt)} | ${item.distance||0} km`]));
    if(selected.includes('REL_DOCUMENTS'))(profile.documents||[]).forEach(item=>rows.push(['DOCUMENTO',item.TIPO||'',`${item.NOME||''} | ${item.STATUS||''} | ${formatDate(item.DATA_DOCUMENTO,true)}`]));
    if(selected.includes('REL_REWARDS'))(profile.rewards||[]).forEach(item=>rows.push(['RECOMPENSA',item.NUMERO||'',`${item.TITULO||''} | ${item.STATUS||''}`]));
    if(selected.includes('REL_HISTORY'))(profile.history||[]).forEach(item=>rows.push(['HISTÓRICO FUNCIONAL',item.TIPO||'',`${formatDate(item.DATA_HORA)} | ${item.OBSERVACOES||''}`]));
    if(selected.includes('REL_REQUESTS'))(profile.updateRequests||[]).forEach(item=>rows.push(['ALTERAÇÃO CADASTRAL',item.STATUS||'',`${formatDate(item.SOLICITADO_EM)} | ${(item.changedFields||[]).map(profileFieldLabel).join(', ')}`]));
    const csv='\ufeff'+rows.map(row=>row.map(value=>`"${String(value??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');
    link.href=url;link.download=`ficha_${String(p.MASP||p.NOME_COMPLETO||'pessoa').replace(/[^a-zA-Z0-9_-]+/g,'_')}.csv`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('Ficha exportada',p.NOME_SOCIAL||p.NOME_COMPLETO||'Pessoa');
  }

        <section class="person-profile-sheet"><div class="profile-view-section"><h3>Identificação e documentos civis</h3>${profileDetailsGrid(p,identity)}</div><div class="profile-view-section"><h3>Filiação e naturalidade</h3>${profileDetailsGrid(p,family)}</div><div class="profile-view-section"><h3>Contato e endereço</h3>${profileDetailsGrid(p,contact)}</div><div class="profile-view-section"><h3>Dados funcionais</h3>${profileDetailsGrid(p,functional)}</div><div class="profile-view-section person-weapon-section"><h3>Porte de arma e armamento institucional</h3>${profileDetailsGrid(p,institutional)}</div><div class="profile-view-section"><h3>Controle administrativo</h3>${profileDetailsGrid(p,administrative)}</div><div class="profile-view-section"><h3>Conta de acesso vinculada</h3>${account?profileDetailsGrid(account,accountFields):compactEmpty('Esta pessoa ainda não possui uma conta de acesso vinculada.')}</div></section>

        <div data-person-profile-panel="fleet" hidden>${shifts.length?shifts.map(item=>`<div class="person-profile-row"><span class="action-icon">${icon('car')}</span><span><strong>${esc([item.prefix,item.plate].filter(Boolean).join(' — ')||'Movimentação de viatura')}</strong><small>${formatDate(item.startedAt)}${item.endedAt?` até ${formatDate(item.endedAt)}`:' · em andamento'} · ${esc(item.distance||0)} km</small></span>${badge(item.status||'—')}</div>`).join(''):compactEmpty('Nenhuma movimentação de Frota encontrada ou sem permissão para visualizar.')}</div>

        <div data-person-profile-panel="history" hidden>${history.length?history.map(item=>`<div class="person-profile-row"><span class="action-icon">${icon('history')}</span><span><strong>${esc(statusLabel(item.TIPO||'ATUALIZACAO'))}</strong><small>${formatDate(item.DATA_HORA)}${item.OBSERVACOES?` · ${esc(item.OBSERVACOES)}`:''}</small></span></div>`).join(''):compactEmpty('Nenhum evento funcional registrado.')}</div>

  /* Assets */
  async function renderAssets() {
    if (!window.createPatrimonioModule) throw new Error('O módulo Patrimônio não foi carregado.');
    const module = window.createPatrimonioModule({
      api, esc, icon, badge, formatDate, formatMoney, formatMasp, openModal, closeModal, toast,
      showLoading, hideLoading, confirmAction, renderPagination, emptyState, tableLoading, has, app: state.bootstrap?.app || {}
    });
    await module.init();
  }

  async function loadAssets() {
    const region = $('#assets-table'); if (!region) return;
    region.innerHTML = tableLoading();
    const tab = state.tabs.assets;
    try {
      let result;
      if (tab === 'inventory') result = await api('assets.list', { page: state.pages.assets, pageSize: 20, query: $('#assets-search').value, status: $('#assets-status').value });
      else if (tab === 'open') result = await api('custody.open', { page: state.pages.assets, pageSize: 20, query: $('#assets-search').value });
      else result = await api('custody.history', { page: state.pages.assets, pageSize: 20, query: $('#assets-search').value, status: $('#assets-status').value });
      if (tab === 'inventory') {
        region.innerHTML = result.items.length ? `<table class="data-table"><thead><tr><th>Patrimônio</th><th>Categoria</th><th>Marca / modelo</th><th>Localização</th><th>Situação</th><th></th></tr></thead><tbody>${result.items.map(asset => `<tr><td><strong>${esc(asset.NUMERO_PATRIMONIAL)}</strong><small>${esc(asset.DESCRICAO)}</small></td><td>${esc(asset.CATEGORIA)}</td><td>${esc([asset.MARCA, asset.MODELO].filter(Boolean).join(' / ') || '—')}</td><td>${esc(asset.LOCALIZACAO_ATUAL || asset.SETOR_RESPONSAVEL || '—')}</td><td>${badge(asset.STATUS)}</td><td><div class="table-actions">${has('patrimonio.editar') ? `<button class="icon-btn" type="button" data-edit-asset="${esc(asset.ID_PATRIMONIO)}">${icon('edit')}</button>` : ''}</div></td></tr>`).join('')}</tbody></table>` : emptyState();
        $$('[data-edit-asset]', region).forEach(button => button.addEventListener('click', () => openAssetModal(button.dataset.editAsset)));
      } else {
        region.innerHTML = result.items.length ? `<table class="data-table"><thead><tr><th>Patrimônio</th><th>Responsável</th><th>Entrega</th><th>Previsão</th><th>Situação</th><th></th></tr></thead><tbody>${result.items.map(item => `<tr><td><strong>${esc(item.NUMERO_PATRIMONIAL)}</strong><small>${esc(item.DESCRICAO_PATRIMONIO)}</small></td><td>${esc(item.NOME_PESSOA)}<small>${esc(formatMasp(item.MASP))}</small></td><td>${formatDate(item.ENTREGUE_EM)}</td><td>${formatDate(item.PREVISAO_DEVOLUCAO, true)}</td><td>${badge(item.STATUS)}</td><td><div class="table-actions">${tab === 'open' && has('patrimonio.receber_devolucao') ? `<button class="btn btn-ghost btn-sm" type="button" data-return-custody="${esc(item.ID_CAUTELA)}">Receber</button>` : ''}</div></td></tr>`).join('')}</tbody></table>` : emptyState();
        $$('[data-return-custody]', region).forEach(button => button.addEventListener('click', () => openReturnCustodyModal(button.dataset.returnCustody)));
        if (tab === 'open') $('#open-custody-count').textContent = result.total;
      }
      renderPagination($('#assets-pagination'), result, page => { state.pages.assets = page; loadAssets(); });
    } catch (error) { region.innerHTML = `<div class="form-message error" style="margin:16px">${esc(error.message)}</div>`; }
  }

  async function openAssetModal(id = '') {
    showLoading('Preparando patrimônio…');
    try {
      const lookups = await ensureLookups();
      const detail = id ? await api('assets.get', { id }) : { asset: { STATUS: 'DISPONIVEL', ESTADO_CONSERVACAO: 'BOM' } };
      const a = detail.asset;
      openModal({ title: id ? 'Editar patrimônio' : 'Novo patrimônio', eyebrow: 'Controle patrimonial', wide: true,
        body: `<div class="form-grid"><input type="hidden" name="ID_PATRIMONIO" value="${esc(a.ID_PATRIMONIO || '')}"><label class="field"><span>Número patrimonial *</span><input name="NUMERO_PATRIMONIAL" value="${esc(a.NUMERO_PATRIMONIAL || '')}" required></label><label class="field"><span>Categoria *</span><select name="CATEGORIA">${selectOptions((lookups.assetCategories || []).map(c => ({value:c.NOME,label:c.NOME})), a.CATEGORIA, 'value','label','Selecione')}</select></label><label class="field span-2"><span>Descrição *</span><input name="DESCRICAO" value="${esc(a.DESCRICAO || '')}" required></label><label class="field"><span>Marca</span><input name="MARCA" value="${esc(a.MARCA || '')}"></label><label class="field"><span>Modelo</span><input name="MODELO" value="${esc(a.MODELO || '')}"></label><label class="field"><span>Número de série</span><input name="NUMERO_SERIE" value="${esc(a.NUMERO_SERIE || '')}"></label><label class="field"><span>Situação *</span><select name="STATUS">${selectOptions(['DISPONIVEL','CAUTELADO','EM_MANUTENCAO','DANIFICADO','EXTRAVIADO','BAIXADO','RESERVADO','INDISPONIVEL'], a.STATUS,'value','label','Selecione')}</select></label><label class="field"><span>Estado de conservação *</span><select name="ESTADO_CONSERVACAO">${selectOptions(['NOVO','OTIMO','BOM','REGULAR','RUIM','DANIFICADO'], a.ESTADO_CONSERVACAO,'value','label','Selecione')}</select></label><label class="field"><span>Unidade</span><input name="UNIDADE" value="${esc(a.UNIDADE || '')}"></label><label class="field"><span>Setor responsável</span><input name="SETOR_RESPONSAVEL" value="${esc(a.SETOR_RESPONSAVEL || '')}"></label><label class="field"><span>Localização atual</span><input name="LOCALIZACAO_ATUAL" value="${esc(a.LOCALIZACAO_ATUAL || '')}"></label><label class="field"><span>Data de aquisição</span><input name="DATA_AQUISICAO" type="date" value="${dateInput(a.DATA_AQUISICAO)}"></label><label class="field"><span>Valor</span><input name="VALOR" type="number" step="0.01" min="0" value="${esc(a.VALOR || '')}"></label><label class="field"><span>Fornecedor</span><input name="FORNECEDOR" value="${esc(a.FORNECEDOR || '')}"></label><label class="field"><span>Nota fiscal</span><input name="NOTA_FISCAL" value="${esc(a.NOTA_FISCAL || '')}"></label><label class="field"><span>Garantia até</span><input name="GARANTIA_ATE" type="date" value="${dateInput(a.GARANTIA_ATE)}"></label><label class="field span-2"><span>Observações</span><textarea name="OBSERVACOES">${esc(a.OBSERVACOES || '')}</textarea></label></div>`,
        submitText: id ? 'Salvar alterações' : 'Cadastrar patrimônio', onSubmit: async payload => { await api('assets.save', payload); toast(id ? 'Patrimônio atualizado' : 'Patrimônio cadastrado', payload.NUMERO_PATRIMONIAL); closeModal(); state.lookups = null; await loadAssets(); }
      });
    } catch (error) { toast('Erro ao abrir cadastro', error.message, 'error'); } finally { hideLoading(); }
  }

  async function openCustodyModal() {
    showLoading('Carregando opções…');
    try {
      const lookups = await ensureLookups(true);
      const assets = (lookups.assets || []).filter(a => a.status === 'DISPONIVEL').map(a => ({ value: a.id, label: `${a.number} — ${a.description}` }));
      const people = (lookups.people || []).map(p => ({ value: p.id, label: `${p.name}${p.masp ? ' — ' + p.masp : ''}` }));
      openModal({ title: 'Nova cautela', eyebrow: 'Entrega de patrimônio', wide: true,
        body: `<div class="form-grid"><label class="field span-2"><span>Patrimônio disponível *</span><select name="ID_PATRIMONIO" required>${selectOptions(assets,'','value','label','Selecione o item')}</select></label><label class="field span-2"><span>Pessoa responsável *</span><select name="ID_PESSOA" required>${selectOptions(people,'','value','label','Selecione a pessoa')}</select></label><label class="field"><span>Previsão de devolução</span><input name="PREVISAO_DEVOLUCAO" type="date"></label><label class="field"><span>Estado na entrega *</span><select name="ESTADO_ENTREGA">${selectOptions(['NOVO','OTIMO','BOM','REGULAR'], 'BOM','value','label','Selecione')}</select></label><label class="field span-2"><span>Acessórios entregues</span><input name="ACESSORIOS_ENTREGUES" placeholder="Carregador, estojo, chave…"></label><label class="field span-2"><span>Finalidade *</span><input name="FINALIDADE" required></label><label class="field span-2"><span>Observações</span><textarea name="OBSERVACOES"></textarea></label><label class="field-checkbox span-2"><input type="checkbox" name="CONFIRMACAO" value="CONFIRMADO" required><span>Confirmo que os dados da entrega e o estado do item foram conferidos.</span></label></div>`, submitText: 'Registrar cautela',
        onSubmit: async payload => { await api('custody.issue', payload); toast('Cautela registrada', 'O patrimônio foi vinculado ao responsável.'); closeModal(); state.lookups = null; state.tabs.assets = 'open'; await loadAssets(); }
      });
    } catch (error) { toast('Não foi possível preparar a cautela', error.message, 'error'); } finally { hideLoading(); }
  }

  function openReturnCustodyModal(id) {
    openModal({ title: 'Receber patrimônio', eyebrow: 'Devolução de cautela',
      body: `<div class="form-grid"><input type="hidden" name="ID_CAUTELA" value="${esc(id)}"><label class="field"><span>Estado no recebimento *</span><select name="ESTADO_RECEBIMENTO">${selectOptions(['OTIMO','BOM','REGULAR','RUIM','DANIFICADO'],'BOM','value','label','Selecione')}</select></label><label class="field"><span>Situação após receber *</span><select name="STATUS_PATRIMONIO">${selectOptions(['DISPONIVEL','EM_MANUTENCAO','DANIFICADO','INDISPONIVEL'],'DISPONIVEL','value','label','Selecione')}</select></label><label class="field span-2"><span>Acessórios devolvidos</span><input name="ACESSORIOS_DEVOLVIDOS"></label><label class="field-checkbox span-2"><input type="checkbox" name="POSSUI_AVARIA"><span>Foi identificada avaria ou dano.</span></label><label class="field span-2"><span>Descrição do dano</span><textarea name="DESCRICAO_DANO"></textarea></label><label class="field span-2"><span>Providências adotadas</span><textarea name="PROVIDENCIAS"></textarea></label><label class="field span-2"><span>Observações</span><textarea name="OBSERVACOES"></textarea></label></div>`, submitText: 'Confirmar recebimento',
      onSubmit: async payload => { await api('custody.return', payload); toast('Devolução registrada', 'O patrimônio teve a situação atualizada.'); closeModal(); state.lookups = null; await loadAssets(); }
    });
  }

  /* Vehicles */
  async function renderVehicles() {
    if (window.FrotaModule && typeof window.FrotaModule.init === 'function') {
      return window.FrotaModule.init({ api, has, toast, icon, esc, formatDate, badge, debounce, app: state.bootstrap?.app || {} });
    }
    $('#new-vehicle-button').hidden = !has('viaturas.cadastrar');
    $('#start-shift-button').hidden = !has('viaturas.iniciar_turno');
    $('#new-vehicle-button').addEventListener('click', () => openVehicleModal());
    $('#start-shift-button').addEventListener('click', openStartShiftModal);
    $$('[data-vehicles-tab]').forEach(button => {
      button.classList.toggle('active', button.dataset.vehiclesTab === state.tabs.vehicles);
      button.addEventListener('click', () => { state.tabs.vehicles = button.dataset.vehiclesTab; $$('[data-vehicles-tab]').forEach(tab => tab.classList.toggle('active', tab === button)); state.pages.vehicles = 1; updateVehicleContextActions(); loadVehicles(); });
    });
    $('#vehicles-search').addEventListener('input', debounce(() => { state.pages.vehicles = 1; loadVehicles(); }));
    $('#vehicles-status').addEventListener('change', () => { state.pages.vehicles = 1; loadVehicles(); });
    $('#vehicles-refresh').addEventListener('click', loadVehicles);
    updateVehicleContextActions(); await loadVehicles();
  }

  function updateVehicleContextActions() {
    const target = $('#vehicles-context-actions'); if (!target) return;
    const tab = state.tabs.vehicles;
    target.innerHTML = tab === 'maintenance' && has('viaturas.registrar_manutencao') ? `<button class="btn btn-ghost btn-sm" type="button" data-new-maintenance>${icon('plus')} Manutenção</button>` : tab === 'fuel' && has('viaturas.registrar_abastecimento') ? `<button class="btn btn-ghost btn-sm" type="button" data-new-fueling>${icon('plus')} Abastecimento</button>` : '';
    $('[data-new-maintenance]', target)?.addEventListener('click', openMaintenanceModal);
    $('[data-new-fueling]', target)?.addEventListener('click', openFuelingModal);
  }

  async function loadVehicles() {
    const region = $('#vehicles-table'); if (!region) return;
    region.innerHTML = tableLoading(); const tab = state.tabs.vehicles;
    try {
      let result;
      if (tab === 'fleet') result = await api('vehicles.list', { page: state.pages.vehicles, pageSize: 20, query: $('#vehicles-search').value, status: $('#vehicles-status').value });
      else if (tab === 'open') result = await api('shifts.open', { page: state.pages.vehicles, pageSize: 20, query: $('#vehicles-search').value });
      else if (tab === 'history') result = await api('shifts.history', { page: state.pages.vehicles, pageSize: 20, query: $('#vehicles-search').value });
      else if (tab === 'maintenance') result = await api('fleet.maintenanceList', { page: state.pages.vehicles, pageSize: 20, query: $('#vehicles-search').value });
      else if (tab === 'fuel') result = await api('fleet.fuelList', { page: state.pages.vehicles, pageSize: 20, query: $('#vehicles-search').value });
      else { const alerts = await api('fleet.alerts'); result = { items: alerts, page: 1, pageSize: alerts.length || 20, total: alerts.length, pages: 1 }; }
      if (tab === 'fleet') region.innerHTML = result.items.length ? `<table class="data-table"><thead><tr><th>Viatura</th><th>Placa</th><th>Modelo</th><th>KM atual</th><th>Setor</th><th>Situação</th><th></th></tr></thead><tbody>${result.items.map(v => `<tr><td><strong>${esc(v.PREFIXO)}</strong><small>${esc(v.TIPO)}</small></td><td>${esc(v.PLACA)}</td><td>${esc(`${v.MARCA || ''} ${v.MODELO || ''}`.trim() || '—')}</td><td>${Number(v.KM_ATUAL || 0).toLocaleString('pt-BR')} km</td><td>${esc(v.SETOR || '—')}</td><td>${badge(v.STATUS)}</td><td><div class="table-actions">${has('viaturas.editar') ? `<button class="icon-btn" type="button" data-edit-vehicle="${esc(v.ID_VIATURA)}">${icon('edit')}</button>` : ''}</div></td></tr>`).join('')}</tbody></table>` : emptyState();
      else if (tab === 'open' || tab === 'history') region.innerHTML = result.items.length ? `<table class="data-table"><thead><tr><th>Viatura</th><th>Responsável</th><th>Início</th><th>KM</th><th>Equipe</th><th>Situação</th><th></th></tr></thead><tbody>${result.items.map(s => `<tr><td><strong>${esc(s.PREFIXO)}</strong><small>${esc(s.PLACA)}</small></td><td>${esc(s.NOME_RESPONSAVEL)}<small>${esc(formatMasp(s.MASP_RESPONSAVEL))}</small></td><td>${formatDate(s.INICIO_EM)}</td><td>${esc(s.KM_INICIAL)}${s.KM_FINAL !== '' ? ` → ${esc(s.KM_FINAL)}` : ''}</td><td>${esc(s.EQUIPE || s.SETOR || '—')}</td><td>${badge(s.STATUS)}</td><td><div class="table-actions">${tab === 'open' && has('viaturas.encerrar_turno') ? `<button class="btn btn-ghost btn-sm" type="button" data-end-shift="${esc(s.ID_TURNO)}" data-initial-km="${esc(s.KM_INICIAL)}">Encerrar</button>` : ''}</div></td></tr>`).join('')}</tbody></table>` : emptyState();
      else if (tab === 'maintenance') region.innerHTML = result.items.length ? `<table class="data-table"><thead><tr><th>Viatura</th><th>Tipo / serviço</th><th>Entrada</th><th>Oficina</th><th>Valor</th><th>Situação</th></tr></thead><tbody>${result.items.map(m => `<tr><td><strong>${esc(m.PREFIXO)}</strong><small>${Number(m.KM || 0).toLocaleString('pt-BR')} km</small></td><td>${esc(m.TIPO)}<small>${esc(m.DESCRICAO)}</small></td><td>${formatDate(m.DATA_ENTRADA,true)}</td><td>${esc(m.OFICINA || m.FORNECEDOR || '—')}</td><td>${formatMoney(m.VALOR)}</td><td>${badge(m.STATUS)}</td></tr>`).join('')}</tbody></table>` : emptyState();
      else if (tab === 'fuel') region.innerHTML = result.items.length ? `<table class="data-table"><thead><tr><th>Viatura</th><th>Condutor</th><th>Data</th><th>KM</th><th>Quantidade</th><th>Valor</th><th>Média</th></tr></thead><tbody>${result.items.map(f => `<tr><td><strong>${esc(f.PREFIXO)}</strong></td><td>${esc(f.CONDUTOR)}</td><td>${formatDate(f.DATA_HORA)}</td><td>${Number(f.KM || 0).toLocaleString('pt-BR')}</td><td>${Number(f.QUANTIDADE || 0).toLocaleString('pt-BR')} L</td><td>${formatMoney(f.VALOR_TOTAL)}</td><td>${f.MEDIA_CONSUMO ? Number(f.MEDIA_CONSUMO).toFixed(2) + ' km/L' : '—'}</td></tr>`).join('')}</tbody></table>` : emptyState();
      else region.innerHTML = result.items.length ? `<div style="padding:10px 18px">${result.items.map(a => `<div class="alert-item ${a.severity === 'danger' ? 'danger' : ''}"><span class="alert-dot"></span><span><strong>${esc(a.prefix)}</strong> — ${esc(a.message)}</span>${badge(a.severity)}</div>`).join('')}</div>` : emptyState('Nenhum alerta de frota no momento.');
      renderPagination($('#vehicles-pagination'), result, page => { state.pages.vehicles = page; loadVehicles(); });
      $$('[data-edit-vehicle]', region).forEach(button => button.addEventListener('click', () => openVehicleModal(button.dataset.editVehicle)));
      $$('[data-end-shift]', region).forEach(button => button.addEventListener('click', () => openEndShiftModal(button.dataset.endShift, button.dataset.initialKm)));
      if (tab === 'open') $('#open-shift-count').textContent = result.total;
    } catch (error) { region.innerHTML = `<div class="form-message error" style="margin:16px">${esc(error.message)}</div>`; }
  }

  async function openVehicleModal(id = '') {
    showLoading('Preparando viatura…');
    try {
      const detail = id ? await api('vehicles.get', { id }) : { vehicle: { STATUS: 'DISPONIVEL', COMBUSTIVEL: 'FLEX', KM_ATUAL: 0 } }; const v = detail.vehicle;
      openModal({ title: id ? 'Editar viatura' : 'Nova viatura', eyebrow: 'Gestão da frota', wide: true,
        body: `<div class="form-grid"><input type="hidden" name="ID_VIATURA" value="${esc(v.ID_VIATURA || '')}"><label class="field"><span>Prefixo *</span><input name="PREFIXO" value="${esc(v.PREFIXO || '')}" required></label><label class="field"><span>Placa *</span><input name="PLACA" value="${esc(v.PLACA || '')}" maxlength="8" required></label><label class="field"><span>Tipo *</span><select name="TIPO">${selectOptions(['AUTOMOVEL','MOTOCICLETA','CAMINHONETE','VAN','MICRO-ONIBUS','OUTRO'],v.TIPO,'value','label','Selecione')}</select></label><label class="field"><span>Situação *</span><select name="STATUS">${selectOptions(['DISPONIVEL','EM_SERVICO','MANUTENCAO','INDISPONIVEL','RESERVADA','BAIXADA','SINISTRADA'],v.STATUS,'value','label','Selecione')}</select></label><label class="field"><span>Marca *</span><input name="MARCA" value="${esc(v.MARCA || '')}" required></label><label class="field"><span>Modelo *</span><input name="MODELO" value="${esc(v.MODELO || '')}" required></label><label class="field"><span>Ano fabricação</span><input name="ANO_FABRICACAO" type="number" value="${esc(v.ANO_FABRICACAO || '')}"></label><label class="field"><span>Ano modelo</span><input name="ANO_MODELO" type="number" value="${esc(v.ANO_MODELO || '')}"></label><label class="field"><span>Cor</span><input name="COR" value="${esc(v.COR || '')}"></label><label class="field"><span>Combustível</span><select name="COMBUSTIVEL">${selectOptions(['FLEX','GASOLINA','ETANOL','DIESEL','ELETRICO','HIBRIDO'],v.COMBUSTIVEL,'value','label','Selecione')}</select></label><label class="field"><span>Renavam</span><input name="RENAVAM" value="${esc(v.RENAVAM || '')}"></label><label class="field"><span>Chassi</span><input name="CHASSI" value="${esc(v.CHASSI || '')}"></label><label class="field"><span>KM atual *</span><input name="KM_ATUAL" type="number" min="0" value="${esc(v.KM_ATUAL || 0)}" required></label><label class="field"><span>Setor</span><input name="SETOR" value="${esc(v.SETOR || '')}"></label><label class="field"><span>Próxima revisão (KM)</span><input name="PROXIMA_REVISAO_KM" type="number" min="0" value="${esc(v.PROXIMA_REVISAO_KM || '')}"></label><label class="field"><span>Próxima revisão (data)</span><input name="PROXIMA_REVISAO_DATA" type="date" value="${dateInput(v.PROXIMA_REVISAO_DATA)}"></label><label class="field"><span>Vencimento do seguro</span><input name="SEGURO_VENCIMENTO" type="date" value="${dateInput(v.SEGURO_VENCIMENTO)}"></label><label class="field"><span>Vencimento licenciamento</span><input name="LICENCIAMENTO_VENCIMENTO" type="date" value="${dateInput(v.LICENCIAMENTO_VENCIMENTO)}"></label><label class="field span-2"><span>Observações</span><textarea name="OBSERVACOES">${esc(v.OBSERVACOES || '')}</textarea></label></div>`, submitText: id ? 'Salvar alterações' : 'Cadastrar viatura',
        onSubmit: async payload => { await api('vehicles.save', payload); toast(id ? 'Viatura atualizada' : 'Viatura cadastrada', payload.PREFIXO); closeModal(); state.lookups = null; await loadVehicles(); }
      });
    } catch (error) { toast('Erro ao abrir cadastro', error.message, 'error'); } finally { hideLoading(); }
  }

  async function openStartShiftModal() {
    showLoading('Carregando viaturas…');
    try {
      const lookups = await ensureLookups(true);
      const vehicles = (lookups.vehicles || []).filter(v => ['DISPONIVEL','RESERVADA'].includes(v.status)).map(v => ({ value: v.id, label: `${v.prefix} — ${v.plate} — ${v.model} (${Number(v.km).toLocaleString('pt-BR')} km)`, km: v.km }));
      const people = (lookups.people || []).map(p => ({ value: p.id, label: `${p.name}${p.masp ? ' — ' + p.masp : ''}` }));
      const body = openModal({ title: 'Iniciar turno', eyebrow: 'Uso de viatura', wide: true,
        body: `<div class="form-grid"><label class="field span-2"><span>Viatura *</span><select id="shift-vehicle" name="ID_VIATURA" required>${selectOptions(vehicles,'','value','label','Selecione a viatura')}</select></label><label class="field"><span>KM inicial *</span><input id="shift-km" name="KM_INICIAL" type="number" min="0" required></label><label class="field"><span>Combustível inicial *</span><select name="NIVEL_COMBUSTIVEL">${selectOptions(['RESERVA','1/4','1/2','3/4','CHEIO'],'','value','label','Selecione')}</select></label><label class="field"><span>Setor</span><input name="SETOR" value="${esc(state.user.SETOR || '')}"></label><label class="field"><span>Equipe</span><input name="EQUIPE"></label><label class="field span-2"><span>Demais integrantes</span><select name="INTEGRANTES_IDS" multiple size="5">${people.map(p => `<option value="${esc(p.value)}">${esc(p.label)}</option>`).join('')}</select><small>Use Ctrl (Windows) ou toque prolongado para selecionar mais de um.</small></label><label class="field span-2"><span>Condições gerais *</span><textarea name="CONDICOES_GERAIS" required placeholder="Pneus, luzes, limpeza, documentação…"></textarea></label><label class="field span-2"><span>Avarias já existentes</span><textarea name="AVARIAS_EXISTENTES"></textarea></label><label class="field span-2"><span>Equipamentos existentes</span><textarea name="EQUIPAMENTOS"></textarea></label><label class="field span-2"><span>Justificativa de divergência do KM</span><input name="JUSTIFICATIVA_KM" placeholder="Obrigatória se o KM for diferente do cadastro"></label><label class="field span-2"><span>Observações</span><textarea name="OBSERVACOES"></textarea></label></div>`, submitText: 'Iniciar turno',
        onSubmit: async payload => { await api('shifts.start', payload); toast('Turno iniciado', 'A viatura agora está em serviço.'); closeModal(); state.lookups = null; state.tabs.vehicles = 'open'; await loadVehicles(); }
      });
      $('#shift-vehicle', body).addEventListener('change', event => { const vehicle = vehicles.find(v => v.value === event.target.value); $('#shift-km', body).value = vehicle ? vehicle.km : ''; });
    } catch (error) { toast('Não foi possível iniciar o turno', error.message, 'error'); } finally { hideLoading(); }
  }

  function openEndShiftModal(id, initialKm) {
    openModal({ title: 'Encerrar turno', eyebrow: 'Retorno da viatura', wide: true,
      body: `<div class="form-grid"><input type="hidden" name="ID_TURNO" value="${esc(id)}"><label class="field"><span>KM inicial</span><input value="${esc(initialKm)}" disabled></label><label class="field"><span>KM final *</span><input name="KM_FINAL" type="number" min="${esc(initialKm)}" required></label><label class="field"><span>Combustível final *</span><select name="COMBUSTIVEL_FINAL">${selectOptions(['RESERVA','1/4','1/2','3/4','CHEIO'],'','value','label','Selecione')}</select></label><label class="field"><span>Situação da viatura *</span><select name="STATUS_VIATURA">${selectOptions(['DISPONIVEL','MANUTENCAO','INDISPONIVEL'],'DISPONIVEL','value','label','Selecione')}</select></label><label class="field span-2"><span>Ocorrências relacionadas</span><textarea name="OCORRENCIAS"></textarea></label><label class="field span-2"><span>Avarias identificadas</span><textarea name="AVARIAS"></textarea></label><label class="field span-2"><span>Falhas mecânicas</span><textarea name="FALHAS_MECANICAS"></textarea></label><label class="field"><span>Limpeza</span><select name="LIMPEZA">${selectOptions(['LIMPA','NECESSITA_LIMPEZA','HIGIENIZADA'],'LIMPA','value','label','Selecione')}</select></label><label class="field-checkbox"><input type="checkbox" name="NECESSITA_MANUTENCAO"><span>Encaminhar para manutenção</span></label><label class="field span-2"><span>Equipamentos ausentes</span><input name="EQUIPAMENTOS_AUSENTES"></label><label class="field span-2"><span>Observações finais</span><textarea name="OBSERVACOES"></textarea></label></div>`, submitText: 'Encerrar turno',
      onSubmit: async payload => { await api('shifts.end', payload); toast('Turno encerrado', 'Quilometragem e situação foram atualizadas.'); closeModal(); state.lookups = null; await loadVehicles(); }
    });
  }

  async function vehicleOptions() {
    const lookups = await ensureLookups(true);
    return (lookups.vehicles || []).map(v => ({ value: v.id, label: `${v.prefix} — ${v.plate}`, km: v.km }));
  }

  async function openMaintenanceModal() {

      body: `<div class="form-grid"><label class="field"><span>Viatura *</span><select name="ID_VIATURA">${selectOptions(vehicles,'','value','label','Selecione')}</select></label><label class="field"><span>Tipo *</span><select name="TIPO">${selectOptions(['PREVENTIVA','CORRETIVA','REVISAO','TROCA_DE_OLEO','PNEUS','FREIOS','ELETRICA','FUNILARIA','SINISTRO','RECALL'],'','value','label','Selecione')}</select></label><label class="field"><span>Data de entrada *</span><input name="DATA_ENTRADA" type="date" value="${dateInput(new Date())}" required></label><label class="field"><span>KM *</span><input name="KM" type="number" min="0" required></label><label class="field"><span>Oficina</span><input name="OFICINA"></label><label class="field"><span>Fornecedor</span><input name="FORNECEDOR"></label><label class="field span-2"><span>Descrição do serviço *</span><textarea name="DESCRICAO" required></textarea></label><label class="field span-2"><span>Peças</span><textarea name="PECAS"></textarea></label><label class="field"><span>Valor</span><input name="VALOR" type="number" min="0" step="0.01"></label><label class="field"><span>Situação *</span><select name="STATUS">${selectOptions(['ABERTA','EM_ANDAMENTO','CONCLUIDA','CANCELADA'],'ABERTA','value','label','Selecione')}</select></label><label class="field"><span>Previsão de conclusão</span><input name="PREVISAO_CONCLUSAO" type="date"></label><label class="field"><span>Data de conclusão</span><input name="DATA_CONCLUSAO" type="date"></label><label class="field span-2"><span>Observações</span><textarea name="OBSERVACOES"></textarea></label></div>`, submitText: 'Registrar manutenção', onSubmit: async payload => { await api('fleet.maintenanceSave', payload); toast('Manutenção registrada'); closeModal(); state.lookups = null; await loadVehicles(); }}); }
    catch (error) { toast('Erro ao preparar manutenção', error.message, 'error'); } finally { hideLoading(); }
  }

  async function openFuelingModal() {
    showLoading('Preparando abastecimento…');
    try { const vehicles = await vehicleOptions(); openModal({ title: 'Registrar abastecimento', eyebrow: 'Gestão da frota',
      body: `<div class="form-grid"><label class="field span-2"><span>Viatura *</span><select name="ID_VIATURA">${selectOptions(vehicles,'','value','label','Selecione')}</select></label><label class="field"><span>Data e hora *</span><input name="DATA_HORA" type="datetime-local" value="${dateTimeInput(new Date())}" required></label><label class="field"><span>KM *</span><input name="KM" type="number" min="0" required></label><label class="field"><span>Combustível *</span><select name="COMBUSTIVEL">${selectOptions(['GASOLINA','ETANOL','DIESEL'],'','value','label','Selecione')}</select></label><label class="field"><span>Quantidade (litros) *</span><input name="QUANTIDADE" type="number" min="0.01" step="0.001" required></label><label class="field"><span>Valor total *</span><input name="VALOR_TOTAL" type="number" min="0" step="0.01" required></label><label class="field"><span>Posto *</span><input name="POSTO" required></label><label class="field span-2"><span>Observações</span><textarea name="OBSERVACOES"></textarea></label></div>`, submitText: 'Registrar abastecimento', onSubmit: async payload => { await api('fleet.fuelSave', payload); toast('Abastecimento registrado'); closeModal(); state.lookups = null; await loadVehicles(); }}); }

  /* Documents */
  async function renderDocuments() {
    $('#new-document-button').hidden = !has('documentos.criar');
    $('#new-document-button').addEventListener('click', () => openDocumentModal());
    $('#documents-search').addEventListener('input', debounce(() => { state.pages.documents = 1; loadDocuments(); }));
    $('#documents-level').addEventListener('change', () => { state.pages.documents = 1; loadDocuments(); });
    $('#documents-refresh').addEventListener('click', loadDocuments);
    await loadDocuments();
  }

  async function loadDocuments() {
    const region = $('#documents-table'); if (!region) return; region.innerHTML = tableLoading();
    try {
      const result = await api('documents.list', { page: state.pages.documents, pageSize: 20, query: $('#documents-search').value, level: $('#documents-level').value });
      const active = result.items.filter(d => d.SITUACAO === 'ATIVO').length;
      const restricted = result.items.filter(d => d.NIVEL_ACESSO !== 'PUBLICO_INTERNO').length;
      const expiring = result.items.filter(d => d.VENCIMENTO && new Date(d.VENCIMENTO).getTime() < Date.now() + 30 * 86400000).length;
      $('#document-summary').innerHTML = `<div class="mini-metric"><strong>${result.total}</strong><span>Documentos encontrados</span></div><div class="mini-metric"><strong>${active}</strong><span>Ativos nesta página</span></div><div class="mini-metric"><strong>${restricted}</strong><span>Com acesso restrito</span></div><div class="mini-metric"><strong>${expiring}</strong><span>Próximos do vencimento</span></div>`;
      region.innerHTML = result.items.length ? `<table class="data-table"><thead><tr><th>Documento</th><th>Tipo</th><th>Data</th><th>Setor</th><th>Acesso</th><th>Situação</th><th></th></tr></thead><tbody>${result.items.map(d => `<tr><td><strong>${esc(d.NUMERO || 'Sem número')} — ${esc(d.ASSUNTO)}</strong><small>${esc(d.DESCRICAO || '')}</small></td><td>${esc(d.TIPO)}</td><td>${formatDate(d.DATA_DOCUMENTO,true)}</td><td>${esc(d.SETOR || '—')}</td><td>${badge(d.NIVEL_ACESSO)}</td><td>${badge(d.SITUACAO)}</td><td><div class="table-actions"><button class="icon-btn" type="button" data-view-document="${esc(d.ID_DOCUMENTO)}">${icon('file')}</button>${has('documentos.editar') ? `<button class="icon-btn" type="button" data-edit-document="${esc(d.ID_DOCUMENTO)}">${icon('edit')}</button>` : ''}</div></td></tr>`).join('')}</tbody></table>` : emptyState();
      renderPagination($('#documents-pagination'), result, page => { state.pages.documents = page; loadDocuments(); });
      $$('[data-view-document]', region).forEach(button => button.addEventListener('click', () => viewDocument(button.dataset.viewDocument)));
      $$('[data-edit-document]', region).forEach(button => button.addEventListener('click', () => openDocumentModal(button.dataset.editDocument)));
    } catch (error) { region.innerHTML = `<div class="form-message error" style="margin:16px">${esc(error.message)}</div>`; }
  }

  async function openDocumentModal(id = '') {
    showLoading('Preparando documento…');
    try {
      const lookups = await ensureLookups();
      const details = id ? await api('documents.get', { id }) : { document: { NIVEL_ACESSO: 'PUBLICO_INTERNO', SITUACAO: 'ATIVO', DATA_DOCUMENTO: new Date() } }; const d = details.document;
      openModal({ title: id ? 'Editar documento' : 'Novo documento', eyebrow: 'Gestão documental', wide: true,

${v.prefix} — ${v.plate}`})),d.ID_VIATURA,'value','label','Nenhuma')}</select></label><label class="field"><span>Patrimônio relacionado</span><select name="ID_PATRIMONIO">${selectOptions((lookups.assets || []).map(a=>({value:a.id,label:`${a.number} — ${a.description}`})),d.ID_PATRIMONIO,'value','label','Nenhum')}</select></label><label class="field"><span>Vencimento</span><input name="VENCIMENTO" type="date" value="${dateInput(d.VENCIMENTO)}"></label>${!id ? '<label class="field span-2"><span>Arquivo principal (até 5 MB)</span><input id="document-file" type="file"><small>O arquivo será enviado para a pasta institucional após salvar o registro.</small></label>' : ''}<label class="field span-2"><span>Observações</span><textarea name="OBSERVACOES">${esc(d.OBSERVACOES || '')}</textarea></label></div>`, submitText: id ? 'Salvar alterações' : 'Criar documento',
