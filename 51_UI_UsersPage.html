<template id="page-usuarios">
  <section class="page">
    <div class="page-actions">
      <div><p class="page-description">Contas, perfis completos, vínculos e permissões individuais de acesso.</p></div>
      <div class="button-group">
        <button id="profile-requests-button" class="btn btn-secondary" type="button" hidden><i data-icon="inbox"></i> Alterações pendentes <span id="profile-requests-count" class="tab-count">0</span></button>
        <button id="users-export" class="btn btn-secondary" type="button"><i data-icon="upload"></i> Exportar</button>
        <button id="new-user-button" class="btn btn-primary" type="button"><i data-icon="plus"></i> Novo usuário</button>
      </div>
    </div>
    <article class="panel data-panel">
      <div class="toolbar users-toolbar">
        <label class="search-box"><i data-icon="search"></i><input id="users-search" type="search" placeholder='Ex.: "Operacional" "ATIVO" "Almeida"'></label>
        <button id="users-search-button" class="btn btn-secondary btn-sm" type="button"><i data-icon="search"></i> Pesquisar</button>
        <select id="users-status" class="select-control" aria-label="Filtrar por situação"><option value="">Todas as situações</option><option>ATIVO</option><option>INATIVO</option><option>AFASTADO</option><option>BLOQUEADO</option></select>
        <button id="users-refresh" class="icon-btn bordered" type="button" aria-label="Atualizar"><i data-icon="refresh"></i></button>
        <p class="toolbar-help">Use vários termos ou frases entre aspas. Todos os filtros informados precisam corresponder ao usuário.</p>
        <div id="users-active-filters" class="active-filter-list" hidden></div>
      </div>
      <div id="users-table" class="table-region"></div>
      <div id="users-pagination" class="pagination"></div>
    </article>
  </section>
</template>
