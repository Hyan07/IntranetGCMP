<template id="frota-view-defeitos">
  <section class="frota-view" data-frota-view="defeitos">
    <div class="frota-view-heading"><div><span class="frota-kicker">Da ocorrência à oficina</span><h3>Defeitos, Observações e Manutenções</h3><p>Abra o atendimento de oficina a partir da ocorrência e acompanhe os dois status no mesmo fluxo.</p></div><button class="btn btn-primary" type="button" data-new-defect>+ Registrar ocorrência</button></div>
    <div class="frota-toolbar">
      <label class="frota-search"><span>⌕</span><input type="search" data-defect-search placeholder="Descrição, categoria, local, condutor ou viatura"></label>
      <select data-defect-vehicle><option value="">Todas as viaturas</option></select>
      <select data-defect-status><option value="">Todos os status</option><option>REGISTRADA</option><option>PENDENTE</option><option>EM_ANALISE</option><option>EM_REPARO</option><option>RESOLVIDO</option><option>CANCELADO</option></select>
      <select data-defect-gravity><option value="">Todas as gravidades</option><option>BAIXA</option><option>MEDIA</option><option>ALTA</option><option>VIATURA_SEM_CONDICOES_DE_USO</option></select>
      <button class="frota-icon-button" type="button" data-defect-refresh>↻</button>
    </div>
    <div id="frota-defect-list" class="frota-table-wrap"></div>
    <div id="frota-defect-pagination" class="frota-pagination"></div>
  </section>
</template>
