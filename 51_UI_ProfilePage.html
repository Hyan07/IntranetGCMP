<template id="page-perfil">
  <section class="page profile-page">
    <div id="profile-hero" class="profile-hero"></div>
    <div class="profile-grid">
      <article class="panel profile-details panel-wide"><header class="panel-header"><div><p class="eyebrow">Cadastro</p><h3>Informações pessoais e funcionais</h3></div><button id="edit-own-profile" class="btn btn-ghost btn-sm" type="button"><i data-icon="edit"></i> Solicitar atualização</button></header><div id="profile-update-status" class="profile-update-status" hidden></div><div id="profile-details" class="detail-grid profile-complete-details"></div></article>
      <article class="panel security-panel"><header class="panel-header"><div><p class="eyebrow">Segurança</p><h3>Acesso e sessões</h3></div><span class="panel-icon green"><i data-icon="shield"></i></span></header><div class="security-actions"><button id="change-password-button" class="action-row" type="button"><span class="action-icon"><i data-icon="lock"></i></span><span><strong>Alterar minha senha</strong><small>Atualize sua senha institucional</small></span><i data-icon="chevronRight"></i></button><button id="close-sessions-button" class="action-row" type="button"><span class="action-icon"><i data-icon="devices"></i></span><span><strong>Encerrar outras sessões</strong><small>Mantenha apenas este acesso ativo</small></span><i data-icon="chevronRight"></i></button></div></article>
      <article class="panel panel-wide"><header class="panel-header"><div><p class="eyebrow">Responsabilidade</p><h3>Itens sob minha responsabilidade</h3></div></header><div class="tabs profile-custody-tabs" role="tablist" aria-label="Tipos de cautela"><button class="tab active" data-profile-custody-tab="regular" type="button" role="tab" aria-selected="true">Cautela <span id="profile-regular-count" class="tab-count">0</span></button><button class="tab" data-profile-custody-tab="administrative" type="button" role="tab" aria-selected="false">Cautela administrativa <span id="profile-administrative-count" class="tab-count">0</span></button></div><div id="profile-regular-custodies" class="table-region compact-table" data-profile-custody-panel="regular"></div><div id="profile-administrative-custodies" class="table-region compact-table" data-profile-custody-panel="administrative" hidden></div></article>
      <article class="panel"><header class="panel-header"><div><p class="eyebrow">Atividade</p><h3>Últimos turnos</h3></div></header><div id="profile-shifts" class="timeline-list"></div></article>
      <article class="panel"><header class="panel-header"><div><p class="eyebrow">Permissões</p><h3>Acessos concedidos</h3></div></header><div id="profile-permissions" class="chip-list"></div></article>
    </div>
  </section>
</template>
