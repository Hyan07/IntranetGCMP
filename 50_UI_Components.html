<div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

<div id="global-loading" class="global-loading" hidden aria-live="assertive" aria-label="Processando">
  <div class="loading-card"><span class="spinner spinner-lg"></span><strong id="loading-text">Processando…</strong><small>Aguarde um instante</small></div>
</div>

<div id="modal-root" class="modal-root" hidden>
  <div class="modal-backdrop" data-close-modal></div>
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-header"><div><p id="modal-eyebrow" class="eyebrow">Intranet</p><h2 id="modal-title">Detalhes</h2></div><button class="icon-btn" type="button" data-close-modal aria-label="Fechar"><i data-icon="close"></i></button></header>
    <form id="modal-form">
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-error" class="form-message error modal-error" hidden></div>
      <footer id="modal-footer" class="modal-footer"><button class="btn btn-secondary" type="button" data-close-modal>Cancelar</button><button id="modal-submit" class="btn btn-primary" type="submit">Salvar</button></footer>
    </form>
  </section>
</div>

<div id="confirm-root" class="modal-root" hidden>
  <div class="modal-backdrop"></div>
  <section class="modal modal-sm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="confirm-icon"><i data-icon="alert"></i></div>
    <div class="confirm-copy"><h2 id="confirm-title">Confirmar ação</h2><p id="confirm-message">Deseja continuar?</p></div>
    <footer class="modal-footer"><button id="confirm-cancel" class="btn btn-secondary" type="button">Cancelar</button><button id="confirm-accept" class="btn btn-danger" type="button">Confirmar</button></footer>
  </section>
</div>

<template id="empty-state-template">
  <div class="empty-state"><span class="empty-icon"><i data-icon="inbox"></i></span><h3>Nenhum registro encontrado</h3><p>Revise os filtros ou cadastre o primeiro item.</p></div>
</template>
