<style>
  /* Sistema visual GCMP v4: camada compartilhada sobre os módulos existentes. */
  :root {
    --navy-950: #0b1d33;
    --navy-900: #0c2948;
    --navy-800: #153b61;
    --navy-700: #1b527f;
    --navy-600: #246a9d;
    --teal-700: #0f766e;
    --teal-600: #17877d;
    --gold-700: #9a6b16;
    --gold-600: #c99b3b;
    --gold-100: #fff5dc;
    --slate-950: #152033;
    --slate-800: #2b3648;
    --slate-700: #445164;
    --slate-600: #5e6a7a;
    --slate-500: #778292;
    --slate-400: #98a2b0;
    --slate-300: #c3cbd5;
    --slate-200: #d8dfe7;
    --slate-150: #e5eaf0;
    --slate-100: #eef2f5;
    --slate-50: #f6f8fa;
    --sidebar-width: 68px;
    --sidebar-expanded: 256px;
    --topbar-height: 58px;
    --radius-sm: 6px;
    --radius: 8px;
    --radius-lg: 8px;
    --radius-xl: 8px;
    --shadow-sm: 0 1px 2px rgba(11, 29, 51, .05);
    --shadow: 0 8px 22px rgba(11, 29, 51, .08);
    --shadow-lg: 0 18px 50px rgba(11, 29, 51, .2);
  }

  html, body { letter-spacing: 0; }
  body { background: var(--slate-50); font-size: 14px; }
  h1, h2, h3, h4, h5, h6 { letter-spacing: 0 !important; }
  :focus-visible { outline: 2px solid rgba(27, 82, 127, .65); outline-offset: 2px; }

  /* Autenticação */
  .auth-visual { background: var(--navy-950); }
  .auth-visual::before, .auth-visual::after, .auth-orb { display: none; }
  .auth-panel { background: var(--white); }
  .brand-mark, .avatar { border-radius: 6px; background: var(--navy-900); box-shadow: none; }
  .auth-visual .brand-mark { color: var(--navy-950); background: var(--gold-600); }
  .auth-visual h1 { letter-spacing: 0; }

  /* Navegação principal */
  .sidebar {
    width: var(--sidebar-expanded);
    color: rgba(255, 255, 255, .82);
    background: var(--navy-950);
    box-shadow: none;
    transition: width .2s var(--ease), transform .2s var(--ease);
  }
  .sidebar:hover, .sidebar.pinned { width: var(--sidebar-expanded); }
  .sidebar.is-collapsed, .sidebar.is-collapsed:hover { width: var(--sidebar-width); }
  .sidebar-brand { height: var(--topbar-height); gap: 10px; padding: 0 12px; }
  .sidebar-brand .brand-mark { width: 36px; height: 36px; color: var(--navy-950); background: var(--gold-600); }
  .sidebar-brand-copy { min-width: 150px; opacity: 1; transform: none; }
  .sidebar-brand-copy strong { font-size: 13px; }
  .sidebar-brand-copy small { color: rgba(255, 255, 255, .58); font-size: 10px; }
  .sidebar-pin { width: 32px; height: 32px; opacity: 1; }
  .sidebar-pin.active { color: var(--gold-600); background: rgba(255, 255, 255, .08); }
  .sidebar.is-collapsed .sidebar-brand { justify-content: center; padding: 0; }
  .sidebar.is-collapsed .sidebar-brand .brand-mark,
  .sidebar.is-collapsed .sidebar-brand-copy { display: none; }
  .sidebar.is-collapsed .sidebar-pin { margin: 0; opacity: 1; pointer-events: auto; }
  .main-menu { padding: 12px 8px; }
  .menu-item { min-height: 42px; gap: 10px; margin-bottom: 3px; padding: 0 9px; border-radius: 6px; }
  .menu-item > .menu-icon { width: 30px; height: 30px; display: grid; place-items: center; flex: 0 0 auto; min-width: 0; border-radius: 5px; opacity: 1; }
  .menu-item > .menu-icon .svg-icon { width: 17px; height: 17px; }
  .menu-item > .menu-label { min-width: 0; flex: 1; overflow: hidden; opacity: 1; font-size: 12px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
  .menu-active-dot { width: 6px; height: 6px; display: none; flex: 0 0 auto; min-width: 0 !important; border-radius: 50%; background: var(--gold-600); opacity: 1 !important; }
  .menu-item:hover { background: rgba(255, 255, 255, .07); }
  .menu-item.active { color: var(--white); background: #1a344f; box-shadow: none; }
  .menu-item.active > .menu-icon { color: var(--navy-950); background: var(--gold-600); }
  .menu-item.active > .menu-icon .svg-icon { color: inherit; }
  .menu-item.active .menu-active-dot { display: block; }
  .sidebar.is-collapsed .menu-item { justify-content: center; padding: 0 9px; }
  .sidebar.is-collapsed .menu-label, .sidebar.is-collapsed .menu-active-dot { display: none; }
  .sidebar-footer { padding: 8px; }
  .sidebar-user { padding: 7px 5px; border-radius: 6px; }
  .sidebar-user-copy, .sidebar-user > .svg-icon { opacity: 1; }
  .sidebar .logout-item span { min-width: 0; opacity: 1; }
  .sidebar.is-collapsed .sidebar-user-copy, .sidebar.is-collapsed .sidebar-user > .svg-icon { display: none; }
  .sidebar.is-collapsed .logout-item span { display: none; }

  .topbar {
    left: var(--sidebar-expanded);
    height: var(--topbar-height);
    padding: 0 clamp(16px, 2.2vw, 28px);
    border-bottom: 1px solid var(--slate-200);
    background: var(--white);
    backdrop-filter: none;
    transition: left .2s var(--ease);
  }
  .sidebar.is-collapsed ~ .topbar { left: var(--sidebar-width); }
  .topbar-left, .topbar-actions { gap: 10px; }
  .page-heading span { font-size: 10px; letter-spacing: 0; text-transform: none; }
  .page-heading h1 { font-size: 17px; letter-spacing: 0; }
  .connection-indicator { letter-spacing: 0; text-transform: none; }
  .notification-button, .header-profile { border-radius: 6px; }
  .header-profile { max-width: 260px; }
  .main-content {
    margin-left: var(--sidebar-expanded);
    padding: calc(var(--topbar-height) + 24px) clamp(16px, 2.2vw, 28px) 34px;
    transition: margin-left .2s var(--ease);
  }
  .sidebar.is-collapsed ~ .main-content { margin-left: var(--sidebar-width); }
  .page { max-width: 1680px; animation-duration: .18s; }
  .page-actions { min-height: 50px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--slate-200); }
  .page-description { font-size: 12px; }

  /* Controles e componentes compartilhados */
  input, select, textarea, .select-control { min-height: 40px; border-radius: 6px; }
  .btn { min-height: 38px; border-radius: 6px; box-shadow: none; }
  .btn-primary { background: var(--navy-900); box-shadow: none; }
  .btn-primary:hover { background: var(--navy-800); box-shadow: none; }
  .btn-secondary, .btn-ghost { border-color: var(--slate-200); background: var(--white); }
  .btn-ghost { color: var(--navy-800); }
  .icon-btn, .input-action { border-radius: 6px; }
  .panel { padding: 16px; border-color: var(--slate-200); border-radius: 8px; box-shadow: var(--shadow-sm); }
  .panel-header { margin-bottom: 14px; }
  .panel-header h3 { font-size: 15px; }
  .panel-header-note { color: var(--slate-500); font-size: 10px; }
  .panel-icon { width: 34px; height: 34px; border-radius: 6px; }
  .toolbar { gap: 8px; padding: 11px 12px; }
  .search-box input, .select-control { min-height: 38px; }
  .data-table th { height: 39px; padding: 7px 12px; letter-spacing: .04em; }
  .data-table td { height: 53px; padding: 8px 12px; font-size: 12px; }
  .data-table td strong { font-size: 12px; }
  .status { min-height: 24px; border: 1px solid currentColor; border-color: color-mix(in srgb, currentColor 24%, transparent); }
  .pagination { min-height: 48px; }
  .tabs { gap: 0; }
  .tab { min-height: 40px; padding: 7px 12px; }
  .empty-icon { border-radius: 8px; }
  .mini-metric, .permission-module, .bulk-selector { border-radius: 8px; }

  /* Dashboard operacional */
  .welcome-banner {
    min-height: auto;
    align-items: flex-end;
    margin-bottom: 18px;
    padding: 0 0 18px;
    border-bottom: 1px solid var(--slate-200);
    border-radius: 0;
    color: var(--slate-950);
    background: transparent;
    box-shadow: none;
  }
  .welcome-banner::before, .welcome-banner::after { display: none; }
  .welcome-banner h2 { margin: 4px 0 5px; font-size: 28px; letter-spacing: 0; }
  .welcome-banner p:not(.eyebrow) { color: var(--slate-600); font-size: 13px; }
  .welcome-banner .eyebrow.light { color: var(--gold-700); }
  .welcome-date { padding: 8px 11px; border-color: var(--slate-200); border-radius: 6px; color: var(--slate-600); background: var(--white); backdrop-filter: none; }
  .welcome-date .svg-icon { color: var(--gold-700); }
  .metric-grid { gap: 11px; margin-bottom: 16px; }
  .metric-card {
    min-height: 108px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: start;
    padding: 15px 16px;
    border-color: var(--slate-200);
    border-radius: 8px;
    box-shadow: var(--shadow-sm);
  }
  .metric-card:hover { border-color: var(--slate-300); box-shadow: var(--shadow-sm); transform: none; }
  .metric-icon { width: 34px; height: 34px; grid-column: 2; grid-row: 1; border-radius: 6px; }
  .metric-icon .svg-icon { width: 17px; height: 17px; }
  .metric-copy { grid-column: 1; grid-row: 1; }
  .metric-copy strong { font-size: 25px; letter-spacing: 0; }
  .metric-copy span { font-size: 10px; }
  .dashboard-grid { grid-template-columns: minmax(280px, .72fr) minmax(0, 1.28fr); gap: 13px; }
  .dashboard-shortcuts-panel { padding: 15px 16px; }
  .shortcut-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .shortcut { min-height: 48px; flex-direction: row; align-items: center; justify-content: flex-start; gap: 10px; padding: 10px 12px; border-radius: 6px; background: var(--slate-50); }
  .shortcut:hover { border-color: #b9cedf; background: #f0f6fb; }
  .shortcut .svg-icon { width: 17px; height: 17px; color: var(--gold-700); }
  .shortcut span { font-size: 11px; }
  .activity-row { grid-template-columns: 128px 100px 1fr 82px; }

  /* Frota: mesma linguagem visual do restante da intranet */
  .frota-page { gap: 15px; max-width: 1680px; }
  .frota-hero {
    min-height: auto;
    align-items: flex-end;
    padding: 0 0 18px;
    color: var(--slate-950);
    border-bottom: 1px solid var(--slate-200);
    border-radius: 0;
    background: transparent;
    box-shadow: none;
  }
  .frota-hero::after { display: none; }
  .frota-hero h2 { margin: 3px 0 4px; font-size: 28px; letter-spacing: 0; }
  .frota-hero p { color: var(--slate-600); font-size: 12px; }
  .frota-summary { grid-template-columns: repeat(4, minmax(96px, 1fr)); min-width: 440px; }
  .frota-summary-item { padding: 10px 12px; border-color: var(--slate-200); border-radius: 6px; color: var(--slate-950); background: var(--white); backdrop-filter: none; }
  .frota-summary-item strong { font-size: 19px; }
  .frota-summary-item span { margin-top: 4px; color: var(--slate-500); font-size: 9px; }
  .frota-tabs { gap: 3px; padding: 4px; border-radius: 8px; box-shadow: none; }
  .frota-tabs button { min-height: 40px; padding: 0 11px; border-radius: 6px; font-size: 11px; }
  .frota-tabs button span { width: 22px; height: 22px; border-radius: 5px; }
  .frota-tabs button.active { background: var(--navy-900); box-shadow: none; }
  .frota-loading, .frota-panel, .frota-toolbar, .frota-filter-panel, .frota-table-wrap,
  .frota-vehicle-card, .frota-file-card, .frota-vehicle-spotlight, .frota-occurrence-box { border-radius: 8px; box-shadow: none; }
  .frota-view-heading h3 { font-size: 23px; letter-spacing: 0; }
  .frota-user-strip, .frota-active-card, .frota-vehicle-spotlight-header, .frota-modal-header { background: var(--navy-900); }
  .frota-user-strip, .frota-active-card { border-radius: 8px; }
  .frota-driver-confirmation, .frota-driver-highlight { border-radius: 8px; background: #f3faf8; box-shadow: none; }
  .frota-field input, .frota-field select, .frota-field textarea,
  .frota-toolbar input, .frota-toolbar select, .frota-icon-button { border-radius: 6px; }
  .frota-check, .frota-combobox-results { border-radius: 8px; }
  .frota-vehicle-card:hover { border-color: var(--slate-300); box-shadow: none; transform: none; }
  .frota-vehicle-card-head { background: var(--white); }
  .frota-card-stat, .frota-card-actions button, .frota-table-actions button,
  .frota-table-actions a, .frota-pagination button, .frota-file-icon { border-radius: 6px; }
  .frota-table td { font-size: 12px; }
  .frota-modal { border-radius: 8px; box-shadow: var(--shadow-lg); }
  .frota-modal-close { border-radius: 6px; }
  .frota-modal-backdrop { background: rgba(11, 29, 51, .58); backdrop-filter: none; }

  /* Patrimônio */
  .patrimonio-stat, .patrimonio-step, .patrimonio-identity, .patrimonio-receiver-card,
  .patrimonio-item-row, .patrimonio-picker-results, .patrimonio-drawer,
  .patrimonio-drawer-item, .patrimonio-return-item { border-radius: 8px; box-shadow: none; }
  .patrimonio-stat strong { letter-spacing: 0; }
  .patrimonio-bar-fill { background: var(--teal-700); }
  .patrimonio-drawer-head { background: var(--navy-900); }

  /* Modais e mensagens */
  .modal-backdrop { background: rgba(11, 29, 51, .58); backdrop-filter: none; }
  .modal { border-color: var(--slate-200); border-radius: 8px; box-shadow: var(--shadow-lg); }
  .modal-header { min-height: 62px; }
  .modal-header h2 { font-size: 18px; letter-spacing: 0; }
  .loading-card, .toast { border-radius: 8px; }

  @media (max-width: 1180px) {
    .shortcut-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .frota-summary { min-width: 360px; grid-template-columns: repeat(2, minmax(100px, 1fr)); }
  }

  @media (max-width: 920px) {
    .sidebar, .sidebar:hover, .sidebar.pinned, .sidebar.is-collapsed, .sidebar.is-collapsed:hover { width: min(86vw, 290px); }
    .sidebar-brand-copy, .sidebar.is-collapsed .sidebar-brand-copy { position: static; opacity: 1; pointer-events: auto; }
    .sidebar.is-collapsed .sidebar-brand { justify-content: flex-start; padding: 0 12px; }
    .sidebar.is-collapsed .sidebar-brand .brand-mark { display: grid; }
    .sidebar-pin { display: none; }
    .sidebar.is-collapsed .menu-item { justify-content: flex-start; }
    .sidebar.is-collapsed .menu-label { display: inline; }
    .sidebar.is-collapsed .menu-active-dot { display: none; }
    .sidebar.is-collapsed .sidebar-user-copy, .sidebar.is-collapsed .sidebar-user > .svg-icon { display: flex; }
    .sidebar.is-collapsed .logout-item span { display: inline; }
    .topbar, .sidebar.is-collapsed ~ .topbar { left: 0; }
    .main-content, .sidebar.is-collapsed ~ .main-content { margin-left: 0; }
    .dashboard-grid { grid-template-columns: 1fr; }
    .dashboard-activity-panel { grid-column: auto; }
    .frota-hero { align-items: stretch; flex-direction: column; }
    .frota-summary { width: 100%; min-width: 0; }
  }

  @media (max-width: 640px) {
    .topbar { padding: 0 12px; }
    .main-content { padding: calc(var(--topbar-height) + 16px) 12px 26px; }
    .header-profile-copy, .connection-indicator { display: none; }
    .welcome-banner { align-items: stretch; flex-direction: column; gap: 12px; }
    .welcome-banner h2, .frota-hero h2 { font-size: 22px; }
    .welcome-date { align-self: flex-start; }
    .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .metric-card { min-height: 96px; padding: 13px; }
    .metric-copy strong { font-size: 22px; }
    .shortcut-grid { grid-template-columns: 1fr; }
    .activity-row { grid-template-columns: 1fr auto; gap: 5px 10px; padding: 10px 0; }
    .activity-row > :nth-child(2) { display: none; }
    .activity-row > :nth-child(3) { grid-column: 1; }
    .activity-row > :nth-child(4) { grid-column: 2; grid-row: 1 / span 2; }
    .frota-tabs { border-radius: 8px; }
    .frota-tabs button { min-height: 38px; }
    .frota-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .frota-modal, .frota-modal.wide, .modal, .modal.modal-wide, .modal.modal-sm { border-radius: 8px 8px 0 0; }
  }

  @media (max-width: 390px) {
    .metric-grid { grid-template-columns: 1fr; }
    .metric-card { min-height: 88px; }
    .button-group { width: 100%; }
    .button-group .btn { flex: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sidebar, .topbar, .main-content { transition: none; }
  }
</style>
