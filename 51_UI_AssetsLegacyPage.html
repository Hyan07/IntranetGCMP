<template id="page-patrimonio">
  <section class="page">
    <div class="page-actions"><div><p class="page-description">Bens institucionais, cautelas, devoluções e histórico.</p></div><div class="button-group"><button id="new-custody-button" class="btn btn-secondary" type="button"><i data-icon="hand"></i> Nova cautela</button><button id="new-asset-button" class="btn btn-primary" type="button"><i data-icon="plus"></i> Novo patrimônio</button></div></div>
    <div class="tabs" role="tablist"><button class="tab active" data-assets-tab="inventory" type="button">Patrimônios</button><button class="tab" data-assets-tab="open" type="button">Cautelas abertas <span id="open-custody-count" class="tab-count">0</span></button><button class="tab" data-assets-tab="history" type="button">Histórico</button></div>
    <article class="panel data-panel">
      <div class="toolbar"><label class="search-box"><i data-icon="search"></i><input id="assets-search" type="search" placeholder="Buscar patrimônio, descrição, pessoa ou setor"></label><select id="assets-status" class="select-control"><option value="">Todas as situações</option><option>DISPONIVEL</option><option>CAUTELADO</option><option>EM_MANUTENCAO</option><option>DANIFICADO</option><option>INDISPONIVEL</option><option>BAIXADO</option></select><button id="assets-refresh" class="icon-btn bordered" type="button" aria-label="Atualizar"><i data-icon="refresh"></i></button></div>
      <div id="assets-table" class="table-region"></div><div id="assets-pagination" class="pagination"></div>
    </article>
  </section>
</template>
