<script>
(function () {
  'use strict';

  const fleetState = {
    bridge: null,
    root: null,
    bootstrap: null,
    tab: 'km',
    selectedVehicle: null,
    vehicleOptions: null,
    focusVehicle: null,
    focusOccurrenceId: '',
    navigationTarget: null,
    pages: { vehicles: 1, history: 1, management: 1, maintenance: 1, tires: 1, files: 1, defects: 1 },
    clockTimer: null
  };

  const $ = (selector, root = document) => root ? root.querySelector(selector) : null;
  const $$ = (selector, root = document) => root ? Array.from(root.querySelectorAll(selector)) : [];
  const api = (action, payload = {}) => fleetState.bridge.api(action, payload);
  const esc = value => fleetState.bridge.esc(value == null ? '' : value);
  const icon = name => fleetState.bridge.icon ? fleetState.bridge.icon(name) : '';
  const toast = (title, message = '', type = 'success') => fleetState.bridge.toast(title, message, type);
  const can = permission => !permission || (fleetState.bootstrap?.permissoes || []).includes(permission) || Boolean(fleetState.bridge.has?.(permission));
  const canAny = permissions => String(permissions || '').split('|').filter(Boolean).some(can);
  const debounce = (fn, wait = 320) => fleetState.bridge.debounce ? fleetState.bridge.debounce(fn, wait) : (() => { let timer; return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), wait); }; })();
  const badge = value => fleetState.bridge.badge ? fleetState.bridge.badge(value) : `<span class="status">${esc(label(value))}</span>`;
  const formatMasp = value => fleetState.bridge.formatMasp ? fleetState.bridge.formatMasp(value) : (() => { const digits=String(value||'').replace(/\D/g,''); return digits.length>2?`${digits.slice(0,-2).padStart(6,'0')}-${digits.slice(-2)}`:digits; })();

  function label(value) {
    return String(value || '—').replace(/_/g, ' ').toLocaleLowerCase('pt-BR').replace(/(^|\s)\S/g, char => char.toUpperCase());
  }

  function formatDate(value, dateOnly = false) {
    if (!value) return '—';
    if (fleetState.bridge.formatDate) return fleetState.bridge.formatDate(value, dateOnly);
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return esc(value);
    return new Intl.DateTimeFormat('pt-BR', dateOnly ? { dateStyle: 'short' } : { dateStyle: 'short', timeStyle: 'short' }).format(date);
  }

  function dateInput(value) {
    if (!value) return '';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return String(value).slice(0, 10);
    const offset = date.getTimezoneOffset() * 60000;
    return new Date(date.getTime() - offset).toISOString().slice(0, 10);
  }

  function money(value) {
    return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(value || 0));
  }

  function number(value) {
    return Number(value || 0).toLocaleString('pt-BR');
  }

  function initials(name) {
    const parts = String(name || 'GCM').trim().split(/\s+/).filter(Boolean);
    return ((parts[0]?.[0] || 'G') + (parts.length > 1 ? parts[parts.length - 1][0] : 'C')).toUpperCase();
  }

  function formValues(form) {
    const output = {};
    new FormData(form).forEach((value, key) => {
      if (Object.prototype.hasOwnProperty.call(output, key)) output[key] = Array.isArray(output[key]) ? [...output[key], value] : [output[key], value];
      else output[key] = value;
    });
    $$('input[type="checkbox"][name]', form).forEach(input => { output[input.name] = input.checked; });
    return output;
  }

  function optionList(items, selected = '', placeholder = 'Selecione', valueKey = null, labelKey = null) {
    return `<option value="">${esc(placeholder)}</option>${(items || []).map(item => {
      const value = valueKey ? item[valueKey] : item;
      const text = labelKey ? item[labelKey] : label(item);
      return `<option value="${esc(value)}" ${String(value) === String(selected || '') ? 'selected' : ''}>${esc(text)}</option>`;
    }).join('')}`;
  }

  function loadingHtml(message = 'Carregando dados da Frota…') {
    return `<div class="frota-loading"><span class="spinner"></span><p>${esc(message)}</p></div>`;
  }

  function emptyHtml(title = 'Nenhum registro encontrado', message = 'Revise os filtros ou cadastre o primeiro item.') {
    return `<div class="frota-empty"><strong>${esc(title)}</strong><p>${esc(message)}</p></div>`;
  }

  function showError(container, error) {
    if (container) container.innerHTML = `<div class="form-message error" style="margin:14px">${esc(error?.message || String(error))}</div>`;
  }

  async function runButton(button, busyText, callback) {
    if (!button || button.disabled) return;
    const original = button.innerHTML;
    button.disabled = true;
    button.textContent = busyText || 'Processando…';
    try { return await callback(); }
    finally { if (button.isConnected) { button.disabled = false; button.innerHTML = original; } }
  }

  function renderPagination(container, result, onPage) {
    if (!container || !result || !result.total) { if (container) container.innerHTML = ''; return; }
    const start = (result.page - 1) * result.pageSize + 1;
    const end = Math.min(result.total, result.page * result.pageSize);
    const pages = [];
    for (let page = Math.max(1, result.page - 2); page <= Math.min(result.pages, result.page + 2); page += 1) pages.push(page);
    container.innerHTML = `<span>Exibindo ${start}–${end} de ${result.total}</span><div class="frota-pagination-buttons"><button type="button" data-frota-page="${result.page - 1}" ${result.page <= 1 ? 'disabled' : ''}>‹</button>${pages.map(page => `<button type="button" class="${page === result.page ? 'active' : ''}" data-frota-page="${page}">${page}</button>`).join('')}<button type="button" data-frota-page="${result.page + 1}" ${result.page >= result.pages ? 'disabled' : ''}>›</button></div>`;
    $$('[data-frota-page]', container).forEach(button => button.addEventListener('click', () => onPage(Number(button.dataset.frotaPage))));
  }

  function occurrenceFieldsHtml(values = {}) {
    const options = fleetState.bootstrap?.opcoes || {};
    return `<div class="frota-occurrence-box">
      <div class="frota-form-grid">
        <label class="frota-field"><span>Tipo *</span><select name="occurrenceTipo" required>${optionList(options.tiposOcorrencia || [], values.tipo || 'DEFEITO', 'Selecione')}</select></label>
        <label class="frota-field"><span>Categoria *</span><select name="occurrenceCategoria" required>${optionList(options.categoriasOcorrencia || [], values.categoria || 'MECANICA', 'Selecione')}</select></label>
        <label class="frota-field"><span>Gravidade *</span><select name="occurrenceGravidade" required>${optionList(options.gravidades || [], values.gravidade || 'MEDIA', 'Selecione')}</select></label>
      </div>
      <label class="frota-field"><span>Descrição *</span><textarea name="occurrenceDescricao" rows="4" maxlength="3000" required>${esc(values.descricao || '')}</textarea></label>
      <div class="frota-form-grid">
        <label class="frota-field"><span>Local do defeito</span><input name="occurrenceLocal" maxlength="500" value="${esc(values.local || '')}"></label>
        <label class="frota-check"><input name="occurrenceRetirada" type="checkbox" ${values.retirada ? 'checked' : ''}><span><strong>Solicitar retirada de serviço</strong><small>A gestão será notificada.</small></span></label>
      </div>
      <label class="frota-field"><span>Observação complementar</span><textarea name="occurrenceComplemento" rows="2" maxlength="1500">${esc(values.complemento || '')}</textarea></label>
    </div>`;
  }

  function occurrencePayload(data, enabled = true) {
    return {
      enabled,
      tipo: data.occurrenceTipo,
      categoria: data.occurrenceCategoria,
      gravidade: data.occurrenceGravidade,
      descricao: data.occurrenceDescricao,
      local: data.occurrenceLocal,
      retirada: Boolean(data.occurrenceRetirada),
      complemento: data.occurrenceComplemento
    };
  }

  function openModal(options) {
    const existing = $('.frota-modal-backdrop');
    if (existing) existing.remove();
    const template = $('#frota-modal-shell');
    const fragment = template.content.cloneNode(true);
    const overlay = $('.frota-modal-backdrop', fragment);
    const modal = $('.frota-modal', fragment);
    const form = $('[data-frota-modal-form]', fragment);
    const body = $('[data-frota-modal-body]', fragment);
    const errorBox = $('[data-frota-modal-error]', fragment);
    const footer = $('[data-frota-modal-footer]', fragment);
    const submit = $('[data-frota-modal-submit]', fragment);
    $('[data-frota-modal-title]', fragment).textContent = options.title || 'Detalhes';
    $('[data-frota-modal-eyebrow]', fragment).textContent = options.eyebrow || 'Viaturas e Frota';
    body.innerHTML = options.body || '';
    modal.classList.toggle('wide', Boolean(options.wide));
    submit.textContent = options.submitText || 'Salvar';
    if (options.readonly) footer.hidden = true;
    let keyHandler = null;
    const close = () => {
      if (keyHandler) document.removeEventListener('keydown', keyHandler);
      overlay.remove();
    };
    $$('[data-frota-modal-close]', fragment).forEach(button => button.addEventListener('click', close));
    overlay.addEventListener('click', event => { if (event.target === overlay) close(); });
    keyHandler = event => { if (event.key === 'Escape') close(); };
    document.addEventListener('keydown', keyHandler);
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!options.onSubmit) return;
      errorBox.hidden = true;
      const original = submit.textContent;
      submit.disabled = true;
      submit.textContent = options.busyText || 'Salvando…';
      try {
        const result = await options.onSubmit(formValues(form), form, overlay);
        if (result !== false) close();
      } catch (error) {
        errorBox.textContent = error?.message || String(error);
        errorBox.hidden = false;
      } finally {
        if (submit.isConnected) { submit.disabled = false; submit.textContent = original; }
      }
    });
    document.body.appendChild(fragment);
    setTimeout(() => $('input:not([type="hidden"]), select, textarea, button', overlay)?.focus(), 30);
    if (options.afterOpen) options.afterOpen(overlay, form);
    return overlay;
  }

  function confirmModal(title, message, confirmText, onConfirm) {
    return openModal({
      title, eyebrow: 'Confirmação', submitText: confirmText || 'Confirmar',
      body: `<p style="margin:0;color:#50635d;line-height:1.6">${esc(message)}</p>`,
      onSubmit: async () => onConfirm()
    });
  }

  async function refreshBootstrap() {
    fleetState.bootstrap = await api('frota.bootstrap');
    renderSummary();
    return fleetState.bootstrap;
  }

  function renderSummary() {
    const summary = fleetState.bootstrap?.resumo || {};
    const target = $('#frota-summary', fleetState.root);
    if (!target) return;
    target.innerHTML = [
      ['viaturas', 'Viaturas'], ['disponiveis', 'Disponíveis'], ['movimentacoesAbertas', 'Em uso'], ['defeitosPendentes', 'Defeitos pendentes']
    ].map(([key, text]) => `<div class="frota-summary-item"><strong>${esc(summary[key] || 0)}</strong><span>${esc(text)}</span></div>`).join('');
  }

  async function ensureVehicleOptions(force = false) {
    if (!fleetState.vehicleOptions || force) {
      const result = await api('frota.km.viaturas', { query: '', onlyAvailable: false });
      fleetState.vehicleOptions = result.items || result || [];
    }
    return fleetState.vehicleOptions;
  }

  function vehicleSelectHtml(vehicles, selected = '', placeholder = 'Selecione a viatura') {
    return `<option value="">${esc(placeholder)}</option>${(vehicles || []).map(vehicle => `<option value="${esc(vehicle.ID_VIATURA)}" ${String(vehicle.ID_VIATURA) === String(selected || '') ? 'selected' : ''}>${esc(vehicle.PREFIXO)} — ${esc(vehicle.PLACA)} — ${esc(vehicle.MODELO || '')}</option>`).join('')}`;
  }

  async function switchTab(tab) {
    if (!fleetState.root?.isConnected) return;
    const button = $(`[data-frota-tab="${tab}"]`, fleetState.root);
    if (!button || button.hidden) return;
    const required = button.dataset.frotaPermissions || button.dataset.frotaPermission || '';
    if (required && !canAny(required)) return;
    fleetState.tab = tab;
    $$('[data-frota-tab]', fleetState.root).forEach(item => {
      item.classList.toggle('active', item.dataset.frotaTab === tab);
      item.setAttribute('aria-selected', item.dataset.frotaTab === tab ? 'true' : 'false');
    });
    const content = $('#frota-content', fleetState.root);
    const template = $(`#frota-view-${tab}`);
    if (!template) { content.innerHTML = emptyHtml('Área não configurada', 'O arquivo desta página não foi encontrado.'); return; }
    content.innerHTML = '';
    content.appendChild(template.content.cloneNode(true));
    const renderers = {
      km: renderKm,
      viaturas: renderVehicles,
      historico: renderHistory,
      gerenciamento: renderManagement,
      manutencoes: renderMaintenance,
      arquivos: renderFiles,
      defeitos: renderDefects
    };
    try { await renderers[tab]?.(); }
    catch (error) { showError(content, error); }
  }

  async function init(bridge) {
    fleetState.bridge = bridge;
    fleetState.root = $('#frota-app');
    fleetState.tab = 'km';
    fleetState.selectedVehicle = null;
    fleetState.vehicleOptions = null;
    fleetState.focusVehicle = null;
    fleetState.focusOccurrenceId = '';
    fleetState.navigationTarget = null;
    fleetState.pages = { vehicles: 1, history: 1, management: 1, maintenance: 1, files: 1, defects: 1 };
    if (!fleetState.root) return;
    try {
      try {
        const rawTarget = sessionStorage.getItem('intranet.frota.target');
        if (rawTarget) fleetState.navigationTarget = JSON.parse(rawTarget);
        sessionStorage.removeItem('intranet.frota.target');
      } catch (targetError) { fleetState.navigationTarget = null; }
      fleetState.bootstrap = await api('frota.bootstrap');
      renderSummary();
      $$('[data-frota-permission]', fleetState.root).forEach(button => { button.hidden = !can(button.dataset.frotaPermission); });
      $$('[data-frota-permissions]', fleetState.root).forEach(button => { button.hidden = !canAny(button.dataset.frotaPermissions); });
      $$('[data-frota-tab]', fleetState.root).forEach(button => button.addEventListener('click', () => switchTab(button.dataset.frotaTab)));
      const firstAllowed = $$('[data-frota-tab]', fleetState.root).find(button => !button.hidden);
      const requestedTab = fleetState.navigationTarget?.tab;
      const requestedButton = requestedTab ? $(`[data-frota-tab="${requestedTab}"]`, fleetState.root) : null;
      if (requestedButton && !requestedButton.hidden) {
        fleetState.focusOccurrenceId = fleetState.navigationTarget.occurrenceId || '';
        await switchTab(requestedTab);
        if (requestedTab === 'manutencoes' && fleetState.navigationTarget.maintenanceId) {
          if (can('FROTA_GERENCIAR_MANUTENCOES')) await openMaintenanceForm(fleetState.navigationTarget.maintenanceId);
          else if (can('FROTA_VISUALIZAR_MANUTENCOES')) await openMaintenanceDetails(fleetState.navigationTarget.maintenanceId);
        }
      } else if (firstAllowed) await switchTab(firstAllowed.dataset.frotaTab);
      else $('#frota-content', fleetState.root).innerHTML = emptyHtml('Nenhuma área liberada', 'Peça ao administrador uma permissão específica da Frota.');
    } catch (error) {
      const content = $('#frota-content', fleetState.root);
      if (content) content.innerHTML = `<div class="form-message error">${esc(error.message)}</div>`;
    }
  }

  /* Lançamento de KM */
  async function renderKm() {
    const view = $('[data-frota-view="km"]', fleetState.root);
    if (!view || !view.isConnected) return;
    const state = await api('frota.km.estado');
    if (!view.isConnected) return;
    const user = state.usuario || fleetState.bootstrap.usuario;
    $('[data-km-user-name]', view).textContent = user.nome;
    $('[data-km-user-masp]', view).textContent = user.maspFormatado || user.masp;
    $('[data-km-initials]', view).textContent = initials(user.nome);
    const updateClock = () => {
      const clock = $('[data-km-clock]', view);
      if (!clock) return;
      clock.textContent = new Intl.DateTimeFormat('pt-BR', { dateStyle: 'full', timeStyle: 'medium' }).format(new Date());
    };
    clearInterval(fleetState.clockTimer);
    updateClock();
    fleetState.clockTimer = setInterval(() => { if (view.isConnected) updateClock(); else clearInterval(fleetState.clockTimer); }, 1000);
    $('[data-km-refresh]', view).addEventListener('click', () => renderKm());
    if (state.movimentacao) renderActiveMovement(view, state.movimentacao, state.viatura);
    else bindKmOpening(view, user);
  }

  function bindKmOpening(view, user) {
    $('#frota-km-active-area', view).hidden = true;
    $('#frota-km-open-area', view).hidden = false;
    const form = $('#frota-km-open-form', view);
    const search = $('#frota-km-vehicle-search', view);
    const results = $('#frota-km-vehicle-results', view);
    const driver = $('[data-km-driver]', form);
    const kmInput = $('[name="initialKm"]', form);
    const divergent = $('[name="kmDivergent"]', form);
    const reason = $('[data-divergence-reason]', form);
    const occurrenceToggle = $('[data-occurrence-toggle]', form);
    const occurrenceContainer = $('[data-occurrence-container]', form);
    const openButton = $('[data-km-open-button]', form);
    driver.textContent = user.nome;
    $('[data-km-driver-id]', form).textContent = `MASP ${user.maspFormatado || user.masp}`;

    const performSearch = debounce(async () => {
      results.hidden = false;
      results.innerHTML = `<div class="frota-empty-compact">Pesquisando…</div>`;
      try {
        const vehicles = await api('frota.km.viaturas', { query: search.value });
        if (!vehicles.length) results.innerHTML = `<div class="frota-empty-compact">Nenhuma viatura encontrada.</div>`;
        else {
          results.innerHTML = vehicles.map(vehicle => `<button class="frota-combobox-option" type="button" data-select-km-vehicle="${esc(vehicle.ID_VIATURA)}"><span><strong>${esc(vehicle.PREFIXO)} — ${esc(vehicle.PLACA)}</strong><small>${esc(`${vehicle.MARCA || ''} ${vehicle.MODELO || ''}`.trim())} · ${esc(label(vehicle.TIPO))} · ${esc(vehicle.SETOR || 'Sem setor')}</small></span>${badge(vehicle.STATUS)}</button>`).join('');
          $$('[data-select-km-vehicle]', results).forEach(button => button.addEventListener('click', () => {
            const selected = vehicles.find(vehicle => vehicle.ID_VIATURA === button.dataset.selectKmVehicle);
            selectKmVehicle(view, selected);
            search.value = `${selected.PREFIXO} — ${selected.PLACA}`;
            results.hidden = true;
          }));
        }
      } catch (error) { results.innerHTML = `<div class="form-message error" style="margin:8px">${esc(error.message)}</div>`; }
    }, 280);
    search.addEventListener('input', () => { fleetState.selectedVehicle = null; openButton.disabled = true; performSearch(); });
    search.addEventListener('focus', performSearch);
    view.addEventListener('click', event => { if (!event.target.closest('.frota-combobox')) results.hidden = true; });

    divergent.addEventListener('change', () => {
      kmInput.disabled = !divergent.checked;
      reason.hidden = !divergent.checked;
      $('[name="divergenceJustification"]', form).required = divergent.checked;
      if (!divergent.checked && fleetState.selectedVehicle) kmInput.value = fleetState.selectedVehicle.KM_ATUAL;
    });
    occurrenceToggle.addEventListener('change', () => {
      occurrenceContainer.hidden = !occurrenceToggle.checked;
      occurrenceContainer.innerHTML = occurrenceToggle.checked ? occurrenceFieldsHtml() : '';
    });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const errorBox = $('[data-km-error]', form);
      errorBox.hidden = true;
      if (!fleetState.selectedVehicle) { errorBox.textContent = 'Selecione uma viatura.'; errorBox.hidden = false; return; }
      const data = formValues(form);
      try {
        await runButton(openButton, 'Abrindo utilização…', async () => {
          const response = await api('frota.km.abrir', {
            vehicleId: fleetState.selectedVehicle.ID_VIATURA,
            initialKm: kmInput.value,
            kmDivergent: divergent.checked,
            divergenceJustification: data.divergenceJustification,
            departureObservation: data.departureObservation,
            occurrence: occurrencePayload(data, occurrenceToggle.checked)
          });
          toast('Utilização iniciada', `${response.movimentacao.PREFIXO} está vinculada ao seu MASP.`);
          await refreshBootstrap();
          await renderKm();
        });
      } catch (error) { errorBox.textContent = error.message; errorBox.hidden = false; }
    });
  }

  function selectKmVehicle(view, vehicle) {
    fleetState.selectedVehicle = vehicle;
    const card = $('#frota-km-vehicle-card', view);
    const form = $('#frota-km-open-form', view);
    const available = String(vehicle.STATUS) === 'DISPONIVEL';
    card.innerHTML = `<div class="frota-vehicle-spotlight">
      <div class="frota-vehicle-spotlight-header"><div><strong>${esc(vehicle.PREFIXO)} — ${esc(vehicle.PLACA)}</strong><small>${esc(`${vehicle.MARCA || ''} ${vehicle.MODELO || ''}`.trim())}</small></div>${badge(vehicle.STATUS)}</div>
      <div class="frota-data-grid">
        ${dataItem('Tipo / setor', `${label(vehicle.TIPO)} · ${vehicle.SETOR || '—'}`)}
        ${dataItem('KM atual', `${number(vehicle.KM_ATUAL)} km`)}
        ${dataItem('Último condutor', vehicle.ULTIMO_CONDUTOR || '—')}
        ${dataItem('Última movimentação', formatDate(vehicle.ULTIMA_MOVIMENTACAO))}
        ${dataItem('Observação atual', vehicle.OBSERVACAO_ATUAL || 'Sem observação')}
        ${dataItem('Defeitos pendentes', vehicle.DEFEITOS_PENDENTES || 0, Number(vehicle.DEFEITOS_PENDENTES) > 0)}
      </div>
    </div>${available ? '' : `<div class="form-message warning" style="margin-top:10px">Esta viatura não pode ser aberta porque está ${esc(label(vehicle.STATUS))}.</div>`}`;
    $('[name="initialKm"]', form).value = vehicle.KM_ATUAL || 0;
    $('[data-km-open-button]', form).disabled = !available;
  }

  function dataItem(title, value, alert = false) {
    return `<div class="frota-data-item ${alert ? 'alert' : ''}"><small>${esc(title)}</small><strong>${esc(value)}</strong></div>`;
  }

  function renderActiveMovement(view, movement, vehicle) {
    $('#frota-km-open-area', view).hidden = true;
    const area = $('#frota-km-active-area', view);
    area.hidden = false;
    area.innerHTML = `<article class="frota-active-card">
      <div class="frota-active-card-head"><div><span class="frota-kicker">Movimentação em andamento</span><h4>${esc(movement.PREFIXO)} — ${esc(movement.PLACA)}</h4><p>${esc(`${vehicle?.MARCA || ''} ${vehicle?.MODELO || ''}`.trim())}</p></div>${badge(movement.STATUS)}</div>
      <div class="frota-driver-highlight"><small>Condutor responsável</small><strong>${esc(movement.CONDUTOR_NOME)}</strong><span>MASP ${esc(formatMasp(movement.CONDUTOR_MASP))}</span></div>
      <div class="frota-data-grid">
        ${dataItem('Horário de saída', formatDate(movement.DATA_HORA_ABERTURA))}
        ${dataItem('KM inicial', `${number(movement.KM_INICIAL_INFORMADO)} km`)}
        ${dataItem('KM do sistema', `${number(movement.KM_SISTEMA_ABERTURA)} km`)}
        ${dataItem('Observação', movement.OBSERVACAO_SAIDA || 'Sem observação')}
      </div>
      <button class="btn" type="button" data-close-movement>Encerrar utilização</button>
    </article>`;
    $('[data-close-movement]', area).addEventListener('click', () => openCloseMovementModal(movement));
  }

  function openCloseMovementModal(movement) {
    const body = `<div class="frota-form">
      <div class="frota-form-grid">
        <label class="frota-field"><span>Viatura</span><input value="${esc(movement.PREFIXO)} — ${esc(movement.PLACA)}" disabled></label>
        <label class="frota-field"><span>KM inicial</span><input value="${esc(movement.KM_INICIAL_INFORMADO)}" disabled></label>
        <label class="frota-field"><span>KM final *</span><input name="finalKm" type="number" min="${esc(movement.KM_INICIAL_INFORMADO)}" required></label>
      </div>
      <label class="frota-field"><span>Observação de encerramento</span><textarea name="closingObservation" rows="3" maxlength="3000"></textarea></label>

  /* Cards de viaturas */
  async function renderVehicles() {
    const view = $('[data-frota-view="viaturas"]', fleetState.root);
    if (!view || !view.isConnected) return;
    const search = $('[data-vehicle-search]', view);

  async function loadVehicleCards(view) {
    if (!view || !view.isConnected) return;
    const region = $('#frota-vehicle-cards', view);
    if (!region) return;
    region.innerHTML = loadingHtml();
    try {
      const result = await api('frota.viaturas.listar', {
        page: fleetState.pages.vehicles, pageSize: 18,
        query: $('[data-vehicle-search]', view).value,
        status: $('[data-vehicle-status]', view).value
      });
      region.innerHTML = result.items.length ? result.items.map(vehicleCardHtml).join('') : emptyHtml('Nenhuma viatura encontrada');

      $$('[data-vehicle-observation]', region).forEach(button => button.addEventListener('click', () => openVehicleObservation(button.dataset.vehicleObservation)));

  function historyPrintText(value, maxLength) {
    const text = String(value == null || value === '' ? '—' : value).replace(/\s+/g, ' ').trim();
    return text.length > maxLength ? `${text.slice(0, maxLength - 1)}…` : text;
  }

  function historyPrintFilters(filters) {
    const definitions = [
      ['startDate', 'Data inicial'], ['endDate', 'Data final'], ['prefix', 'Prefixo'], ['plate', 'Placa'],
      ['masp', 'MASP'], ['driver', 'Condutor / usuário'], ['type', 'Tipo'], ['status', 'Status'],
      ['kmDivergent', 'KM divergente'], ['category', 'Categoria'], ['gravity', 'Gravidade'], ['query', 'Texto livre']
    ];
    const items = definitions.map(([key, title]) => {
      let value = filters[key];
      if (value === undefined || value === null || value === '') return '';
      if (key === 'startDate' || key === 'endDate') value = String(value).split('-').reverse().join('/');
      else if (key === 'kmDivergent') value = String(value) === 'true' ? 'Sim' : 'Não';
      else if (['type', 'status', 'category', 'gravity'].includes(key)) value = label(value);
      return `<span class="filter"><strong>${esc(title)}:</strong> ${esc(value)}</span>`;
    }).filter(Boolean);
    return items.length ? items.join('') : '<span class="filter"><strong>Filtros:</strong> todos os registros</span>';
  }

  async function openManagedVehicle(id = '') {
    const vehicle = id ? await api('frota.viaturas.obter', { id }) : {};
    openModal({
      title: id ? 'Editar viatura' : 'Cadastrar viatura', eyebrow: 'Gerenciamento de Frota', wide: true,
      submitText: id ? 'Salvar alterações' : 'Cadastrar e criar pasta', body: vehicleFormHtml(vehicle),
      onSubmit: async data => {
        const saved = await api('frota.viaturas.salvar', data);
        toast(id ? 'Viatura atualizada' : 'Viatura cadastrada', `${saved.PREFIXO} — ${saved.PLACA}`);
        fleetState.vehicleOptions = null;
        await refreshBootstrap();
        await loadManagement($('[data-frota-view="gerenciamento"]', fleetState.root));
      }
    });
  }

  async function openFleetSettings() {
    const config = await api('frota.config.obter');
    openModal({
      title: 'Configurar alertas', eyebrow: 'Configuração da Frota', submitText: 'Salvar configurações', wide: true,
      body: `<div class="frota-form-grid"><label class="frota-field"><span>Avisar revisão faltando (KM)</span><input name="REVISAO_KM" type="number" min="0" value="${esc(config.REVISAO_KM)}" required></label><label class="frota-field"><span>Avisar troca de óleo faltando (KM)</span><input name="OLEO_KM" type="number" min="0" value="${esc(config.OLEO_KM)}" required></label><label class="frota-field"><span>Seguro — dias de aviso</span><input name="SEGURO_DIAS" value="${esc(config.SEGURO_DIAS)}" placeholder="30,15,7,1" required></label><label class="frota-field"><span>Licenciamento — dias de aviso</span><input name="LICENCIAMENTO_DIAS" value="${esc(config.LICENCIAMENTO_DIAS)}" placeholder="30,15,7,1" required></label><label class="frota-field"><span>Manutenção — dias de aviso</span><input name="MANUTENCAO_DIAS" value="${esc(config.MANUTENCAO_DIAS)}" placeholder="15,7,1" required></label></div>`,

    openModal({
      title: 'Alterar status operacional', eyebrow: `${vehicle.PREFIXO} — ${vehicle.PLACA}`, submitText: 'Confirmar status',
      body: `<div class="frota-form"><label class="frota-field"><span>Novo status *</span><select name="status" required>${optionList(fleetState.bootstrap.opcoes.statusViatura || [], vehicle.STATUS, 'Selecione')}</select></label><label class="frota-field"><span>Justificativa *</span><textarea name="justification" rows="4" required></textarea></label></div>`,

  async function openVehicleDisable(id) {

      title: 'Desativar viatura', eyebrow: `${vehicle.PREFIXO} — ${vehicle.PLACA}`, submitText: 'Desativar cadastro',

  /* Manutenções */
  async function renderMaintenance() {
    const view = $('[data-frota-view="manutencoes"]', fleetState.root);
    if (!view || !view.isConnected) return;
    const vehicles = await ensureVehicleOptions();
    if (!view.isConnected) return;
    const vehicleFilter = $('[data-maintenance-vehicle]', view);
    vehicleFilter.innerHTML = vehicleSelectHtml(vehicles, fleetState.focusVehicle?.ID_VIATURA || '', 'Todas as viaturas');
    const newButton = $('[data-new-maintenance]', view);
    newButton.hidden = !can('FROTA_GERENCIAR_MANUTENCOES');
    newButton.addEventListener('click', () => openMaintenanceForm('', vehicleFilter.value));
    $('[data-maintenance-search]', view).addEventListener('input', debounce(() => { fleetState.pages.maintenance = 1; loadMaintenance(view); }));
    vehicleFilter.addEventListener('change', () => { fleetState.pages.maintenance = 1; loadMaintenance(view); });
    $('[data-maintenance-status]', view).addEventListener('change', () => { fleetState.pages.maintenance = 1; loadMaintenance(view); });
    $('[data-maintenance-refresh]', view).addEventListener('click', () => loadMaintenance(view));
    await loadMaintenance(view);
  }

  async function loadMaintenance(view) {
    if (!view || !view.isConnected) return;
    const region = $('#frota-maintenance-list', view);
    if (!region) return;
    region.innerHTML = loadingHtml();
    try {
      const result = await api('frota.manutencoes.listar', {
        page: fleetState.pages.maintenance, pageSize: 20,
        query: $('[data-maintenance-search]', view).value,
        vehicleId: $('[data-maintenance-vehicle]', view).value,
        status: $('[data-maintenance-status]', view).value
      });
      region.innerHTML = result.items.length ? `<table class="frota-table"><thead><tr><th>Viatura</th><th>Origem</th><th>Serviço</th><th>Datas</th><th>Fornecedor</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${result.items.map(item => `<tr><td data-label="Viatura"><strong>${esc(item.PREFIXO)}</strong><small>${esc(item.PLACA)}</small></td><td data-label="Origem">${item.ID_OCORRENCIA_ORIGEM ? `<strong>${esc(label(item.ORIGEM_TIPO || item.TIPO_OCORRENCIA_ORIGEM))}</strong><small>${esc(label(item.ORIGEM_CATEGORIA || 'OUTRO'))} · ${esc(String(item.ORIGEM_DESCRICAO || '').slice(0, 80))}</small>` : '<small>Cadastro direto</small>'}</td><td data-label="Serviço"><strong>${esc(label(item.CLASSIFICACAO))}</strong><small>${esc(String(item.DESCRICAO_PROBLEMA || '').slice(0, 110))}</small></td><td data-label="Datas"><strong>${formatDate(item.DATA_ABERTURA, true)}</strong><small>Prevista: ${formatDate(item.DATA_PREVISTA, true)}</small></td><td data-label="Fornecedor">${esc(item.OFICINA_FORNECEDOR || '—')}</td><td data-label="Valor">${money(item.VALOR_TOTAL)}</td><td data-label="Status">${badge(item.STATUS)}</td><td data-label="Ações"><div class="frota-table-actions"><button type="button" data-maintenance-detail="${esc(item.ID_MANUTENCAO)}">Detalhes</button>${can('FROTA_GERENCIAR_MANUTENCOES') ? `<button type="button" data-maintenance-edit="${esc(item.ID_MANUTENCAO)}">Editar</button>` : ''}</div></td></tr>`).join('')}</tbody></table>` : emptyHtml('Nenhuma manutenção encontrada');
      renderPagination($('#frota-maintenance-pagination', view), result, page => { fleetState.pages.maintenance = page; loadMaintenance(view); });
      $$('[data-maintenance-detail]', region).forEach(button => button.addEventListener('click', () => openMaintenanceDetails(button.dataset.maintenanceDetail)));
      $$('[data-maintenance-edit]', region).forEach(button => button.addEventListener('click', () => openMaintenanceForm(button.dataset.maintenanceEdit)));
    } catch (error) { showError(region, error); }
  }

      <label class="frota-field"><span>Valor de mão de obra</span><input name="VALOR_MAO_OBRA" type="number" min="0" step="0.01" value="${esc(m.VALOR_MAO_OBRA || '')}"></label>
      <label class="frota-field"><span>Valor de peças</span><input name="VALOR_PECAS" type="number" min="0" step="0.01" value="${esc(m.VALOR_PECAS || '')}"></label>
      <label class="frota-field"><span>Próxima manutenção por data</span><input name="PROXIMA_MANUTENCAO_DATA" type="date" value="${dateInput(m.PROXIMA_MANUTENCAO_DATA)}"></label>
      <label class="frota-field"><span>Próxima manutenção por KM</span><input name="PROXIMA_MANUTENCAO_KM" type="number" min="0" value="${esc(m.PROXIMA_MANUTENCAO_KM || '')}"></label>
      <label class="frota-field frota-span-2"><span>${linked ? 'Observação do tratamento / resolução' : 'Observação'}</span><textarea name="OBSERVACAO" rows="3">${esc(m.OBSERVACAO || m.ORIGEM_RESOLUCAO || '')}</textarea></label>
      <label class="frota-check frota-span-2"><input name="RETORNAR_DISPONIVEL" type="checkbox" checked><span><strong>Ao concluir, tentar retornar a viatura para DISPONÍVEL</strong><small>A liberação só ocorrerá se não houver outra pendência, movimentação ou manutenção ativa.</small></span></label>
    </div>`;
  }

  function maintenanceClassificationFromOccurrence(item) {
    const category = String(item?.CATEGORIA || '').toUpperCase();
    if (['MOTOR','MECANICA'].includes(category)) return 'MOTOR';
    if (['ELETRICA','ILUMINACAO'].includes(category)) return 'ELETRICA';
    if (['PNEUS','FREIOS','SUSPENSAO','DIRECAO','LATARIA'].includes(category)) return category;
    return 'OUTRO';
  }

  function maintenanceFromOccurrence(item) {
    if (!item) return {};
    return {
      ID_VIATURA: item.ID_VIATURA,
      ID_OCORRENCIA_ORIGEM: item.ID_REGISTRO_OCORRENCIA || item.ID_DEFEITO || item.ID_OBSERVACAO,
      TIPO_OCORRENCIA_ORIGEM: item.REGISTRO_TIPO || 'DEFEITO',
      TIPO_MANUTENCAO: 'CORRETIVA',
      CLASSIFICACAO: maintenanceClassificationFromOccurrence(item),
      STATUS: 'PROGRAMADA',
      DATA_ABERTURA: dateInput(new Date()),
      DESCRICAO_PROBLEMA: item.DESCRICAO || item.OBSERVACAO_NOVA || '',
      ORIGEM_TIPO: item.REGISTRO_TIPO || 'DEFEITO',
      ORIGEM_CATEGORIA: item.CATEGORIA || item.TIPO || 'OUTRO',
      ORIGEM_GRAVIDADE: item.GRAVIDADE || 'MEDIA',
      ORIGEM_DESCRICAO: item.DESCRICAO || item.OBSERVACAO_NOVA || '',
      ORIGEM_LOCAL: item.LOCAL_DEFEITO || '',
      ORIGEM_SOLICITOU_RETIRADA: String(item.SOLICITOU_RETIRADA || '').toUpperCase() === 'SIM',
      ORIGEM_COMPLEMENTO: item.MOTIVO || ''
    };
  }

  async function openMaintenanceForm(id = '', selectedVehicleId = '', occurrence = null) {
    const vehicles = await ensureVehicleOptions();
    const item = id ? await api('frota.manutencoes.obter', { id }) : Object.assign({ ID_VIATURA: selectedVehicleId || fleetState.focusVehicle?.ID_VIATURA || '', DATA_ABERTURA: dateInput(new Date()) }, maintenanceFromOccurrence(occurrence));
    const linked = Boolean(item.ID_OCORRENCIA_ORIGEM);
    if (!id && item.ID_VIATURA) item.KM_ABERTURA = vehicles.find(vehicle => vehicle.ID_VIATURA === item.ID_VIATURA)?.KM_ATUAL || 0;
    openModal({
      title: id ? (linked ? 'Tratar ocorrência na manutenção' : 'Editar manutenção') : 'Nova manutenção', eyebrow: linked ? 'Ocorrência integrada à oficina' : 'Gestão de oficina', wide: true,
      submitText: linked ? 'Salvar tratamento e manutenção' : (id ? 'Salvar manutenção' : 'Registrar manutenção'), body: maintenanceFormHtml(item, vehicles),
      afterOpen: overlay => {
        const select = $('select[name="ID_VIATURA"]', overlay);
        if (select) select.addEventListener('change', () => {
          const km = $('[name="KM_ABERTURA"]', overlay);
          const vehicle = vehicles.find(option => option.ID_VIATURA === select.value);
          if (vehicle && !km.value) km.value = vehicle.KM_ATUAL || 0;
        });
      },
      onSubmit: async data => {
        const result = await api('frota.manutencoes.salvar', data);
        if (result.RESTAURACAO_SOLICITADA && !result.VIATURA_RESTAURADA) toast('Manutenção concluída, mas a viatura continua indisponível', result.MOTIVO_NAO_RESTAURADA || 'Revise as demais pendências.', 'warning', 8000);
        else if (result.VIATURA_RESTAURADA) toast('Manutenção concluída', 'A ocorrência foi resolvida e a viatura voltou para DISPONÍVEL.');
        else toast('Manutenção salva', result.ID_OCORRENCIA_ORIGEM ? 'A ocorrência vinculada também foi atualizada.' : 'Status, prazos e custos foram atualizados.');
        fleetState.vehicleOptions = null;
        await refreshBootstrap();
        if (fleetState.tab === 'manutencoes') await loadMaintenance($('[data-frota-view="manutencoes"]', fleetState.root));
        if (fleetState.tab === 'defeitos') await loadDefects($('[data-frota-view="defeitos"]', fleetState.root));
      }
    });
  }

  async function openMaintenanceDetails(id) {
    const item = await api('frota.manutencoes.obter', { id });
    const origin = item.ID_OCORRENCIA_ORIGEM ? `<div class="frota-card-note"><strong>Origem: ${esc(label(item.ORIGEM_TIPO || item.TIPO_OCORRENCIA_ORIGEM))} · ${esc(label(item.ORIGEM_CATEGORIA || 'OUTRO'))}</strong><br>${esc(item.ORIGEM_DESCRICAO || 'Descrição não localizada.')}</div>` : '<div class="frota-card-note">Manutenção cadastrada diretamente, sem ocorrência de origem.</div>';
    openModal({
      title: `${item.PREFIXO} — ${label(item.CLASSIFICACAO)}`, eyebrow: `Manutenção ${label(item.STATUS)}`, readonly: true, wide: true,
      body: `${origin}<div class="frota-data-grid" style="margin-top:14px">${dataItem('Tipo', label(item.TIPO_MANUTENCAO))}${dataItem('Status', label(item.STATUS))}${dataItem('Abertura', formatDate(item.DATA_ABERTURA, true))}${dataItem('Previsão', formatDate(item.DATA_PREVISTA, true))}${dataItem('Conclusão', formatDate(item.DATA_CONCLUSAO, true))}${dataItem('Oficina', item.OFICINA_FORNECEDOR || '—')}${dataItem('KM de abertura', number(item.KM_ABERTURA))}${dataItem('Valor total', money(item.VALOR_TOTAL))}</div><div class="frota-card-note"><strong>Problema informado</strong><br>${esc(item.DESCRICAO_PROBLEMA || '—')}</div>${item.SERVICO_REALIZADO ? `<div class="frota-card-note"><strong>Serviço realizado</strong><br>${esc(item.SERVICO_REALIZADO)}</div>` : ''}${item.PECAS_SUBSTITUIDAS ? `<div class="frota-card-note"><strong>Peças substituídas</strong><br>${esc(item.PECAS_SUBSTITUIDAS)}</div>` : ''}${item.OBSERVACAO ? `<div class="frota-card-note"><strong>Observação</strong><br>${esc(item.OBSERVACAO)}</div>` : ''}`
    });
  }

  /* Arquivos */
  async function renderFiles() {
    const view = $('[data-frota-view="arquivos"]', fleetState.root);
    if (!view || !view.isConnected) return;
    const vehicles = await ensureVehicleOptions();
    if (!view.isConnected) return;
    const vehicleFilter = $('[data-file-vehicle]', view);
    vehicleFilter.innerHTML = vehicleSelectHtml(vehicles, fleetState.focusVehicle?.ID_VIATURA || '', 'Todas as viaturas');
    const categoryFilter = $('[data-file-category]', view);
    categoryFilter.innerHTML = optionList(fleetState.bootstrap.opcoes.categoriasArquivos || [], '', 'Todas as categorias');
    const newButton = $('[data-new-file]', view);
    newButton.hidden = !can('FROTA_ENVIAR_ARQUIVOS');
    newButton.addEventListener('click', () => openFileUpload(vehicleFilter.value));
    $('[data-file-search]', view).addEventListener('input', debounce(() => { fleetState.pages.files = 1; loadFiles(view); }));
    vehicleFilter.addEventListener('change', () => { fleetState.pages.files = 1; loadFiles(view); });
    categoryFilter.addEventListener('change', () => { fleetState.pages.files = 1; loadFiles(view); });
    $('[data-file-refresh]', view).addEventListener('click', () => loadFiles(view));
    await loadFiles(view);
  }

  async function loadFiles(view) {
    if (!view || !view.isConnected) return;
    const region = $('#frota-file-list', view);
    if (!region) return;
    region.innerHTML = loadingHtml();
    try {
      const result = await api('frota.arquivos.listar', {
        page: fleetState.pages.files, pageSize: 18,
        query: $('[data-file-search]', view).value,
        vehicleId: $('[data-file-vehicle]', view).value,
        category: $('[data-file-category]', view).value
      });
      region.innerHTML = result.items.length ? result.items.map(fileCardHtml).join('') : emptyHtml('Nenhum arquivo encontrado');
      renderPagination($('#frota-file-pagination', view), result, page => { fleetState.pages.files = page; loadFiles(view); });
      $$('[data-file-edit]', region).forEach(button => button.addEventListener('click', () => {
        const file = result.items.find(item => item.ID_REGISTRO === button.dataset.fileEdit);
        openFileEdit(file);
      }));
      $$('[data-file-delete]', region).forEach(button => button.addEventListener('click', () => {
        const file = result.items.find(item => item.ID_REGISTRO === button.dataset.fileDelete);
        openFileDelete(file);
      }));
    } catch (error) { showError(region, error); }
  }

  function fileCardHtml(file) {
    const extension = String(file.NOME_ARQUIVO || '').split('.').pop().toUpperCase().slice(0, 5) || 'DOC';
    return `<article class="frota-file-card"><span class="frota-file-icon">${esc(extension)}</span><div><h4 title="${esc(file.NOME_ARQUIVO)}">${esc(file.NOME_ARQUIVO)}</h4><small>${esc(file.PREFIXO)} · ${esc(label(file.CATEGORIA))} · ${humanSize(file.TAMANHO_BYTES)}</small><p>${esc(file.DESCRICAO || 'Sem descrição')}</p><small>Enviado por ${esc(file.ENVIADO_POR_NOME || formatMasp(file.ENVIADO_POR_MASP))} em ${formatDate(file.DATA_HORA_UPLOAD)}</small></div><div class="frota-file-actions"><a href="${esc(file.LINK_ARQUIVO)}" target="_blank" rel="noopener">Abrir no Drive</a>${can('FROTA_ENVIAR_ARQUIVOS') ? `<button type="button" class="btn btn-ghost btn-sm" data-file-edit="${esc(file.ID_REGISTRO)}">Editar</button>` : ''}${can('FROTA_EXCLUIR_ARQUIVOS') ? `<button type="button" class="btn btn-ghost btn-sm" data-file-delete="${esc(file.ID_REGISTRO)}">Excluir</button>` : ''}</div></article>`;
  }

  function humanSize(bytes) {
    const value = Number(bytes || 0);
    if (value < 1024) return `${value} B`;
    if (value < 1048576) return `${(value / 1024).toFixed(1)} KB`;
    return `${(value / 1048576).toFixed(1)} MB`;
  }

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('Não foi possível ler o arquivo selecionado.'));
      reader.readAsDataURL(file);
    });
  }

  async function openFileUpload(selectedVehicleId = '') {
    const vehicles = await ensureVehicleOptions();
    openModal({
      title: 'Enviar arquivo', eyebrow: 'Pasta da viatura no Google Drive', submitText: 'Enviar arquivo', busyText: 'Enviando…',
      body: `<div class="frota-form"><label class="frota-field"><span>Viatura *</span><select name="vehicleId" required>${vehicleSelectHtml(vehicles, selectedVehicleId || fleetState.focusVehicle?.ID_VIATURA || '', 'Selecione')}</select></label><label class="frota-field"><span>Arquivo (até 8 MB) *</span><input name="fileInput" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,.doc,.docx,.xls,.xlsx,.csv,.txt" required></label><div class="frota-form-grid"><label class="frota-field"><span>Categoria *</span><select name="category" required>${optionList(fleetState.bootstrap.opcoes.categoriasArquivos || [], '', 'Selecione')}</select></label><label class="frota-field"><span>Data do documento</span><input name="documentDate" type="date"></label></div><label class="frota-field"><span>Descrição</span><textarea name="description" rows="3"></textarea></label><label class="frota-field"><span>Observação do upload</span><textarea name="observation" rows="2"></textarea></label></div>`,
      onSubmit: async (data, form) => {
        const selected = $('[name="fileInput"]', form).files[0];
        if (!selected) throw new Error('Selecione um arquivo.');
        if (selected.size > Number(fleetState.bootstrap.opcoes.maxUploadBytes || 8388608)) throw new Error('O arquivo excede o limite de 8 MB.');
        const dataUrl = await fileToDataUrl(selected);
        await api('frota.arquivos.upload', {
          vehicleId: data.vehicleId, category: data.category, documentDate: data.documentDate,
          description: data.description, observation: data.observation,
          file: { name: selected.name, type: selected.type, size: selected.size, dataUrl }
        });
        toast('Arquivo enviado', 'O documento foi salvo na pasta identificada da viatura.');
        if (fleetState.tab === 'arquivos') await loadFiles($('[data-frota-view="arquivos"]', fleetState.root));
      }
    });
  }

  function openFileEdit(file) {
    openModal({
      title: 'Editar informações do arquivo', eyebrow: `${file.PREFIXO} · ${file.NOME_ARQUIVO}`, submitText: 'Salvar informações',
      body: `<div class="frota-form"><label class="frota-field"><span>Categoria</span><select name="category">${optionList(fleetState.bootstrap.opcoes.categoriasArquivos || [], file.CATEGORIA, 'Selecione')}</select></label><label class="frota-field"><span>Data do documento</span><input name="documentDate" type="date" value="${dateInput(file.DATA_DOCUMENTO)}"></label><label class="frota-field"><span>Descrição</span><textarea name="description" rows="4">${esc(file.DESCRICAO || '')}</textarea></label><label class="frota-field"><span>Justificativa</span><textarea name="justification" rows="2"></textarea></label></div>`,
      onSubmit: async data => {
        await api('frota.arquivos.editar', Object.assign({ id: file.ID_REGISTRO }, data));
        toast('Arquivo atualizado');
        await loadFiles($('[data-frota-view="arquivos"]', fleetState.root));
      }
    });
  }

  function openFileDelete(file) {
    openModal({
      title: 'Excluir arquivo', eyebrow: `${file.PREFIXO} · ${file.NOME_ARQUIVO}`, submitText: 'Mover para a lixeira',
      body: `<div class="form-message warning">O arquivo será movido para a lixeira do Google Drive e o registro ficará preservado no histórico.</div><label class="frota-field" style="margin-top:14px"><span>Justificativa *</span><textarea name="justification" rows="3" required></textarea></label>`,
      onSubmit: async data => {
        await api('frota.arquivos.excluir', { id: file.ID_REGISTRO, justification: data.justification });
        toast('Arquivo excluído', 'A operação foi registrada na auditoria.', 'warning');
        await loadFiles($('[data-frota-view="arquivos"]', fleetState.root));
      }
    });
  }

  /* Defeitos e observações */
  async function renderDefects() {
    const view = $('[data-frota-view="defeitos"]', fleetState.root);
    if (!view || !view.isConnected) return;
    const vehicles = await ensureVehicleOptions();
    if (!view.isConnected) return;
    const vehicleFilter = $('[data-defect-vehicle]', view);
    vehicleFilter.innerHTML = vehicleSelectHtml(vehicles, fleetState.focusVehicle?.ID_VIATURA || '', 'Todas as viaturas');
    const newButton = $('[data-new-defect]', view);
    newButton.hidden = !can('FROTA_TRATAR_DEFEITOS');
    newButton.addEventListener('click', () => openDefectForm(vehicleFilter.value));
    $('[data-defect-search]', view).addEventListener('input', debounce(() => { fleetState.pages.defects = 1; loadDefects(view); }));
    vehicleFilter.addEventListener('change', () => { fleetState.pages.defects = 1; loadDefects(view); });
    $('[data-defect-status]', view).addEventListener('change', () => { fleetState.pages.defects = 1; loadDefects(view); });
    $('[data-defect-gravity]', view).addEventListener('change', () => { fleetState.pages.defects = 1; loadDefects(view); });
    $('[data-defect-refresh]', view).addEventListener('click', () => loadDefects(view));
    await loadDefects(view);
  }

  async function loadDefects(view) {
    if (!view || !view.isConnected) return;
    const region = $('#frota-defect-list', view);
    if (!region) return;
    region.innerHTML = loadingHtml();
    try {
      const result = await api('frota.defeitos.listar', {
        page: fleetState.pages.defects, pageSize: 25,
        query: $('[data-defect-search]', view).value,
        vehicleId: $('[data-defect-vehicle]', view).value,
        status: $('[data-defect-status]', view).value,
        gravity: $('[data-defect-gravity]', view).value,
        recordId: fleetState.focusOccurrenceId,
        includeObservations: true
      });
      region.innerHTML = result.items.length ? `<table class="frota-table"><thead><tr><th>Registro</th><th>Viatura</th><th>Ocorrência</th><th>Informado por</th><th>Gravidade</th><th>Status da ocorrência</th><th>Manutenção</th><th></th></tr></thead><tbody>${result.items.map(item => {
        const occurrenceId = item.ID_REGISTRO_OCORRENCIA || item.ID_DEFEITO;
        const canOpenMaintenance = can('FROTA_GERENCIAR_MANUTENCOES') && !item.MANUTENCAO_ID && (item.REGISTRO_TIPO === 'OBSERVACAO' || !['RESOLVIDO','CANCELADO'].includes(item.STATUS_DEFEITO));
        const canManageLinked = item.MANUTENCAO_ID && can('FROTA_GERENCIAR_MANUTENCOES');
        const canViewLinked = item.MANUTENCAO_ID && !canManageLinked && can('FROTA_VISUALIZAR_MANUTENCOES');
        return `<tr><td data-label="Registro">${formatDate(item.DATA_HORA_REGISTRO)}</td><td data-label="Viatura"><strong>${esc(item.PREFIXO)}</strong><small>${esc(item.PLACA)}</small></td><td data-label="Ocorrência"><strong>${esc(label(item.REGISTRO_TIPO === 'OBSERVACAO' ? item.TIPO : item.CATEGORIA))}</strong><small>${esc(String(item.DESCRICAO || '').slice(0, 130))}</small></td><td data-label="Informado por"><strong>${esc(item.INFORMADO_POR_NOME || '—')}</strong><small>${esc(formatMasp(item.INFORMADO_POR_MASP || ''))}</small></td><td data-label="Gravidade">${badge(item.GRAVIDADE)}</td><td data-label="Status da ocorrência">${badge(item.STATUS_DEFEITO)}</td><td data-label="Manutenção">${item.MANUTENCAO_ID ? `${badge(item.MANUTENCAO_STATUS)}<small>${esc(label(item.MANUTENCAO_CLASSIFICACAO))}${item.MANUTENCAO_DATA_PREVISTA ? ` · ${formatDate(item.MANUTENCAO_DATA_PREVISTA, true)}` : ''}</small>` : '<small>Não vinculada</small>'}</td><td data-label="Ações"><div class="frota-table-actions"><button type="button" data-defect-detail="${esc(occurrenceId)}">Detalhes</button>${can('FROTA_TRATAR_DEFEITOS') && item.REGISTRO_TIPO !== 'OBSERVACAO' && !item.MANUTENCAO_ID ? `<button type="button" data-defect-treat="${esc(item.ID_DEFEITO)}">Tratar</button>` : ''}${canOpenMaintenance ? `<button type="button" data-defect-maintenance-new="${esc(occurrenceId)}">Abrir manutenção</button>` : ''}${canManageLinked ? `<button type="button" data-defect-maintenance-edit="${esc(item.MANUTENCAO_ID)}">Tratar na manutenção</button>` : ''}${canViewLinked ? `<button type="button" data-defect-maintenance-view="${esc(item.MANUTENCAO_ID)}">Ver manutenção</button>` : ''}</div></td></tr>`;
      }).join('')}</tbody></table>` : emptyHtml('Nenhuma ocorrência encontrada', 'A frota não possui defeitos ou observações com estes filtros.');
      renderPagination($('#frota-defect-pagination', view), result, page => { fleetState.pages.defects = page; loadDefects(view); });
      $$('[data-defect-detail]', region).forEach(button => button.addEventListener('click', () => {
        const item = result.items.find(row => String(row.ID_REGISTRO_OCORRENCIA || row.ID_DEFEITO) === String(button.dataset.defectDetail));
        openModal({ title: `${item.PREFIXO} — ${label(item.CATEGORIA)}`, eyebrow: formatDate(item.DATA_HORA_REGISTRO), readonly: true, wide: true, body: `<div class="frota-data-grid">${dataItem('Status da ocorrência', label(item.STATUS_DEFEITO))}${dataItem('Manutenção', item.MANUTENCAO_ID ? label(item.MANUTENCAO_STATUS) : 'Não vinculada')}${dataItem('Gravidade', label(item.GRAVIDADE), ['ALTA','VIATURA_SEM_CONDICOES_DE_USO'].includes(item.GRAVIDADE))}${dataItem('Local', item.LOCAL_DEFEITO || '—')}${dataItem('Solicitou retirada', item.SOLICITOU_RETIRADA || 'NAO')}${dataItem('Responsável', item.RESPONSAVEL_TRATAMENTO_NOME || '—')}${dataItem('Resolução', formatDate(item.DATA_HORA_RESOLUCAO))}</div><div class="frota-card-note" style="margin-top:14px">${esc(item.DESCRICAO)}</div>${item.PROVIDENCIA_ADOTADA ? `<div class="frota-card-note"><strong>Providência:</strong><br>${esc(item.PROVIDENCIA_ADOTADA)}</div>` : ''}${item.MANUTENCAO_ID ? `<div class="frota-card-note"><strong>Atendimento de oficina</strong><br>${esc(label(item.MANUTENCAO_CLASSIFICACAO))} · ${esc(label(item.MANUTENCAO_STATUS))}${item.MANUTENCAO_OFICINA ? ` · ${esc(item.MANUTENCAO_OFICINA)}` : ''}</div>` : ''}` });
      }));
      $$('[data-defect-treat]', region).forEach(button => button.addEventListener('click', () => {
        const item = result.items.find(row => row.ID_DEFEITO === button.dataset.defectTreat);
        openDefectTreatment(item);
      }));
      $$('[data-defect-maintenance-new]', region).forEach(button => button.addEventListener('click', () => {
        const item = result.items.find(row => String(row.ID_REGISTRO_OCORRENCIA || row.ID_DEFEITO) === String(button.dataset.defectMaintenanceNew));
        openMaintenanceForm('', item.ID_VIATURA, item);
      }));
      $$('[data-defect-maintenance-edit]', region).forEach(button => button.addEventListener('click', () => openMaintenanceForm(button.dataset.defectMaintenanceEdit)));
      $$('[data-defect-maintenance-view]', region).forEach(button => button.addEventListener('click', () => openMaintenanceDetails(button.dataset.defectMaintenanceView)));
      if (fleetState.focusOccurrenceId) {
        const focusedId = fleetState.focusOccurrenceId;
        fleetState.focusOccurrenceId = '';
        const item = result.items.find(row => String(row.ID_REGISTRO_OCORRENCIA || row.ID_DEFEITO) === String(focusedId));
        if (item?.MANUTENCAO_ID && can('FROTA_GERENCIAR_MANUTENCOES')) await openMaintenanceForm(item.MANUTENCAO_ID);
        else if (item?.MANUTENCAO_ID && can('FROTA_VISUALIZAR_MANUTENCOES')) await openMaintenanceDetails(item.MANUTENCAO_ID);
        else {
          const detailButton = $$('[data-defect-detail]', region).find(button => String(button.dataset.defectDetail) === String(focusedId));
          if (detailButton) detailButton.click();
        }
      }
    } catch (error) { showError(region, error); }
  }

  async function openDefectForm(selectedVehicleId = '') {
    const vehicles = await ensureVehicleOptions();
    openModal({
      title: 'Registrar ocorrência', eyebrow: 'Defeito ou irregularidade', wide: true, submitText: 'Registrar e notificar',
      body: `<div class="frota-form"><label class="frota-field"><span>Viatura *</span><select name="vehicleId" required>${vehicleSelectHtml(vehicles, selectedVehicleId || fleetState.focusVehicle?.ID_VIATURA || '', 'Selecione')}</select></label>${occurrenceFieldsHtml()}</div>`,
      onSubmit: async data => {
        await api('frota.defeitos.salvar', { vehicleId: data.vehicleId, occurrence: occurrencePayload(data, true) });
        toast('Ocorrência registrada', 'Os gestores autorizados foram notificados.');
        fleetState.vehicleOptions = null;
        await refreshBootstrap();
        await loadDefects($('[data-frota-view="defeitos"]', fleetState.root));
      }
    });
  }

  function openDefectTreatment(item) {
    const modal = openModal({
      title: 'Tratar defeito', eyebrow: `${item.PREFIXO} — ${label(item.CATEGORIA)}`, submitText: 'Salvar tratamento',
      body: `<div class="frota-card-note">${esc(item.DESCRICAO)}</div><div class="frota-form" style="margin-top:14px"><label class="frota-field"><span>Status *</span><select name="status" data-defect-treatment-status required>${optionList(['PENDENTE','EM_ANALISE','EM_REPARO','RESOLVIDO','CANCELADO'], item.STATUS_DEFEITO, 'Selecione')}</select></label><label class="frota-field"><span>Providência adotada *</span><textarea name="action" rows="4" required>${esc(item.PROVIDENCIA_ADOTADA || '')}</textarea></label><label class="frota-field"><span>Observação de resolução</span><textarea name="resolution" rows="3">${esc(item.OBSERVACAO_RESOLUCAO || '')}</textarea></label><label class="frota-check"><input name="restoreVehicle" data-restore-vehicle type="checkbox"><span><strong>Retornar o veículo para DISPONÍVEL</strong><small>Será validado se não há movimentação aberta ou outro defeito impeditivo.</small></span></label></div>`,
      onSubmit: async data => {
        const result = await api('frota.defeitos.tratar', { id: item.ID_DEFEITO, status: data.status, action: data.action, resolution: data.resolution, restoreVehicle: data.restoreVehicle });
        if (result.RESTAURACAO_SOLICITADA && !result.VIATURA_RESTAURADA) {
          toast('Defeito atualizado, mas o veículo continua indisponível', result.MOTIVO_NAO_RESTAURADA || 'Revise as demais pendências.', 'warning', 8000);
        } else if (result.VIATURA_RESTAURADA) {
          toast('Defeito resolvido', 'O veículo voltou para DISPONÍVEL.');
        } else {
          toast('Tratamento atualizado', `Status: ${label(data.status)}.`);
        }
        fleetState.vehicleOptions = null;
        await refreshBootstrap();
        const currentView = $('[data-frota-view="defeitos"]', fleetState.root);
        if (currentView) await loadDefects(currentView);
      }
    });
    const statusField = $('[data-defect-treatment-status]', modal);
    const restoreField = $('[data-restore-vehicle]', modal);
    const syncRestore = () => {
      const resolved = statusField && statusField.value === 'RESOLVIDO';
      if (restoreField) {
        restoreField.disabled = !resolved;
        if (resolved) restoreField.checked = true;
        else restoreField.checked = false;
      }
    };
    if (statusField) statusField.addEventListener('change', syncRestore);
    syncRestore();
  }

  /* Fim das rotinas complementares. */

  window.FrotaModule = { init };
})();
</script>
