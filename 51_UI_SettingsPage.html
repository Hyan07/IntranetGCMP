<template id="page-configuracoes">
  <section class="page">
    <div class="page-actions">
      <div><p class="page-description">Parâmetros da intranet, permissões administrativas e registros de auditoria.</p></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" data-settings-tab="general" type="button">Configurações gerais</button>
      <button class="tab" data-settings-tab="permissions" type="button">Permissões em massa</button>
      <button class="tab" data-settings-tab="audit" type="button">Auditoria</button>
    </div>

    <article id="settings-general-panel" class="panel settings-panel">
      <form id="settings-form">
        <div id="settings-fields" class="form-grid"></div>
        <div class="form-footer"><button class="btn btn-primary" type="submit"><i data-icon="save"></i> Salvar configurações</button></div>
      </form>
      <div class="settings-danger-zone">
        <div><p class="eyebrow">Implantação definitiva</p><h3>Zerar registros de teste</h3><p>Cria um backup e remove os dados operacionais de teste. Usuários, Pessoal, permissões, configurações e toda a Frota são preservados.</p></div>
        <button id="reset-test-data-button" class="btn btn-danger" type="button"><i data-icon="trash"></i> Zerar registros de teste</button>
      </div>
    </article>

    <article id="settings-permissions-panel" class="panel settings-bulk-panel" hidden>
      <header class="panel-header settings-bulk-heading">
        <div>
          <p class="eyebrow">Administração de acessos</p>
          <h3>Conceder permissões em massa</h3>
          <p>As permissões selecionadas serão adicionadas aos usuários marcados. Nenhuma permissão já existente será retirada.</p>
        </div>
        <button id="bulk-permissions-refresh" class="btn btn-secondary btn-sm" type="button"><i data-icon="refresh"></i> Atualizar listas</button>
      </header>
      <form id="bulk-permissions-form">
        <div class="bulk-permission-grid">
          <section class="bulk-selector" aria-labelledby="bulk-users-title">
            <div class="bulk-selector-header">
              <div><span class="bulk-step">1</span><strong id="bulk-users-title">Selecione os usuários</strong></div>
              <span id="bulk-users-count" class="tab-count">0 selecionados</span>
            </div>
            <label class="search-box bulk-search"><i data-icon="search"></i><input id="bulk-users-search" type="search" placeholder="Buscar por nome, MASP, setor ou e-mail"></label>
            <div class="bulk-selector-actions">
              <button id="bulk-users-select-visible" class="btn btn-secondary btn-sm" type="button">Selecionar exibidos</button>
              <button id="bulk-users-clear" class="btn btn-link" type="button">Limpar seleção</button>
            </div>
            <div id="bulk-users-list" class="bulk-option-list" aria-live="polite"></div>
          </section>

          <section class="bulk-selector" aria-labelledby="bulk-permissions-title">
            <div class="bulk-selector-header">
              <div><span class="bulk-step">2</span><strong id="bulk-permissions-title">Selecione as permissões</strong></div>
              <span id="bulk-permissions-count" class="tab-count">0 selecionadas</span>
            </div>
            <label class="search-box bulk-search"><i data-icon="search"></i><input id="bulk-permissions-search" type="search" placeholder="Buscar módulo, ação ou descrição"></label>
            <div class="bulk-selector-actions">
              <button id="bulk-permissions-select-visible" class="btn btn-secondary btn-sm" type="button">Selecionar exibidas</button>
              <button id="bulk-permissions-clear" class="btn btn-link" type="button">Limpar seleção</button>
            </div>
            <div id="bulk-permissions-list" class="bulk-option-list bulk-permission-list" aria-live="polite"></div>
          </section>
        </div>

        <label class="field bulk-justification"><span>Justificativa administrativa (opcional)</span><textarea id="bulk-permissions-justification" name="justification" rows="2" maxlength="500" placeholder="Ex.: atualização de acessos da equipe operacional"></textarea></label>
        <div id="bulk-permissions-summary" class="bulk-selection-summary">Selecione os usuários e as permissões que deseja conceder.</div>
        <div class="form-footer"><button id="bulk-permissions-submit" class="btn btn-primary" type="submit" disabled><i data-icon="shield"></i> Conceder permissões</button></div>
      </form>
    </article>

    <article id="settings-audit-panel" class="panel data-panel" hidden>
      <div class="toolbar"><label class="search-box"><i data-icon="search"></i><input id="audit-search" type="search" placeholder="Buscar módulo, ação, MASP ou registro"></label><input id="audit-start" class="select-control" type="date" aria-label="Data inicial"><input id="audit-end" class="select-control" type="date" aria-label="Data final"><button id="audit-refresh" class="icon-btn bordered" type="button" aria-label="Atualizar"><i data-icon="refresh"></i></button></div>
      <div id="audit-table" class="table-region"></div><div id="audit-pagination" class="pagination"></div>
    </article>
  </section>
</template>
