<template id="page-documentos">
  <section class="page">
    <div class="page-actions"><div><p class="page-description">Arquivos institucionais com vínculos, prazos e níveis de acesso.</p></div><button id="new-document-button" class="btn btn-primary" type="button"><i data-icon="plus"></i> Novo documento</button></div>
    <div id="document-summary" class="mini-metrics"></div>
    <article class="panel data-panel">
      <div class="toolbar"><label class="search-box"><i data-icon="search"></i><input id="documents-search" type="search" placeholder="Buscar número, assunto, origem ou setor"></label><select id="documents-level" class="select-control"><option value="">Todos os níveis</option><option value="PUBLICO_INTERNO">Público interno</option><option value="RESTRITO_SETOR">Restrito ao setor</option><option value="USUARIOS_SELECIONADOS">Usuários selecionados</option><option value="CONFIDENCIAL">Confidencial</option><option value="SIGILOSO_ADMINISTRATIVO">Sigiloso</option></select><button id="documents-refresh" class="icon-btn bordered" type="button" aria-label="Atualizar"><i data-icon="refresh"></i></button></div>
      <div id="documents-table" class="table-region"></div><div id="documents-pagination" class="pagination"></div>
    </article>
  </section>
</template>
